project_id = "cerberus-forge-deploy"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[db.migrations]
enabled = true

[db.seed]
enabled = false

[edge_runtime]
enabled = true
policy = "per_worker"
deno_version = 2

[functions.cerberus-public-api]
enabled = true
verify_jwt = false
entrypoint = "./functions/cerberus-public-api/index.ts"
