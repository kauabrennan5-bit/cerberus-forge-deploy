# Cerberus Finds — Supabase local rebuild configuration.
# Safe to commit: secrets stay in environment variables, never here.
project_id = "cerberus-forge-deploy"

[db]
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[functions.cerberus-public-api]
verify_jwt = false

[functions.cerberus-telegram-gateway]
verify_jwt = false
