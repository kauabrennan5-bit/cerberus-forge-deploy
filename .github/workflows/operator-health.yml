name: Cerberus Operator Health

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/operator-health.yml"
      - "scripts/run-operator-health-direct.ts"
      - "server/services/operatorHealthChecksV2.ts"
      - "server/services/telegramDiagnostics.ts"
      - "supabase/functions/cerberus-public-api/**"
      - "supabase/functions/cerberus-telegram-gateway/**"
      - "tests/operatorHealthDirectMigration.test.ts"
  schedule:
    - cron: "5,15,25,35,45,55 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cerberus-operator-health
  cancel-in-progress: false

jobs:
  operator-health:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push' || vars.CERBERUS_SERVERLESS_OBSERVABILITY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_URL: https://ppsxlclycyinhhoqijvz.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      PUBLIC_SITE_URL: https://cerberus-finds.pages.dev
      PUBLIC_BACKEND_URL: https://ppsxlclycyinhhoqijvz.supabase.co/functions/v1/cerberus-telegram-gateway
      PUBLIC_CATALOG_URL: https://ppsxlclycyinhhoqijvz.supabase.co/functions/v1/cerberus-public-api/products
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_WEBHOOK_URL: https://ppsxlclycyinhhoqijvz.supabase.co/functions/v1/cerberus-telegram-gateway/webhook
      SHOPEE_APP_ID: ${{ secrets.SHOPEE_APP_ID }}
      SHOPEE_APP_SECRET: ${{ secrets.SHOPEE_APP_SECRET }}
      SHOPEE_AFFILIATE_APP_ID: ${{ secrets.SHOPEE_AFFILIATE_APP_ID }}
      SHOPEE_AFFILIATE_APP_SECRET: ${{ secrets.SHOPEE_AFFILIATE_APP_SECRET }}
      SHOPEE_AFFILIATE_API_BASE_URL: https://open-api.affiliate.shopee.com.br/graphql
      NEWSLETTER_WEEKLY_ENABLED: "false"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.1
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run direct read-only Operator health
        run: npx tsx scripts/run-operator-health-direct.ts
      - name: Prove Render-free read-only boundary
        shell: bash
        run: |
          set -euo pipefail
          ! grep -qi 'onrender\.com' .github/workflows/operator-health.yml
          ! grep -qE 'ACTIONS_ID_TOKEN_REQUEST|OIDC_AUDIENCE|CERBERUS_RENDER_RUNTIME_ENABLED' .github/workflows/operator-health.yml
          grep -q 'runOperatorHealthChecksV2' scripts/run-operator-health-direct.ts
          grep -q 'AUTONOMOUS_PUBLICATION_CONTRACT_VIOLATED' scripts/run-operator-health-direct.ts
          echo 'OPERATOR_EXTERNAL=DIRECT_READ_ONLY_RENDER_FREE'
