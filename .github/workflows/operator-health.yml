name: Cerberus Operator Health

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/operator-health.yml"
      - "scripts/run-operator-health-direct.ts"
      - "server/services/operatorHealthChecksV2.ts"
  schedule:
    - cron: "5,15,25,35,45,55 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cerberus-operator-health
  cancel-in-progress: false

jobs:
  operator-health:
    if: github.event_name == 'workflow_dispatch' || vars.CERBERUS_SERVERLESS_OBSERVABILITY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      SUPABASE_URL: https://ppsxlclycyinhhoqijvz.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      PUBLIC_SITE_URL: https://cerberus-finds.pages.dev
      PUBLIC_BACKEND_URL: https://ppsxlclycyinhhoqijvz.supabase.co/functions/v1/cerberus-telegram-gateway
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_WEBHOOK_URL: https://ppsxlclycyinhhoqijvz.supabase.co/functions/v1/cerberus-telegram-gateway/webhook
      SHOPEE_APP_ID: ${{ secrets.SHOPEE_APP_ID }}
      SHOPEE_APP_SECRET: ${{ secrets.SHOPEE_APP_SECRET }}
      SHOPEE_AFFILIATE_APP_ID: ${{ secrets.SHOPEE_AFFILIATE_APP_ID }}
      SHOPEE_AFFILIATE_APP_SECRET: ${{ secrets.SHOPEE_AFFILIATE_APP_SECRET }}
      SHOPEE_AFFILIATE_API_BASE_URL: ${{ vars.SHOPEE_AFFILIATE_API_BASE_URL }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
      NEWSLETTER_WEEKLY_ENABLED: "false"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.1
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run direct read-only Operator health
        run: npx tsx scripts/run-operator-health-direct.ts
      - name: Prove Render-free health boundary
        shell: bash
        run: |
          set -euo pipefail
          ! grep -q 'onrender.com' .github/workflows/operator-health.yml
          grep -q 'runOperatorHealthChecksV2' scripts/run-operator-health-direct.ts
          grep -q 'AUTONOMOUS_PUBLICATION_CONTRACT_VIOLATED' scripts/run-operator-health-direct.ts
          echo 'OPERATOR_EXTERNAL=DIRECT_READ_ONLY'
