name: Cerberus Operator Health

on:
  schedule:
    - cron: "5,15,25,35,45,55 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cerberus-operator-health
  cancel-in-progress: false

jobs:
  operator-health:
    if: github.event_name == 'workflow_dispatch' || vars.CERBERUS_SERVERLESS_OPERATOR_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      SUPABASE_URL: https://ppsxlclycyinhhoqijvz.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      OPERATOR_SCHEDULER_MODE: external
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.1
          cache: npm
      - run: npm ci
      - name: Run one bounded Operator cycle directly
        run: npx tsx scripts/run-serverless-ops-direct.ts operator-health
