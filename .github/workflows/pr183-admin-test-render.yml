name: PR183 Administrative Email Render

on:
  push:
    branches:
      - ops/pr183-admin-test-render

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ops/pr183-admin-test-render
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Render merged newsletter HTML and assert masthead invariants
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/render-admin-test.ts" <<'TS'
          import fs from "node:fs";
          import type { Product } from "./src/types";
          import { renderNewsletterCollectionCampaign } from "./server/services/newsletterCampaignTemplate";
          import {
            DISPLAY_TITLE_REVIEW_VERSION,
            IMAGE_REVIEW_VERSION,
            imageUrlFingerprint,
          } from "./server/services/productEditorialReview";

          const createdAt = "2026-09-05T17:40:00.000Z";
          const heroImage = "https://cf.shopee.com.br/file/sg-11134201-822wo-mo9o29dk8gzx71";
          const product: Product = {
            id: "pr183-admin-hero",
            ref: "REF-PR183-ADMIN",
            produto: "Produto administrativo PR183",
            rawTitle: "Produto administrativo PR183",
            displayTitle: "Produto de teste — imagem somente no HERO",
            displayTitleStatus: "ready",
            displayTitleReviewedAt: createdAt,
            displayTitleReviewModel: "pr183-admin-test",
            displayTitleReviewVersion: DISPLAY_TITLE_REVIEW_VERSION,
            categoria: "CALÇADOS & ACESSÓRIOS",
            preco: 199.9,
            imagens: [heroImage],
            imageEditorialStatus: "clean",
            imageCuration: {
              status: "ready",
              rawImageUrls: [heroImage],
              primaryImageUrl: heroImage,
              galleryImageUrls: [],
              assessments: [{ url: heroImage, decision: "clean", confidence: "HIGH", reason: "admin visual test" }],
            },
            imageReviewedAt: createdAt,
            imageReviewModel: "pr183-admin-test",
            imageReviewVersion: IMAGE_REVIEW_VERSION,
            imageReviewFingerprint: imageUrlFingerprint(heroImage),
            link: "https://shopee.com.br/product/1530442944/23794344926",
            ativo: true,
            destaque: true,
            status: "published",
            descricao: "Validação visual administrativa do masthead após o PR #183.",
            createdAt,
          };

          const subject = "[TESTE CERBERUS · PR183] Validação visual pós-deploy";
          const rendered = renderNewsletterCollectionCampaign([product], {
            subject,
            trackingCampaignId: "pr183-admin-test",
            mastheadImageStatus: "clean",
            mastheadLogoStatus: "available",
          });

          const html = rendered.html;
          const logo = "cerberus-logo-user-tight.png";
          const logoCount = (html.match(new RegExp(logo.replace(/[.*+?^${}()|[\\]\\\\]/g, "\\$&"), "g")) || []).length;
          const heroCount = (html.match(new RegExp(heroImage.replace(/[.*+?^${}()|[\\]\\\\]/g, "\\$&"), "g")) || []).length;
          if (logoCount !== 1) throw new Error(`logo_count=${logoCount}`);
          if (heroCount !== 1) throw new Error(`hero_count=${heroCount}`);
          if (/<img[^>]+class="email-masthead-logo-print"/i.test(html)) throw new Error("duplicate_branding_element_detected");
          if (/src="[^"]*cerberus-logo-square\.png/i.test(html)) throw new Error("legacy_logo_element_detected");
          if (/<(?:img|td)[^>]+class="email-masthead-image"/i.test(html)) throw new Error("editorial_masthead_slot_present");
          if (!/class="email-masthead-logo"[^>]+width="96" height="70"/i.test(html)) throw new Error("logo_dimensions_invalid");
          if (!/class="email-masthead-brand-mark" width="108" height="82"/i.test(html)) throw new Error("brand_cell_dimensions_invalid");
          if (!/cerberus-logo-user-tight\.png/i.test(html)) throw new Error("user_selected_logo_missing");

          fs.writeFileSync("admin-test-output.html", html);
          fs.writeFileSync("admin-test-meta.json", JSON.stringify({
            sourceSha: process.env.GITHUB_SHA,
            subject,
            logoCount,
            heroCount,
            logoAsset: "cerberus-logo-user-tight.png",
            logoSize: "96x70",
            brandCell: "108x82",
            mastheadEditorialImage: false,
            duplicateBranding: false,
          }, null, 2));
          TS
          cp "$RUNNER_TEMP/render-admin-test.ts" render-admin-test.ts
          node --import tsx/esm render-admin-test.ts
          rm render-admin-test.ts
      - name: Persist render output and remove one-off workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/pr183-admin-test-render.yml
          git add admin-test-output.html admin-test-meta.json
          git diff --cached --check
          git commit -m "ops: persist PR183 administrative render proof"
          git push origin HEAD:ops/pr183-admin-test-render
