          replace_once(base,
              '  const auditedBreakdown = { ...(candidate.breakdown as unknown as Record<string, unknown>), priceEvidence: candidate.priceEvidence };\n  await curatorRepo.saveAutonomousCuratorCategoryResult({ runId, category: candidate.category, searchQuery: candidate.query, shopId: candidate.shopId, itemId: candidate.itemId, sourceProductUrl: candidate.sourceProductUrl, rawTitle: candidate.rawTitle, displayTitle: candidate.displayTitle, score: candidate.score, scoreBreakdown: auditedBreakdown, decision: "auto_published", reason: "PUBLISHED_FROM_CONTINUOUS_CURATOR_V2_THROUGH_HARD_GATE_AND_PUBLICLY_VALIDATED", productId });',
