              '  if (!bestOfLotFallback && (!primaryAssessment || primaryAssessment.decision !== "clean" || primaryAssessment.confidence === "LOW")) {\n    errors.push("PUBLICATION_IMAGE_PRIMARY_NOT_EDITORIALLY_APPROVED");\n  }\n  if (!bestOfLotFallback && product.imageCuration?.assessments.some(assessment => assessment.decision === "off_brand" && assessment.confidence !== "LOW")) {\n    errors.push("PUBLICATION_IMAGE_OFF_BRAND");\n  }')
          replace_once(gate,
              '  if (!displayTitle || (!manualEditorialOverride && (displayTitle === rawTitle || !isEditorialDisplayTitle(displayTitle)))) errors.push("PUBLICATION_DISPLAY_TITLE_INVALID");',
              '  if (!displayTitle || (!editorialOverride && (displayTitle === rawTitle || !isEditorialDisplayTitle(displayTitle)))) errors.push("PUBLICATION_DISPLAY_TITLE_INVALID");')
          replace_once(gate,
              '  if (!manualEditorialOverride && (!Number.isFinite(evidence.maximumCatalogSimilarity) || evidence.maximumCatalogSimilarity >= MAX_CATALOG_SIMILARITY)) {',
              '  if (!editorialOverride && (!Number.isFinite(evidence.maximumCatalogSimilarity) || evidence.maximumCatalogSimilarity >= MAX_CATALOG_SIMILARITY)) {')
          replace_once(gate,
              '  if (!manualEditorialOverride && evidence.offBrand) errors.push("PUBLICATION_OFF_BRAND");\n  if (!manualEditorialOverride && !evidence.lifecycleApproved) errors.push("PUBLICATION_PIPELINE_NOT_APPROVED");\n  if (!manualEditorialOverride && /REVIEW/i.test(String(evidence.reviewState || ""))) errors.push("PUBLICATION_REVIEW_STATE_FORBIDDEN");',
              '  if (!editorialOverride && evidence.offBrand) errors.push("PUBLICATION_OFF_BRAND");\n  if (!editorialOverride && !evidence.lifecycleApproved) errors.push("PUBLICATION_PIPELINE_NOT_APPROVED");\n  if (!editorialOverride && /REVIEW/i.test(String(evidence.reviewState || ""))) errors.push("PUBLICATION_REVIEW_STATE_FORBIDDEN");')
          replace_once(gate,
              '      manualEditorialOverride: input.evidence.manualEditorialOverride === true,\n    },',
              '      manualEditorialOverride: input.evidence.manualEditorialOverride === true,\n      bestOfLotFallback: input.evidence.bestOfLotFallback === true,\n      publicationWarnings: [...new Set((input.evidence.publicationWarnings || []).map(value => String(value || "").replace(/\\s+/g, " ").trim().slice(0, 180)).filter(Boolean))].slice(0, 12),\n    },')

