name: PR183 Repair Newsletter Regression Tests

on:
  push:
    branches:
      - fix/newsletter-user-logo-single-mark

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/newsletter-user-logo-single-mark
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Update obsolete newsletter expectations
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('tests/newsletterCampaign.test.ts')
          s = p.read_text()

          replacements = [
            (
              '  assert.equal(imageTags.length, 3);',
              '  assert.equal(imageTags.length, 2);',
            ),
            (
              '''  assert.equal(rendered.mastheadLogoUrl, "https://cerberus-forge-deploy-backend.onrender.com/assets/newsletter/branding/cerberus-logo-official.png");\n  assert.match(rendered.html, /class="email-masthead-logo"[^>]+width="64" height="44"/);\n  assert.match(rendered.html, /class="email-masthead-logo-print"[^>]+cerberus-logo-square\\.png[^>]+width="156" height="156"/);\n  assert.match(rendered.html, /class="email-masthead-brand-mark" width="72" height="52"/);''',
              '''  assert.equal(rendered.mastheadLogoUrl, "https://cerberus-forge-deploy-backend.onrender.com/assets/newsletter/branding/cerberus-logo-user-tight.png");\n  assert.match(rendered.html, /class="email-masthead-logo"[^>]+width="96" height="70"/);\n  assert.doesNotMatch(rendered.html, /email-masthead-logo-print|cerberus-logo-square\\.png/);\n  assert.match(rendered.html, /class="email-masthead-brand-mark" width="108" height="82"/);\n  assert.match(rendered.html, /class="email-masthead-brand-mark"[^>]+bgcolor="#F2EDE4"/);''',
            ),
            (
              '''test("MASTHEAD Variant B uses clean canonical hero imagery and falls back to A", () => {\n  const products = Array.from({ length: 5 }, (_, index) => makeCollectionProduct(index));\n  products[0].imageEditorialStatus = "clean";\n  const variantB = renderNewsletterProductCollection(products, { trackingCampaignId: "campaign-masthead-b" });\n  assert.equal(variantB.mastheadVariant, "B");\n  assert.equal(variantB.mastheadImageUrl, products[0].imagens[0]);\n  assert.match(variantB.html, /editorial-masthead-b/);\n  assert.match(variantB.html, /class="email-masthead-image"/);\n  assert.match(variantB.html, /width="250" height="210"/);\n  assert.match(variantB.html, /alt="Imagem editorial da edição Cerberus Finds"/);\n  assert.doesNotMatch(variantB.html, /display\\\\s*:\\\\s*(?:flex|grid)/i);\n\n  const fallback = renderNewsletterProductCollection(products, {\n    trackingCampaignId: "campaign-masthead-fallback",\n    mastheadImageStatus: "unavailable",\n    mastheadLogoStatus: "unavailable",\n  });\n  assert.equal(fallback.mastheadVariant, "A");\n  assert.equal(fallback.mastheadImageUrl, null);\n  assert.equal(fallback.mastheadLogoUrl, null);\n  assert.match(fallback.html, /editorial-masthead-a/);\n  assert.match(fallback.html, /CF<\\/font><\\/span>/);\n  assert.doesNotMatch(fallback.html, /class="email-masthead-image"/);\n});''',
              '''test("MASTHEAD never reuses product #1 imagery and falls back to A without a dedicated editorial asset", () => {\n  const products = Array.from({ length: 5 }, (_, index) => makeCollectionProduct(index));\n  products[0].imageEditorialStatus = "clean";\n  const withoutDedicatedAsset = renderNewsletterProductCollection(products, { trackingCampaignId: "campaign-masthead-no-product-fallback" });\n  assert.equal(withoutDedicatedAsset.mastheadVariant, "A");\n  assert.equal(withoutDedicatedAsset.mastheadImageUrl, null);\n  assert.match(withoutDedicatedAsset.html, /editorial-masthead-a/);\n  assert.doesNotMatch(withoutDedicatedAsset.html, /class="email-masthead-image"/);\n  assert.equal((withoutDedicatedAsset.html.match(new RegExp(products[0].imagens[0].replace(/[.*+?^${}()|[\\]\\\\]/g, "\\\\$&"), "g")) || []).length, 1);\n\n  const fallback = renderNewsletterProductCollection(products, {\n    trackingCampaignId: "campaign-masthead-fallback",\n    mastheadImageStatus: "unavailable",\n    mastheadLogoStatus: "unavailable",\n  });\n  assert.equal(fallback.mastheadVariant, "A");\n  assert.equal(fallback.mastheadImageUrl, null);\n  assert.equal(fallback.mastheadLogoUrl, null);\n  assert.match(fallback.html, /editorial-masthead-a/);\n  assert.match(fallback.html, /CF<\\/font><\\/span>/);\n  assert.doesNotMatch(fallback.html, /class="email-masthead-image"/);\n});''',
            ),
            (
              '  assert.equal(imageTags.length, 11);',
              '  assert.equal(imageTags.length, 10);',
            ),
          ]

          for old, new in replacements:
            count = s.count(old)
            if count != 1:
              raise SystemExit(f'Expected exactly one match, got {count}: {old[:90]!r}')
            s = s.replace(old, new, 1)

          p.write_text(s)
          PY
      - name: Run focused newsletter regression suite
        run: node --import tsx/esm --test --test-concurrency=1 tests/newsletterCampaign.test.ts tests/newsletterCollectionBrandSlotRegression.test.ts tests/newsletterWeeklyBrandingSubjectRegression.test.ts tests/newsletterWeeklyCampaign.test.ts tests/newsletterWeeklyDesignTest.test.ts
      - name: Remove one-off repair workflow and push patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/pr183-repair-tests.yml
          git add tests/newsletterCampaign.test.ts
          git diff --cached --check
          git commit -m "test: align newsletter regressions with single-brand masthead"
          git push origin HEAD:fix/newsletter-user-logo-single-mark
