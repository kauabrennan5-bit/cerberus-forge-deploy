name: Materialize Weekly Telegram Recovery

on:
  push:
    branches:
      - diag/weekly-test-telegram-recovery-materialize-2026-08-29

permissions:
  contents: write

jobs:
  materialize-and-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      TARGET_BRANCH: fix/weekly-test-telegram-recovery-v2-2026-08-29
      EXPECTED_BASE: df214bfbdda31e4cb0544ee99f183872309a504d
    steps:
      - name: Checkout diagnostic carrier
        uses: actions/checkout@v4
        with:
          path: carrier
          fetch-depth: 1

      - name: Validate materializer syntax
        run: python -m py_compile carrier/.github/scripts/materialize_weekly_telegram_recovery.py

      - name: Preserve materializer outside Git worktrees
        run: cp carrier/.github/scripts/materialize_weekly_telegram_recovery.py "$RUNNER_TEMP/materialize.py"

      - name: Checkout clean functional target
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          path: functional
          fetch-depth: 0

      - name: Materialize exact functional patch
        working-directory: functional
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_BASE"
          python "$RUNNER_TEMP/materialize.py"
          git add -N tests/newsletterWeeklyTelegramRecovery.test.ts

          mapfile -t files < <({ git diff --name-only; git ls-files --others --exclude-standard; } | sort -u)
          printf 'MATERIALIZED_FILE=%s\n' "${files[@]}"
          expected=(
            server/services/newsletterWeeklyCampaign.ts
            server/services/telegramBot.ts
            tests/newsletterWeeklyTelegramRecovery.test.ts
          )
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
          test "${#files[@]}" -eq "${#expected_sorted[@]}"
          for i in "${!expected_sorted[@]}"; do
            test "${files[$i]}" = "${expected_sorted[$i]}"
          done

          grep -q 'telegramChatId?: string | number' server/services/newsletterWeeklyCampaign.ts
          grep -q 'redeliverLatestWeeklyTestDraftCard' server/services/newsletterWeeklyCampaign.ts
          grep -q 'telegramChatId: chatId' server/services/telegramBot.ts
          grep -q 'const recovery = await redeliverLatestWeeklyTestDraftCard({ chatId });' server/services/telegramBot.ts

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functional/package-lock.json

      - name: Install dependencies
        working-directory: functional
        run: npm ci

      - name: Directed weekly Telegram recovery tests
        working-directory: functional
        run: |
          node --import tsx/esm --test --test-concurrency=1 --test-reporter=tap \
            tests/newsletterWeeklyTelegramRecovery.test.ts \
            tests/newsletterWeeklyDiagnostics.test.ts \
            tests/newsletterWeeklyCampaign.test.ts \
            tests/newsletterWeeklyBrevoProvider.test.ts

      - name: TypeScript and lint
        working-directory: functional
        run: npm run lint

      - name: Full global suite
        working-directory: functional
        run: npm test

      - name: Production build
        working-directory: functional
        run: npm run build

      - name: Diff check
        working-directory: functional
        run: git diff --check

      - name: Secret scan changed content
        working-directory: functional
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/gitleaks-scan
          git diff --no-ext-diff > /tmp/gitleaks-scan/weekly-telegram-recovery.patch
          curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks detect --no-git --source /tmp/gitleaks-scan --redact --exit-code 1

      - name: Persist functional commit only after green gate
        working-directory: functional
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            server/services/newsletterWeeklyCampaign.ts \
            server/services/telegramBot.ts \
            tests/newsletterWeeklyTelegramRecovery.test.ts
          git diff --cached --check
          test "$(git diff --cached --name-only | wc -l)" -eq 3
          git commit -m "fix: recover weekly test Telegram approval card"
          git push origin HEAD:"$TARGET_BRANCH"
          echo "FUNCTIONAL_SHA=$(git rev-parse HEAD)"
