name: Weekly test recipient ensure

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "server/services/newsletterWeeklyBrevoTestRecipient.ts"
      - "server/routes/newsletterWeeklyRoutes.ts"
      - ".github/workflows/weekly-test-recipient-ensure.yml"

permissions:
  contents: read

concurrency:
  group: weekly-test-recipient-ensure
  cancel-in-progress: false

jobs:
  ensure-test-recipient:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[ensure-weekly-test-recipient]')
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CERBERUS_HEALTH_URL: ${{ secrets.CERBERUS_HEALTH_URL }}
      CERBERUS_AUTOMATION_TOKEN: ${{ secrets.CERBERUS_AUTOMATION_TOKEN }}
    steps:
      - name: Ensure only NEWSLETTER_TEST_EMAIL in Brevo
        shell: bash
        run: |
          set -euo pipefail
          [ -n "${CERBERUS_HEALTH_URL:-}" ] || { echo "CERBERUS_HEALTH_URL missing"; exit 1; }
          [ -n "${CERBERUS_AUTOMATION_TOKEN:-}" ] || { echo "CERBERUS_AUTOMATION_TOKEN missing"; exit 1; }

          base="${CERBERUS_HEALTH_URL%/health}"
          response_file="$RUNNER_TEMP/weekly-test-recipient-ensure.json"

          for attempt in $(seq 1 36); do
            status="$(curl --silent --show-error --max-time 20 \
              -o "$response_file" \
              -w '%{http_code}' \
              -H 'Content-Type: application/json' \
              -H "X-Cerberus-Automation-Token: ${CERBERUS_AUTOMATION_TOKEN}" \
              -d '{}' \
              "$base/api/internal/newsletter/weekly-test-recipient/ensure" || true)"

            if [ "$status" = "200" ]; then
              node - "$response_file" <<'NODE'
          const fs = require('node:fs');
          const path = process.argv[2];
          const body = JSON.parse(fs.readFileSync(path, 'utf8'));
          const result = body && body.result;
          if (
            body?.success !== true ||
            result?.provider !== 'BREVO' ||
            result?.state !== 'ready' ||
            result?.associated !== true ||
            result?.blacklisted !== false
          ) {
            console.error('Weekly test recipient verification failed.');
            process.exit(1);
          }
          console.log(`WEEKLY_TEST_RECIPIENT_READY=true contact_created=${Boolean(result.contactCreated)} list_created=${Boolean(result.listCreated)} associated=true blacklisted=false`);
          NODE
              exit 0
            fi

            if [ "$status" = "404" ] || [ "$status" = "502" ] || [ "$status" = "503" ] || [ "$status" = "504" ] || [ "$status" = "000" ]; then
              echo "Production endpoint not ready yet (HTTP $status), attempt $attempt/36."
              sleep 10
              continue
            fi

            echo "Controlled recipient setup failed with HTTP $status."
            cat "$response_file" || true
            exit 1
          done

          echo "Production endpoint did not become ready in time."
          exit 1
