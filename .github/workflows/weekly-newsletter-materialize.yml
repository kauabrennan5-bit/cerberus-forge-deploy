name: Weekly newsletter materialize

on:
  push:
    branches:
      - feat/weekly-newsletter-curation-2026-08-28
      - diag/weekly-newsletter-ts-2026-08-28
    paths:
      - .github/scripts/materialize_weekly_newsletter.py
      - .github/scripts/diag_weekly_candidate_patch.py
      - .github/workflows/weekly-newsletter-diagnostic-gate.yml
      - .github/workflows/weekly-newsletter-materialize.yml

permissions:
  contents: read

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      TELEGRAM_ALLOWED_USER_IDS: "1976526372"
      DIAG_BASE_SHA: "defa6fe6bbda8eff5e7c8e80b2241a29011ace8c"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: python .github/scripts/materialize_weekly_newsletter.py
      - name: Apply validated candidate corrections
        run: python .github/scripts/diag_weekly_candidate_patch.py
      - name: Remove all temporary diagnostic and materializer files
        run: rm -f .github/scripts/materialize_weekly_newsletter.py .github/scripts/diag_weekly_candidate_patch.py .github/workflows/weekly-newsletter-materialize.yml .github/workflows/weekly-newsletter-diagnostic-gate.yml
      - name: Capture canonical candidate tree from feature base
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "${DIAG_BASE_SHA}^{commit}"
          git add -A
          final_tree="$(git write-tree)"
          git diff --no-ext-diff --binary "$DIAG_BASE_SHA" "$final_tree" -- . > weekly-functional.patch
          git diff --name-status "$DIAG_BASE_SHA" "$final_tree" -- . > weekly-functional-files.txt
          cp weekly-functional.patch weekly-candidate.patch
          cp weekly-functional-files.txt weekly-candidate-files.txt
          sha256sum weekly-functional.patch | awk '{print "sha256:" $1}' > weekly-functional.sha256
          printf 'FINAL_TREE=%s\n' "$final_tree" > weekly-functional-tree.txt
          test -s weekly-functional.patch
          test -s weekly-functional-files.txt
          test -s weekly-functional.sha256
          cat weekly-functional.sha256
          cat weekly-functional-tree.txt
          cat weekly-functional-files.txt
      - name: Upload generated candidate diff
        uses: actions/upload-artifact@v4
        with:
          name: weekly-candidate-source-${{ github.run_id }}
          path: |
            weekly-candidate.patch
            weekly-candidate-files.txt
            weekly-functional.patch
            weekly-functional-files.txt
            weekly-functional.sha256
            weekly-functional-tree.txt
          if-no-files-found: error
          retention-days: 7
      - run: npm ci
      - name: Reproduce isolated authorization cause
        shell: bash
        run: |
          set -euo pipefail
          set +e
          env -u TELEGRAM_ALLOWED_USER_IDS -u TELEGRAM_ALLOWED_USERS \
            node --import tsx/esm --test --test-concurrency=1 --test-name-pattern='sem reviewId entrega sintaxe' tests/publishCommand.test.ts \
            > /tmp/publish-isolated-no-allowlist.log 2>&1
          no_allowlist_status=$?
          TELEGRAM_ALLOWED_USER_IDS=1976526372 \
            node --import tsx/esm --test --test-concurrency=1 --test-name-pattern='sem reviewId entrega sintaxe' tests/publishCommand.test.ts \
            > /tmp/publish-isolated-with-allowlist.log 2>&1
          with_allowlist_status=$?
          set -e
          echo "ISOLATED_WITHOUT_ALLOWLIST_EXIT=${no_allowlist_status}"
          echo "ISOLATED_WITH_ALLOWLIST_EXIT=${with_allowlist_status}"
          test "$no_allowlist_status" -ne 0
          test "$with_allowlist_status" -eq 0
      - name: Reproduce publish file with synthetic allowlist
        run: node --import tsx/esm --test --test-concurrency=1 tests/publishCommand.test.ts
      - name: Reproduce publish functional group with synthetic allowlist
        run: node --import tsx/esm --test --test-concurrency=1 tests/publishCommand.test.ts tests/telegramBotV2Contract.test.ts
      - name: Weekly focused tests with observability
        id: focused_tests
        shell: bash
        run: |
          set -uo pipefail
          set +e
          node --import tsx/esm --test --test-concurrency=1 tests/newsletterWeeklyCampaign.test.ts tests/newsletterCampaign.test.ts 2>&1 | tee weekly-focused-test.raw
          focused_status=${PIPESTATUS[0]}
          set -e

          python - <<'PY'
          from pathlib import Path
          import re
          import sys

          raw = Path("weekly-focused-test.raw").read_text(encoding="utf-8", errors="replace")
          sanitized = re.sub(r"\b[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}\b", "[REDACTED_EMAIL]", raw)
          Path("weekly-focused-test.log").write_text(sanitized, encoding="utf-8")
          keys = {
              "FOCUSED_TOTAL": r"(?m)^[#ℹ]\s+tests\s+(\d+)\s*$",
              "FOCUSED_PASS": r"(?m)^[#ℹ]\s+pass\s+(\d+)\s*$",
              "FOCUSED_FAILURES": r"(?m)^[#ℹ]\s+fail\s+(\d+)\s*$",
              "FOCUSED_SKIPPED": r"(?m)^[#ℹ]\s+skipped\s+(\d+)\s*$",
          }
          values = {}
          missing = []
          for key, pattern in keys.items():
              matches = re.findall(pattern, sanitized)
              if not matches:
                  missing.append(key)
              else:
                  values[key] = matches[-1]
          Path("weekly-focused-summary.txt").write_text(
              "\n".join(f"{key}={values.get(key, 'UNPARSEABLE')}" for key in keys) + "\n",
              encoding="utf-8",
          )
          print(Path("weekly-focused-summary.txt").read_text(encoding="utf-8"), end="")
          if missing:
              print("FOCUSED_SUMMARY_PARSE_ERROR=" + ",".join(missing), file=sys.stderr)
              sys.exit(97)
          PY
          rm -f weekly-focused-test.raw
          exit "$focused_status"
      - name: Upload focused observability
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weekly-focused-observability-${{ github.run_id }}
          path: |
            weekly-focused-test.log
            weekly-focused-summary.txt
          if-no-files-found: error
          retention-days: 7
      - name: Clean focused observability files
        if: success()
        run: rm -f weekly-focused-test.log weekly-focused-summary.txt
      - name: Full suite with observability
        id: global_tests
        shell: bash
        run: |
          set -uo pipefail
          set +e
          npm test 2>&1 | tee weekly-global-test.raw
          npm_status=${PIPESTATUS[0]}
          set -e

          python - <<'PY'
          from pathlib import Path
          import re

          raw = Path("weekly-global-test.raw").read_text(encoding="utf-8", errors="replace")
          sanitized = raw
          sanitized = re.sub(r"(?i)(authorization:\s*bearer\s+)[^\s]+", r"\1[REDACTED]", sanitized)
          sanitized = re.sub(r"(?i)((?:api[_-]?key|token|secret|password)\s*[=:]\s*)[^\s,;]+", r"\1[REDACTED]", sanitized)
          sanitized = re.sub(r"\b[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}\b", "[REDACTED_EMAIL]", sanitized)
          Path("weekly-global-test.log").write_text(sanitized, encoding="utf-8")
          PY
          rm -f weekly-global-test.raw

          python - <<'PY'
          from pathlib import Path
          import re
          import sys

          text = Path("weekly-global-test.log").read_text(encoding="utf-8", errors="replace")
          keys = {
              "GLOBAL_TOTAL": r"(?m)^[#ℹ]\s+tests\s+(\d+)\s*$",
              "GLOBAL_PASS": r"(?m)^[#ℹ]\s+pass\s+(\d+)\s*$",
              "GLOBAL_FAILURES": r"(?m)^[#ℹ]\s+fail\s+(\d+)\s*$",
              "GLOBAL_SKIPPED": r"(?m)^[#ℹ]\s+skipped\s+(\d+)\s*$",
              "GLOBAL_CANCELLED": r"(?m)^[#ℹ]\s+cancelled\s+(\d+)\s*$",
          }
          values = {}
          missing = []
          for key, pattern in keys.items():
              matches = re.findall(pattern, text)
              if not matches:
                  missing.append(key)
              else:
                  values[key] = matches[-1]

          summary = [f"{key}={values.get(key, 'UNPARSEABLE')}" for key in keys]
          Path("weekly-global-summary.txt").write_text("\n".join(summary) + "\n", encoding="utf-8")

          marker = "✖ failing tests:"
          if marker in text:
              failures = marker + text.split(marker, 1)[1]
          else:
              failures = "NO_FAILING_TESTS_SECTION_CAPTURED"
          Path("weekly-global-failures.txt").write_text(failures.rstrip() + "\n", encoding="utf-8")

          print(Path("weekly-global-summary.txt").read_text(encoding="utf-8"), end="")
          print("--- FAILURES ---")
          print(Path("weekly-global-failures.txt").read_text(encoding="utf-8"), end="")
          if missing:
              print("SUMMARY_PARSE_ERROR=" + ",".join(missing), file=sys.stderr)
              sys.exit(97)
          PY

          exit "$npm_status"
      - name: Upload sanitized global observability
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weekly-global-observability-${{ github.run_id }}
          path: |
            weekly-global-test.log
            weekly-global-summary.txt
            weekly-global-failures.txt
          if-no-files-found: warn
          retention-days: 7
      - name: Clean observability files
        if: success()
        run: rm -f weekly-global-test.log weekly-global-summary.txt weekly-global-failures.txt weekly-candidate.patch weekly-candidate-files.txt weekly-functional.patch weekly-functional-files.txt weekly-functional.sha256 weekly-functional-tree.txt
      - name: TypeScript diagnostics
        id: typescript
        shell: bash
        run: |
          set -uo pipefail
          set +e
          npm run lint -- --pretty false 2>&1 | tee weekly-typescript.log
          ts_status=${PIPESTATUS[0]}
          set -e

          TS_EXIT_CODE="$ts_status" python - <<'PY'
          from pathlib import Path
          import os
          import re

          text = Path("weekly-typescript.log").read_text(encoding="utf-8", errors="replace")
          error_pattern = re.compile(r"(?m)^(.+?)\((\d+),(\d+)\): error (TS\d+): (.+)$")
          errors = error_pattern.findall(text)

          lines = [
              f"TS_EXIT_CODE={os.environ['TS_EXIT_CODE']}",
              f"TS_ERROR_COUNT={len(errors)}",
          ]
          for index, (file, line, column, code, message) in enumerate(errors, start=1):
              lines.extend([
                  f"TS_ERROR_{index}_CODE={code}",
                  f"TS_ERROR_{index}_FILE={file}",
                  f"TS_ERROR_{index}_LINE={line}",
                  f"TS_ERROR_{index}_COLUMN={column}",
                  f"TS_ERROR_{index}_MESSAGE={message}",
              ])

          Path("weekly-typescript-summary.txt").write_text("\n".join(lines) + "\n", encoding="utf-8")
          print(Path("weekly-typescript-summary.txt").read_text(encoding="utf-8"), end="")
          PY

          exit "$ts_status"
      - name: Upload TypeScript diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weekly-typescript-diagnostics-${{ github.run_id }}
          path: |
            weekly-typescript.log
            weekly-typescript-summary.txt
          if-no-files-found: error
          retention-days: 7
      - name: Build
        run: npm run build
      - name: Diff check
        shell: bash
        run: |
          set -euo pipefail
          final_tree="$(git write-tree)"
          git diff "$DIAG_BASE_SHA" "$final_tree" --check -- .
      - name: Secret scan canonical candidate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/gitleaks-scan
          final_tree="$(git write-tree)"
          git diff --no-ext-diff --binary "$DIAG_BASE_SHA" "$final_tree" -- . > /tmp/gitleaks-scan/weekly-candidate.patch
          curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks detect --no-git --source /tmp/gitleaks-scan --redact --exit-code 1
