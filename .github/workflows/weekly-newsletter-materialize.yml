name: Weekly newsletter materialize

on:
  push:
    branches:
      - feat/weekly-newsletter-curation-2026-08-28
    paths:
      - .github/scripts/materialize_weekly_newsletter.py
      - .github/workflows/weekly-newsletter-materialize.yml

permissions:
  contents: read

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: python .github/scripts/materialize_weekly_newsletter.py
      - name: Remove temporary materializer
        run: rm .github/scripts/materialize_weekly_newsletter.py .github/workflows/weekly-newsletter-materialize.yml
      - run: npm ci
      - name: Reproduce isolated authorization cause
        shell: bash
        run: |
          set -euo pipefail
          set +e
          env -u TELEGRAM_ALLOWED_USER_IDS -u TELEGRAM_ALLOWED_USERS \
            node --import tsx/esm --test --test-concurrency=1 --test-name-pattern='publicar sem id' tests/publishCommand.test.ts \
            > /tmp/publish-isolated-no-allowlist.log 2>&1
          no_allowlist_status=$?
          TELEGRAM_ALLOWED_USER_IDS=1976526372 \
            node --import tsx/esm --test --test-concurrency=1 --test-name-pattern='publicar sem id' tests/publishCommand.test.ts \
            > /tmp/publish-isolated-with-allowlist.log 2>&1
          with_allowlist_status=$?
          set -e
          echo "ISOLATED_WITHOUT_ALLOWLIST_EXIT=${no_allowlist_status}"
          echo "ISOLATED_WITH_ALLOWLIST_EXIT=${with_allowlist_status}"
          test "$no_allowlist_status" -ne 0
          test "$with_allowlist_status" -eq 0
      - name: Reproduce publish file with synthetic allowlist
        env:
          TELEGRAM_ALLOWED_USER_IDS: "1976526372"
        run: node --import tsx/esm --test --test-concurrency=1 tests/publishCommand.test.ts
      - name: Reproduce publish functional group with synthetic allowlist
        env:
          TELEGRAM_ALLOWED_USER_IDS: "1976526372"
        run: node --import tsx/esm --test --test-concurrency=1 tests/publishCommand.test.ts tests/telegramBotV2Contract.test.ts
      - name: Weekly focused tests
        run: node --import tsx/esm --test --test-concurrency=1 tests/newsletterWeeklyCampaign.test.ts tests/newsletterCampaign.test.ts
      - name: Full suite with observability
        id: global_tests
        shell: bash
        run: |
          set -uo pipefail
          set +e
          npm test 2>&1 | tee weekly-global-test.raw
          npm_status=${PIPESTATUS[0]}
          set -e

          python - <<'PY'
          from pathlib import Path
          import re

          raw = Path("weekly-global-test.raw").read_text(encoding="utf-8", errors="replace")
          sanitized = raw
          sanitized = re.sub(r"(?i)(authorization:\s*bearer\s+)[^\s]+", r"\1[REDACTED]", sanitized)
          sanitized = re.sub(r"(?i)((?:api[_-]?key|token|secret|password)\s*[=:]\s*)[^\s,;]+", r"\1[REDACTED]", sanitized)
          sanitized = re.sub(r"\b[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}\b", "[REDACTED_EMAIL]", sanitized)
          Path("weekly-global-test.log").write_text(sanitized, encoding="utf-8")
          PY
          rm -f weekly-global-test.raw

          python - <<'PY'
          from pathlib import Path
          import re
          import sys

          text = Path("weekly-global-test.log").read_text(encoding="utf-8", errors="replace")
          keys = {
              "GLOBAL_TOTAL": r"(?m)^[#ℹ]\s+tests\s+(\d+)\s*$",
              "GLOBAL_PASS": r"(?m)^[#ℹ]\s+pass\s+(\d+)\s*$",
              "GLOBAL_FAILURES": r"(?m)^[#ℹ]\s+fail\s+(\d+)\s*$",
              "GLOBAL_SKIPPED": r"(?m)^[#ℹ]\s+skipped\s+(\d+)\s*$",
              "GLOBAL_CANCELLED": r"(?m)^[#ℹ]\s+cancelled\s+(\d+)\s*$",
          }
          values = {}
          missing = []
          for key, pattern in keys.items():
              matches = re.findall(pattern, text)
              if not matches:
                  missing.append(key)
              else:
                  values[key] = matches[-1]

          summary = [f"{key}={values.get(key, 'UNPARSEABLE')}" for key in keys]
          Path("weekly-global-summary.txt").write_text("\n".join(summary) + "\n", encoding="utf-8")

          marker = "✖ failing tests:"
          if marker in text:
              failures = marker + text.split(marker, 1)[1]
          else:
              failures = "NO_FAILING_TESTS_SECTION_CAPTURED"
          Path("weekly-global-failures.txt").write_text(failures.rstrip() + "\n", encoding="utf-8")

          print(Path("weekly-global-summary.txt").read_text(encoding="utf-8"), end="")
          print("--- FAILURES ---")
          print(Path("weekly-global-failures.txt").read_text(encoding="utf-8"), end="")
          if missing:
              print("SUMMARY_PARSE_ERROR=" + ",".join(missing), file=sys.stderr)
              sys.exit(97)
          PY

          exit "$npm_status"
      - name: Upload sanitized global observability
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weekly-global-observability-${{ github.run_id }}
          path: |
            weekly-global-test.log
            weekly-global-summary.txt
            weekly-global-failures.txt
          if-no-files-found: error
          retention-days: 7
      - name: Clean observability files
        if: success()
        run: rm -f weekly-global-test.log weekly-global-summary.txt weekly-global-failures.txt
      - name: TypeScript
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Diff check
        run: git diff --check
