name: Verify Render deployment

on:
  push:
    branches:
      - fix/mobile-catalog-categories-2026-08-28
    paths:
      - .github/workflows/verify-render-deploy.yml

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Wait for backend SHA
        shell: bash
        run: |
          set -euo pipefail
          target='3298fa39a250825ed4c873b7b69d618fd59d8a57'
          url='https://cerberus-forge-deploy-backend.onrender.com/health'
          for i in $(seq 1 60); do
            code=$(curl -sS -o /tmp/health.json -w '%{http_code}' --max-time 20 "$url" || true)
            version=$(python3 - <<'PY'
          import json
          try:
              data=json.load(open('/tmp/health.json'))
              print(data.get('version','?'))
          except Exception:
              print('?')
          PY
          )
            echo "backend attempt=$i http=$code version=$version"
            if [ "$code" = '200' ] && [ "$version" = "$target" ]; then
              echo "BACKEND_SHA_OK=$version"
              exit 0
            fi
            sleep 10
          done
          echo 'Backend did not serve target SHA in time.' >&2
          exit 1

      - name: Wait for static frontend fingerprint
        shell: bash
        run: |
          set -euo pipefail
          base='https://cerberus-static-catalog.onrender.com'
          for i in $(seq 1 60); do
            root_code=$(curl -sS -L -o /tmp/index.html -w '%{http_code}' --max-time 20 "$base/" || true)
            data_code=$(curl -sS -L -o /tmp/products.json -w '%{http_code}' --max-time 20 "$base/data/products.json" || true)
            asset=$(grep -oE 'src="/assets/[^"?]+\.js' /tmp/index.html 2>/dev/null | head -n1 | sed 's/^src="//' || true)
            marker='missing'
            if [ "$root_code" = '200' ] && [ "$data_code" = '200' ] && [ -n "$asset" ]; then
              js_code=$(curl -sS -L -o /tmp/live.js -w '%{http_code}' --max-time 30 "$base$asset" || true)
              if [ "$js_code" = '200' ] && grep -q 'relatedScrollX' /tmp/live.js; then
                marker='present'
              fi
            fi
            echo "frontend attempt=$i root=$root_code data=$data_code asset=${asset:-none} marker=$marker"
            if [ "$root_code" = '200' ] && [ "$data_code" = '200' ] && [ "$marker" = 'present' ]; then
              python3 - <<'PY'
          import json
          data=json.load(open('/tmp/products.json'))
          products=data.get('products', data.get('data', data if isinstance(data,list) else []))
          print(f'FRONTEND_PRODUCTS={len(products) if isinstance(products,list) else "?"}')
          PY
              echo "FRONTEND_FINGERPRINT_OK=$asset"
              exit 0
            fi
            sleep 10
          done
          echo 'Static frontend did not expose the merged navigation fingerprint in time.' >&2
          exit 1
