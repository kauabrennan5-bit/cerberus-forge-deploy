name: Cerberus Autonomous Curator
# Controlled direct executor. Production scheduling is owned by autonomous-curator-scheduler.yml.
# This workflow never calls Render and the runner rejects any autoPublished value other than zero.

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/autonomous-curator.yml"
      - ".github/workflows/autonomous-curator-scheduler.yml"
      - "scripts/run-autonomous-curator-direct.ts"
  workflow_dispatch:
    inputs:
      mode:
        description: Execution mode
        required: true
        default: dry_run
        type: choice
        options:
          - dry_run
          - manual_review
          - status

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && 'cerberus-autonomous-curator-direct' || 'cerberus-autonomous-curator-contract' }}
  cancel-in-progress: true

jobs:
  contract:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Prove serverless direct boundary
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'runAutonomousCuratorDaily' scripts/run-autonomous-curator-direct.ts
          grep -q 'AUTONOMOUS_PUBLICATION_CONTRACT_VIOLATED' scripts/run-autonomous-curator-direct.ts
          ! grep -q 'onrender.com' .github/workflows/autonomous-curator.yml
          ! grep -q 'onrender.com' .github/workflows/autonomous-curator-scheduler.yml
          echo 'AUTONOMOUS_CURATOR_DIRECT_BOUNDARY=PASS'

  daily-curator:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      CURATOR_MODE: ${{ inputs.mode }}
      SUPABASE_URL: https://ppsxlclycyinhhoqijvz.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      SHOPEE_APP_ID: ${{ secrets.SHOPEE_APP_ID }}
      SHOPEE_APP_SECRET: ${{ secrets.SHOPEE_APP_SECRET }}
      SHOPEE_AFFILIATE_APP_ID: ${{ secrets.SHOPEE_AFFILIATE_APP_ID }}
      SHOPEE_AFFILIATE_APP_SECRET: ${{ secrets.SHOPEE_AFFILIATE_APP_SECRET }}
      SHOPEE_AFFILIATE_API_BASE_URL: ${{ vars.SHOPEE_AFFILIATE_API_BASE_URL }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_ALLOWED_USER_IDS: ${{ secrets.TELEGRAM_ALLOWED_USER_IDS }}
      TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
      TELEGRAM_ADMIN_USER_ID: ${{ secrets.TELEGRAM_ADMIN_USER_ID }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_PRODUCT_CURATOR_MODEL: ${{ vars.GEMINI_PRODUCT_CURATOR_MODEL }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.1
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Execute Curator directly
        run: npx tsx scripts/run-autonomous-curator-direct.ts "$CURATOR_MODE"
