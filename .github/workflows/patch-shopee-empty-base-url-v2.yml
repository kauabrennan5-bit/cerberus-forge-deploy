name: Apply Shopee Empty Base URL Fix

on:
  push:
    branches: [fix/shopee-empty-base-url-fallback-v2]
    paths:
      - .github/workflows/patch-shopee-empty-base-url-v2.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/shopee-empty-base-url-fallback-v2
      - name: Apply exact patch and regression test
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('server/commercial/affiliate/shopeeApiClient.ts')
          s = p.read_text()
          old = 'const baseUrl = (options.baseUrl ?? SHOPEE_AFFILIATE_API_DEFAULT_BASE_URL).replace(/\\/+$/, "");'
          new = 'const baseUrl = (options.baseUrl?.trim() || SHOPEE_AFFILIATE_API_DEFAULT_BASE_URL).replace(/\\/+$/, "");'
          if s.count(old) != 1:
              raise SystemExit(f'expected exactly one canonical baseUrl expression, found {s.count(old)}')
          p.write_text(s.replace(old, new))
          PY
          cat > tests/shopeeEmptyBaseUrlFallback.test.ts <<'EOF'
          import assert from "node:assert/strict";
          import test from "node:test";
          import {
            createShopeeApiClient,
            SHOPEE_AFFILIATE_API_DEFAULT_BASE_URL,
            type ShopeeHttpTransport,
          } from "../server/commercial/affiliate/shopeeApiClient";

          test("Shopee client falls back to official endpoint when baseUrl is empty", async () => {
            let requestedUrl: string | null = null;
            const transport: ShopeeHttpTransport = async (url) => {
              requestedUrl = url;
              return new Response(JSON.stringify({ data: { productOfferV2: { nodes: [] } } }), {
                status: 200,
                headers: { "content-type": "application/json" },
              });
            };
            const client = createShopeeApiClient({
              appId: "test-app",
              secret: "test-secret",
              baseUrl: "",
              transport,
              clock: () => 1_700_000_000_000,
            });
            await client.searchOffers({ query: "luminaria", limit: 1 });
            assert.equal(requestedUrl, SHOPEE_AFFILIATE_API_DEFAULT_BASE_URL);
          });
          EOF
      - name: Verify patch scope
        shell: bash
        run: |
          grep -F 'options.baseUrl?.trim() || SHOPEE_AFFILIATE_API_DEFAULT_BASE_URL' server/commercial/affiliate/shopeeApiClient.ts
          test -f tests/shopeeEmptyBaseUrlFallback.test.ts
          git diff --check
      - name: Commit patch and remove temporary workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/patch-shopee-empty-base-url-v2.yml
          git add server/commercial/affiliate/shopeeApiClient.ts tests/shopeeEmptyBaseUrlFallback.test.ts
          git commit -m 'fix(shopee): fallback from empty affiliate API base URL'
          git push origin HEAD:fix/shopee-empty-base-url-fallback-v2
