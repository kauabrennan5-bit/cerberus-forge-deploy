name: Telegram Contract Gate

on:
  pull_request:
    paths:
      - "server/services/telegram*.ts"
      - "server/repositories/telegramRepository.ts"
      - "server/repositories/productsRepository.ts"
      - "tests/telegram*.test.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/telegram-contract.yml"
  push:
    branches:
      - main
      - "refactor/telegram-bot-v2-*"
    paths:
      - "server/services/telegram*.ts"
      - "server/repositories/telegramRepository.ts"
      - "server/repositories/productsRepository.ts"
      - "tests/telegram*.test.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/telegram-contract.yml"

permissions:
  contents: read

concurrency:
  group: telegram-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  telegram-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # IDs sintéticos/legados usados pela suíte. Não são credenciais.
      TELEGRAM_ALLOWED_USER_IDS: "1976526372,888111222,999000111"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run full test suite
        shell: bash
        run: |
          set +e
          npm test 2>&1 | tee telegram-v2-full-test.log
          test_status=${PIPESTATUS[0]}

          node <<'NODE'
          const fs = require('fs');
          const raw = fs.readFileSync('telegram-v2-full-test.log', 'utf8');
          const clean = raw.replace(/\u001b\[[0-?]*[ -/]*[@-~]/g, '');
          const summaryLines = clean
            .split(/\r?\n/)
            .filter((line) => /^\s*(Test Files|Tests|Start at|Duration)\b/.test(line));
          const summary = summaryLines.slice(-4).join('\n') || 'Vitest summary lines were not found.';
          fs.writeFileSync('telegram-v2-test-summary.txt', `${summary}\n`);
          NODE

          {
            echo '## Telegram V2 full-test diagnostics'
            echo
            echo '```text'
            cat telegram-v2-test-summary.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          exit "$test_status"

      - name: Upload full test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: telegram-v2-full-test-diagnostics
          path: |
            telegram-v2-full-test.log
            telegram-v2-test-summary.txt
          if-no-files-found: error
          retention-days: 7

      - name: TypeScript contract
        run: npm run lint

      - name: Production build
        run: npm run build
