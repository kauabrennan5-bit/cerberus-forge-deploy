name: Telegram Contract Gate

on:
  push:
    branches:
      - "refactor/telegram-bot-v2-validation-2026-08-28"
    paths:
      - ".github/workflows/telegram-contract.yml"

permissions:
  contents: write

concurrency:
  group: telegram-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  historical-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      TELEGRAM_ALLOWED_USER_IDS: "1976526372"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Reproduce exact historical focused preparation and counts
        shell: bash
        run: |
          set -euo pipefail
          REPORT=telegram-v2-historical-exact-evidence.txt
          : > "$REPORT"
          note() { printf '%s\n' "$*" | tee -a "$REPORT"; }
          value() { awk -v k="$2" '$1=="#" && $2==k {v=$3} END{print v+0}' "$1"; }

          git worktree add --detach /tmp/hist 8c5c3039c6971045b0cb3e4b2ab8fb115040a6f5 >/dev/null
          ln -s "$GITHUB_WORKSPACE/node_modules" /tmp/hist/node_modules
          cd /tmp/hist

          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          workflow = Path('.github/workflows/finalize-telegram-v2.yml').read_text(encoding='utf-8').splitlines()
          targets = [
              'Apply deterministic V2 base patch',
              'Prioritize explicit promotion states',
              'Add isolated user-state test hooks',
              'Isolate promotion test state and legacy product routing assertion',
              'Align advanced-panel test contract',
          ]
          def extract_run(name: str) -> str:
              start = workflow.index(f'      - name: {name}')
              i = start + 1
              while workflow[i].strip() == '': i += 1
              if workflow[i] != '        run: |': raise SystemExit(f'missing run block: {name}')
              out=[]; i+=1
              while i < len(workflow):
                  line=workflow[i]
                  if line.startswith('      - name: ') or line.startswith('      - uses: '): break
                  if line.startswith('          '): out.append(line[10:])
                  elif line.strip() == '': out.append('')
                  else: raise SystemExit(f'unexpected indentation: {line!r}')
                  i+=1
              return '\n'.join(out)+'\n'
          for target in targets:
              subprocess.run(['bash','-euo','pipefail','-c',extract_run(target)],check=True)
          p=Path('tests/socialLinks.test.ts')
          s=p.read_text(encoding='utf-8')
          old='assert.match(commands, /name: "redes"/);'
          new='assert.match(commands, /command: "redes"/);'
          if s.count(old) != 1:
              raise SystemExit(f'expected one stale redes assertion, found {s.count(old)}')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY

          files=(
            tests/telegramCommandsV2.test.ts
            tests/telegramBotV2Contract.test.ts
            tests/telegramPanelV2.test.ts
            tests/telegramReadPanel.test.ts
            tests/telegramDiagnostics.test.ts
            tests/telegramAndMarketplace.test.ts
            tests/publishCommand.test.ts
            tests/promotionReview.test.ts
            tests/previewTelegramRoutes.test.ts
            tests/shopeeCommand.test.ts
          )
          note "HISTORICAL_COMMIT=8c5c3039c6971045b0cb3e4b2ab8fb115040a6f5"
          note "NODE=$(node --version)"
          note "HISTORICAL_FILE_COUNT=${#files[@]}"
          for f in "${files[@]}"; do note "HISTORICAL_FILE=$f"; done

          node --import tsx/esm --test --test-concurrency=1 --test-reporter=tap "${files[@]}" >/tmp/all.log 2>&1
          for key in tests pass fail skipped cancelled; do note "HISTORICAL_FOCUSED_${key^^}=$(value /tmp/all.log "$key")"; done

          for f in "${files[@]}"; do
            label=$(basename "$f" .test.ts | tr '[:lower:]-' '[:upper:]_')
            node --import tsx/esm --test --test-concurrency=1 --test-reporter=tap "$f" >"/tmp/${label}.log" 2>&1
            for key in tests pass fail skipped cancelled; do note "FILE_${label}_${key^^}=$(value "/tmp/${label}.log" "$key")"; done
            grep '^# Subtest:' "/tmp/${label}.log" | sed "s/^/FILE_${label}_CASE=/" >> "$GITHUB_WORKSPACE/$REPORT" || true
          done

          cd "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$REPORT"
          git commit -m "chore: record exact historical telegram v2 counts"
          git push origin HEAD:${GITHUB_REF_NAME}
