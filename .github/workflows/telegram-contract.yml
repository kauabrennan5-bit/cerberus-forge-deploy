name: Telegram Contract Gate

on:
  push:
    branches:
      - "refactor/telegram-bot-v2-validation-2026-08-28"
    paths:
      - ".github/workflows/telegram-contract.yml"

permissions:
  contents: read

concurrency:
  group: telegram-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  telegram-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      TELEGRAM_ALLOWED_USER_IDS: "1976526372,888111222,999000111"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply candidate fixed workspace
        run: python3 .github/scripts/validate_telegram_v2_fix.py

      - name: Enumerate Telegram test files and counts
        shell: bash
        run: |
          set -uo pipefail
          mapfile -t files < <(find tests -maxdepth 1 -type f -iname '*telegram*.test.ts' | sort)
          printf 'TELEGRAM_TEST_FILES=%s\n' "${#files[@]}"
          total=0
          for file in "${files[@]}"; do
            log="/tmp/$(basename "$file").log"
            set +e
            node --import tsx/esm --test "$file" >"$log" 2>&1
            status=$?
            set -e
            tests=$(grep -E '^# tests [0-9]+$' "$log" | tail -1 | awk '{print $3}')
            pass=$(grep -E '^# pass [0-9]+$' "$log" | tail -1 | awk '{print $3}')
            fail=$(grep -E '^# fail [0-9]+$' "$log" | tail -1 | awk '{print $3}')
            tests=${tests:-0}; pass=${pass:-0}; fail=${fail:-0}
            total=$((total + tests))
            printf 'FILE=%s TESTS=%s PASS=%s FAIL=%s EXIT=%s\n' "$file" "$tests" "$pass" "$fail" "$status"
          done
          printf 'ALL_TELEGRAM_NAMED_TESTS=%s\n' "$total"
