name: Telegram Contract Gate

on:
  push:
    branches:
      - "refactor/telegram-bot-v2-final-validation-sol-20260828"
    paths:
      - ".github/workflows/telegram-contract.yml"

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Materialize already-diagnosed candidate
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/validate_telegram_v2_fix.py
          git diff --check
          cat > /tmp/expected-files <<'EOF'
          server/services/telegramPanel.ts
          tests/publishCommand.test.ts
          tests/telegramReadPanel.test.ts
          tests/telegramUiContract.test.ts
          EOF
          sort -o /tmp/expected-files /tmp/expected-files
          git diff --name-only | sort > /tmp/actual-files
          diff -u /tmp/expected-files /tmp/actual-files
          if git diff | grep -E '^\+.*\b(test\.(skip|todo|only)|describe\.(skip|only)|it\.(skip|todo|only))\b'; then
            echo "Forbidden test weakening detected"
            exit 1
          fi

      - name: Commit candidate on temporary branch only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            server/services/telegramPanel.ts \
            tests/publishCommand.test.ts \
            tests/telegramReadPanel.test.ts \
            tests/telegramUiContract.test.ts
          git diff --cached --check
          git commit -m "validation: materialize final telegram v2 candidate"
          git push origin HEAD:${GITHUB_REF_NAME}
