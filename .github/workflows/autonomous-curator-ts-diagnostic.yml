name: Autonomous Curator TypeScript Diagnostic

on:
  push:
    branches:
      - feat/autonomous-curator-2026-08-29
    paths:
      - ".github/workflows/autonomous-curator-ts-diagnostic.yml"
      - "server/services/autonomousCurator*.ts"
      - "server/repositories/autonomousCuratorRepository.ts"
      - "server/routes/autonomousCuratorRoutes.ts"
      - "tests/autonomousCurator.test.ts"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Capture TypeScript errors
        id: tsc
        shell: bash
        run: |
          set +e
          npx tsc --noEmit > "$RUNNER_TEMP/tsc.log" 2>&1
          code=$?
          cat "$RUNNER_TEMP/tsc.log"
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: autonomous-curator-ts-diagnostic
          path: ${{ runner.temp }}/tsc.log
          if-no-files-found: error
      - name: Fail if TypeScript failed
        if: steps.tsc.outputs.exit_code != '0'
        run: exit 1
