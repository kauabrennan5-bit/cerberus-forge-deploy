name: Weekly Production Final Gate

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - "catalog-sync/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: weekly-production-final-${{ github.ref }}
  cancel-in-progress: true

jobs:
  weekly-production-final:
    name: weekly-production-final
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Targeted weekly, audience and OIDC tests
        run: node --import tsx --test --test-concurrency=1 tests/newsletterWeekly*.test.ts
      - name: Global tests
        run: npm test
      - name: TypeScript
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Migration and schema contract
        run: node scripts/check-weekly-migrations.mjs
      - name: Gitleaks redacted changed-content scan
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          mkdir -p /tmp/gitleaks-scan
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -n "$base" ] && [ "$base" != "0000000000000000000000000000000000000000" ] && git cat-file -e "$base^{commit}"; then
            git diff --no-ext-diff "$base" HEAD > /tmp/gitleaks-scan/weekly-production.patch
          else
            git show --format= --no-ext-diff HEAD > /tmp/gitleaks-scan/weekly-production.patch
          fi
          mkdir -p /tmp/gitleaks-bin
          curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o /tmp/gitleaks.tar.gz
          tar --no-same-owner -xzf /tmp/gitleaks.tar.gz -C /tmp/gitleaks-bin gitleaks
          /tmp/gitleaks-bin/gitleaks detect --no-git --source /tmp/gitleaks-scan --redact --exit-code 1 --no-banner

  promote-catalog:
    name: promote-catalog
    if: ${{ startsWith(github.ref, 'refs/heads/catalog-sync/') }}
    needs: weekly-production-final
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify catalog-only pull request candidate
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          current_main="$(git rev-parse origin/main)"

          if ! git merge-base --is-ancestor "$current_main" "$GITHUB_SHA"; then
            echo "Catalog SHA is not a descendant of current main."
            exit 1
          fi

          mapfile -t changed < <(git diff --name-only "$current_main" "$GITHUB_SHA")
          if [ "${#changed[@]}" -ne 1 ] || [ "${changed[0]}" != "public/data/products.json" ]; then
            printf 'Catalog promotion rejected; changed files: %s\n' "${changed[*]:-<none>}"
            exit 1
          fi

          node -e 'const fs=require("node:fs"); const value=JSON.parse(fs.readFileSync("public/data/products.json","utf8")); if(!Array.isArray(value)) process.exit(1);'
          echo "CATALOG_PROMOTION_SHA=$GITHUB_SHA"

      - name: Open or reuse protected catalog pull request
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          pr_number="$(gh pr list \
            --repo "$GITHUB_REPOSITORY" \
            --state open \
            --base main \
            --head "$GITHUB_REF_NAME" \
            --json number \
            --jq '.[0].number // empty')"

          if [ -z "$pr_number" ]; then
            pr_url="$(gh pr create \
              --repo "$GITHUB_REPOSITORY" \
              --base main \
              --head "$GITHUB_REF_NAME" \
              --title "chore: promote validated curator catalog" \
              --body "Automated catalog-only promotion. The exact head SHA already passed weekly-production-final; the promotion job also verified that the diff contains only public/data/products.json and valid JSON.")"
            pr_number="${pr_url##*/}"
          fi

          test -n "$pr_number"
          echo "CATALOG_PR_NUMBER=$pr_number" >> "$GITHUB_ENV"

      - name: Wait for protected pull request gate
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          registered=false
          for attempt in $(seq 1 24); do
            checks_json="$(gh pr checks "$CATALOG_PR_NUMBER" \
              --repo "$GITHUB_REPOSITORY" \
              --json name,state 2>/dev/null || true)"
            if node -e 'const checks=JSON.parse(process.argv[1]||"[]"); process.exit(checks.some(check=>check.name==="weekly-production-final")?0:1)' "$checks_json"; then
              registered=true
              break
            fi
            sleep 5
          done

          if [ "$registered" != "true" ]; then
            echo "Required weekly-production-final check did not register on catalog PR."
            exit 1
          fi

          timeout 20m gh pr checks "$CATALOG_PR_NUMBER" \
            --repo "$GITHUB_REPOSITORY" \
            --required \
            --watch \
            --fail-fast \
            --interval 10

      - name: Squash merge exact validated catalog head
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          current_main="$(git rev-parse origin/main)"
          if ! git merge-base --is-ancestor "$current_main" "$GITHUB_SHA"; then
            echo "main advanced while the catalog gate was running; refusing stale catalog promotion."
            exit 1
          fi

          pr_head="$(gh pr view "$CATALOG_PR_NUMBER" \
            --repo "$GITHUB_REPOSITORY" \
            --json headRefOid \
            --jq '.headRefOid')"
          if [ "$pr_head" != "$GITHUB_SHA" ]; then
            echo "Catalog PR head changed after validation."
            exit 1
          fi

          merged="$(gh api \
            --method PUT \
            "repos/$GITHUB_REPOSITORY/pulls/$CATALOG_PR_NUMBER/merge" \
            -f merge_method=squash \
            -f sha="$GITHUB_SHA" \
            -f commit_title="chore: promote validated curator catalog" \
            -f commit_message="Automated catalog-only promotion after weekly-production-final passed on the exact source SHA." \
            --jq '.merged')"
          if [ "$merged" != "true" ]; then
            echo "GitHub did not confirm the protected catalog merge."
            exit 1
          fi
