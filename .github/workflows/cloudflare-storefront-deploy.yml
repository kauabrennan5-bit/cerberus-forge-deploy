name: Cloudflare Storefront Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-storefront-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_ACCOUNT_ID: 74f70eb5897940cbeb73dd38d911542c
      CLOUDFLARE_PAGES_PROJECT: cerberus-finds
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.14.1
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static storefront
        run: npm run build:frontend

      - name: Ensure Cloudflare Pages project
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          project_endpoint="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/${CLOUDFLARE_PAGES_PROJECT}"
          projects_endpoint="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects"
          response_file="$RUNNER_TEMP/cloudflare-pages-project.json"

          status="$(curl --silent --show-error --max-time 30 \
            -o "$response_file" -w '%{http_code}' \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H 'Content-Type: application/json' \
            "$project_endpoint" || true)"

          if [ "$status" = "200" ]; then
            node - "$response_file" <<'NODE'
          const fs = require('node:fs');
          const body = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          if (body?.success !== true || !body?.result?.name) process.exit(1);
          console.log(`Cloudflare Pages project already exists: ${body.result.name}`);
          NODE
            exit 0
          fi

          if [ "$status" != "404" ]; then
            echo "Cloudflare Pages project lookup failed with HTTP ${status}." >&2
            cat "$response_file" >&2
            exit 1
          fi

          create_status="$(curl --silent --show-error --max-time 30 \
            -o "$response_file" -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H 'Content-Type: application/json' \
            --data "{\"name\":\"${CLOUDFLARE_PAGES_PROJECT}\",\"production_branch\":\"main\"}" \
            "$projects_endpoint" || true)"

          if [ "$create_status" != "200" ] && [ "$create_status" != "201" ]; then
            echo "Cloudflare Pages project creation failed with HTTP ${create_status}." >&2
            cat "$response_file" >&2
            exit 1
          fi

          node - "$response_file" <<'NODE'
          const fs = require('node:fs');
          const body = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          if (body?.success !== true || !body?.result?.name || !body?.result?.subdomain) {
            console.error('Cloudflare Pages project creation did not return a usable project.');
            process.exit(1);
          }
          console.log(`Cloudflare Pages project created: ${body.result.name} (${body.result.subdomain})`);
          NODE

      - name: Stamp deployment metadata
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('node:fs');
          fs.writeFileSync('dist/deploy-meta.json', JSON.stringify({
            version: 1,
            platform: 'cloudflare-pages',
            sha: process.env.GITHUB_SHA,
            repository: process.env.GITHUB_REPOSITORY,
            generatedAt: new Date().toISOString(),
          }, null, 2));
          NODE

      - name: Deploy storefront to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          command: pages deploy dist --project-name=${{ env.CLOUDFLARE_PAGES_PROJECT }} --branch=main

      - name: Verify canonical Cloudflare storefront
        shell: bash
        env:
          STOREFRONT_URL: https://cerberus-finds.pages.dev
        run: |
          set -euo pipefail
          root_file="$RUNNER_TEMP/cloudflare-root.html"
          catalog_file="$RUNNER_TEMP/cloudflare-products.json"
          meta_file="$RUNNER_TEMP/cloudflare-deploy-meta.json"

          for attempt in $(seq 1 18); do
            root_status="$(curl --silent --show-error --max-time 20 -o "$root_file" -w '%{http_code}' "$STOREFRONT_URL/" || true)"
            catalog_status="$(curl --silent --show-error --max-time 20 -o "$catalog_file" -w '%{http_code}' "$STOREFRONT_URL/data/products.json" || true)"
            meta_status="$(curl --silent --show-error --max-time 20 -o "$meta_file" -w '%{http_code}' "$STOREFRONT_URL/deploy-meta.json" || true)"
            if [ "$root_status" = "200" ] && [ "$catalog_status" = "200" ] && [ "$meta_status" = "200" ]; then
              if node - "$catalog_file" "$meta_file" <<'NODE'
          const fs = require('node:fs');
          const catalog = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          const meta = JSON.parse(fs.readFileSync(process.argv[3], 'utf8'));
          if (!Array.isArray(catalog) || catalog.length < 1) process.exit(2);
          if (meta?.sha !== process.env.GITHUB_SHA || meta?.platform !== 'cloudflare-pages') process.exit(3);
          for (const row of catalog) {
            if (row?.ativo !== true || row?.status !== 'published') process.exit(4);
            if ('curator_note' in row || 'created_by' in row || 'human_editorial_review_id' in row) process.exit(5);
          }
          console.log(`CLOUDFLARE_STOREFRONT_VERIFIED products=${catalog.length} sha=${meta.sha}`);
          NODE
              then
                exit 0
              fi
            fi
            echo "Cloudflare storefront not ready yet, attempt $attempt/18 (root=$root_status catalog=$catalog_status meta=$meta_status)."
            sleep 5
          done

          echo "Cloudflare storefront verification failed."
          exit 1
