name: Cloudflare Storefront Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-storefront-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_ACCOUNT_ID: 74f70eb5897940cbeb73dd38d911542c
      CLOUDFLARE_PAGES_PROJECT: cerberus-finds
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.14.1
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static storefront
        run: npm run build:frontend

      - name: Ensure Cloudflare Pages project
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          project_endpoint="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/${CLOUDFLARE_PAGES_PROJECT}"
          projects_endpoint="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects"
          response_file="$RUNNER_TEMP/cloudflare-pages-project.json"

          status="$(curl --silent --show-error --max-time 30 \
            -o "$response_file" -w '%{http_code}' \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H 'Content-Type: application/json' \
            "$project_endpoint" || true)"

          if [ "$status" = "200" ]; then
            node - "$response_file" <<'NODE'
          const fs = require('node:fs');
          const body = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          if (body?.success !== true || !body?.result?.name) process.exit(1);
          console.log(`Cloudflare Pages project already exists: ${body.result.name}`);
          NODE
            exit 0
          fi

          if [ "$status" != "404" ]; then
            echo "Cloudflare Pages project lookup failed with HTTP ${status}." >&2
            cat "$response_file" >&2
            exit 1
          fi

          create_status="$(curl --silent --show-error --max-time 30 \
            -o "$response_file" -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H 'Content-Type: application/json' \
            --data "{\"name\":\"${CLOUDFLARE_PAGES_PROJECT}\",\"production_branch\":\"main\"}" \
            "$projects_endpoint" || true)"

          if [ "$create_status" != "200" ] && [ "$create_status" != "201" ]; then
            echo "Cloudflare Pages project creation failed with HTTP ${create_status}." >&2
            cat "$response_file" >&2
            exit 1
          fi

          node - "$response_file" <<'NODE'
          const fs = require('node:fs');
          const body = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          if (body?.success !== true || !body?.result?.name || !body?.result?.subdomain) {
            console.error('Cloudflare Pages project creation did not return a usable project.');
            process.exit(1);
          }
          console.log(`Cloudflare Pages project created: ${body.result.name} (${body.result.subdomain})`);
          NODE

      - name: Deploy storefront to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          command: pages deploy dist --project-name=${{ env.CLOUDFLARE_PAGES_PROJECT }} --branch=main
