name: Cloudflare Storefront Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-storefront-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_ACCOUNT_ID: 74f70eb5897940cbeb73dd38d911542c
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.14.1
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static storefront
        run: npm run build:frontend

      - name: Ensure workers.dev account subdomain
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          endpoint="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/subdomain"
          response_file="$RUNNER_TEMP/cloudflare-workers-subdomain.json"
          status="$(curl --silent --show-error --max-time 30 \
            -o "$response_file" -w '%{http_code}' \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H 'Content-Type: application/json' \
            "$endpoint" || true)"

          configured="$(node - "$response_file" <<'NODE'
          const fs = require('node:fs');
          try {
            const body = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
            process.stdout.write(body?.success === true && typeof body?.result?.subdomain === 'string' && body.result.subdomain.trim() ? 'yes' : 'no');
          } catch { process.stdout.write('no'); }
          NODE
          )"

          if [ "$status" = "200" ] && [ "$configured" = "yes" ]; then
            echo "workers.dev account subdomain already configured"
            exit 0
          fi

          curl --fail-with-body --silent --show-error --max-time 30 \
            -o "$response_file" \
            -X PUT \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H 'Content-Type: application/json' \
            --data '{"subdomain":"cerberus-finds-kauabrennan5"}' \
            "$endpoint"

          node - "$response_file" <<'NODE'
          const fs = require('node:fs');
          const body = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          if (body?.success !== true || typeof body?.result?.subdomain !== 'string' || !body.result.subdomain.trim()) {
            console.error('Cloudflare workers.dev subdomain registration did not return success.');
            process.exit(1);
          }
          console.log(`workers.dev account subdomain configured: ${body.result.subdomain}`);
          NODE

      - name: Deploy to Cloudflare Workers Static Assets
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          command: deploy
