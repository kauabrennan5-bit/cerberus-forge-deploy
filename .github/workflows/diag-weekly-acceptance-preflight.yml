name: Weekly Acceptance Production Preflight

on:
  push:
    branches:
      - diag/weekly-acceptance-preflight-2026-08-29

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      EXPECTED_SHA: c51a7f1987046c1e7f53ae32b46f8bdefcfd2503
      CERBERUS_HEALTH_URL: https://cerberus-forge-deploy-backend.onrender.com/health
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
    steps:
      - name: Verify deployed health SHA
        shell: bash
        run: |
          set -euo pipefail
          rm -f "$RUNNER_TEMP/weekly-preflight.env"
          health_ok=false
          live_sha=""
          for attempt in $(seq 1 18); do
            body="$(curl --fail-with-body --silent --show-error --max-time 15 "$CERBERUS_HEALTH_URL" || true)"
            status="$(printf '%s' "$body" | jq -r '.status // empty' 2>/dev/null || true)"
            live_sha="$(printf '%s' "$body" | jq -r '.version // empty' 2>/dev/null || true)"
            if [ "$status" = "ok" ] && [ "$live_sha" = "$EXPECTED_SHA" ]; then
              health_ok=true
              break
            fi
            sleep 10
          done
          {
            echo "HEALTH_STATUS=$([ "$health_ok" = true ] && echo PASS || echo FAIL)"
            echo "LIVE_VERSION_SHA=${live_sha:-UNKNOWN}"
            echo "DEPLOY_SHA_MATCH=$health_ok"
          } >> "$RUNNER_TEMP/weekly-preflight.env"
          [ "$health_ok" = true ] || { cat "$RUNNER_TEMP/weekly-preflight.env"; exit 1; }

      - name: Verify Render effective safety configuration
        shell: bash
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/weekly-preflight.env"
          if [ -z "${RENDER_API_KEY:-}" ]; then
            {
              echo "RENDER_API_ACCESS=false"
              echo "NEWSLETTER_WEEKLY_ENABLED_EFFECTIVE=UNVERIFIED"
              echo "WEEKLY_PRODUCTION_ENABLED=UNVERIFIED"
              echo "TEST_EMAIL_PRESENT=UNVERIFIED"
              echo "TEST_EMAIL_VALID=UNVERIFIED"
            } >> "$report"
            echo 'Render API credential unavailable; effective flag cannot be proven.' >&2
            exit 1
          fi

          auth=(-H "Authorization: Bearer ${RENDER_API_KEY}" -H 'Accept: application/json')
          services="$(curl --fail-with-body --silent --show-error --max-time 20 "${auth[@]}" 'https://api.render.com/v1/services?limit=100')"
          service_id="$(printf '%s' "$services" | jq -r '[.[] | .service | select(.name == "cerberus-forge-deploy-backend")][0].id // empty')"
          service_branch="$(printf '%s' "$services" | jq -r '[.[] | .service | select(.name == "cerberus-forge-deploy-backend")][0].branch // empty')"
          service_autodeploy="$(printf '%s' "$services" | jq -r '[.[] | .service | select(.name == "cerberus-forge-deploy-backend")][0].autoDeploy // empty')"
          [ -n "$service_id" ] || { echo 'Render backend service not found' >&2; exit 1; }

          get_direct_value() {
            local key="$1" code
            local body_file="$RUNNER_TEMP/render-direct-${key}.json"
            code="$(curl --silent --show-error --max-time 20 -o "$body_file" -w '%{http_code}' "${auth[@]}" "https://api.render.com/v1/services/${service_id}/env-vars/${key}")"
            if [ "$code" = 200 ]; then jq -r '.value // empty' "$body_file"; return 0; fi
            if [ "$code" = 404 ]; then return 0; fi
            echo "Render env lookup failed for ${key}: HTTP ${code}" >&2; return 1
          }

          direct_flag="$(get_direct_value NEWSLETTER_WEEKLY_ENABLED)"
          direct_test_email="$(get_direct_value NEWSLETTER_TEST_EMAIL)"
          linked_flag_values=()
          linked_test_values=()
          groups="$(curl --fail-with-body --silent --show-error --max-time 20 "${auth[@]}" 'https://api.render.com/v1/env-groups?limit=100')"
          mapfile -t group_ids < <(printf '%s' "$groups" | jq -r '.[] | .envGroup.id // .id // empty')
          for gid in "${group_ids[@]:-}"; do
            [ -n "$gid" ] || continue
            detail="$(curl --fail-with-body --silent --show-error --max-time 20 "${auth[@]}" "https://api.render.com/v1/env-groups/${gid}")"
            if ! printf '%s' "$detail" | jq -e --arg sid "$service_id" '.. | strings | select(. == $sid)' >/dev/null 2>&1; then continue; fi
            for key in NEWSLETTER_WEEKLY_ENABLED NEWSLETTER_TEST_EMAIL; do
              file="$RUNNER_TEMP/render-group-${gid}-${key}.json"
              code="$(curl --silent --show-error --max-time 20 -o "$file" -w '%{http_code}' "${auth[@]}" "https://api.render.com/v1/env-groups/${gid}/env-vars/${key}")"
              if [ "$code" = 200 ]; then
                value="$(jq -r '.value // empty' "$file")"
                if [ "$key" = NEWSLETTER_WEEKLY_ENABLED ]; then linked_flag_values+=("$value"); else linked_test_values+=("$value"); fi
              elif [ "$code" != 404 ]; then echo "Render env group lookup failed: HTTP $code" >&2; exit 1; fi
            done
          done

          flag_true=false
          [ "$direct_flag" = true ] && flag_true=true
          for v in "${linked_flag_values[@]:-}"; do [ "$v" = true ] && flag_true=true; done

          test_candidates=()
          [ -n "$direct_test_email" ] && test_candidates+=("$direct_test_email")
          for v in "${linked_test_values[@]:-}"; do [ -n "$v" ] && test_candidates+=("$v"); done
          unique_test_count="$(printf '%s\n' "${test_candidates[@]:-}" | sed '/^$/d' | sort -u | wc -l | tr -d ' ')"
          test_email="$(printf '%s\n' "${test_candidates[@]:-}" | sed '/^$/d' | sort -u | head -n1)"
          test_valid=false
          if [ "$unique_test_count" = 1 ] && printf '%s' "$test_email" | grep -Eq '^[^[:space:]@]+@[^[:space:]@]+\.[^[:space:]@]+$'; then test_valid=true; fi

          {
            echo "RENDER_API_ACCESS=true"
            echo "RENDER_SERVICE_ID=${service_id}"
            echo "RENDER_SERVICE_BRANCH=${service_branch:-UNKNOWN}"
            echo "RENDER_AUTO_DEPLOY=${service_autodeploy:-UNKNOWN}"
            echo "NEWSLETTER_WEEKLY_ENABLED_EFFECTIVE=$([ "$flag_true" = true ] && echo true || echo false)"
            echo "WEEKLY_PRODUCTION_ENABLED=$flag_true"
            echo "TEST_EMAIL_PRESENT=$([ "$unique_test_count" -ge 1 ] && echo true || echo false)"
            echo "TEST_EMAIL_VALID=$test_valid"
            echo "TEST_EMAIL_UNIQUE_COUNT=$unique_test_count"
          } >> "$report"

          [ "$flag_true" = false ] || { echo 'Weekly production flag is TRUE; aborting.' >&2; exit 1; }
          [ "$test_valid" = true ] || { echo 'NEWSLETTER_TEST_EMAIL is missing, ambiguous, or invalid.' >&2; exit 1; }

      - name: Publish sanitized preflight evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -f "$RUNNER_TEMP/weekly-preflight.env" || touch "$RUNNER_TEMP/weekly-preflight.env"
          cat "$RUNNER_TEMP/weekly-preflight.env"
          cp "$RUNNER_TEMP/weekly-preflight.env" weekly-acceptance-preflight.env

      - name: Upload sanitized preflight evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weekly-acceptance-preflight-${{ github.run_id }}
          path: weekly-acceptance-preflight.env
          retention-days: 7
