                  }
                  with open(snapshot_path, "w", encoding="utf-8") as snapshot_file:
                      json.dump(snapshot, snapshot_file, sort_keys=True)
                  RESULT.update(snapshot)
                  if not overlap_b:
                      RESULT["technical_block"] = True
                  elif any(value == "FAIL" for value in assertions.values()):
                      RESULT["test_i"] = "FAIL_DIAGNOSTIC"
                  elif any(value == "NOT_DETERMINABLE" for value in assertions.values()):
                      RESULT["test_i"] = "DIAGNOSTICALLY_INCONCLUSIVE"
                  else:
                      RESULT["test_i"] = "PASS_DIAGNOSTIC"
                  RESULT["result"] = "DIAGNOSTIC_ONLY"
              except Exception:
                  RESULT["technical_block"] = True
              finally:
