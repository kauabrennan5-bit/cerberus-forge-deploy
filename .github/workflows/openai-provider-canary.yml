name: OpenAI Provider Canary

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/openai-provider-canary.yml"
      - "scripts/run-openai-provider-canary-direct.ts"
      - "server/services/aiProviderHealth.ts"
      - "server/services/openAIProviderRuntime.ts"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: openai-provider-canary
  cancel-in-progress: true

jobs:
  provider-canary:
    if: github.event_name == 'workflow_dispatch' || vars.CERBERUS_SERVERLESS_PROVIDER_CANARY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_PRODUCT_IMAGE_REVIEW_ENABLED: "true"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.1
          cache: npm
      - run: npm ci
      - name: Run direct provider canary without production write credentials
        run: npx tsx scripts/run-openai-provider-canary-direct.ts
