name: OpenAI Provider Canary

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/openai-provider-canary.yml"
      - "server/routes/autonomousCuratorRoutes.ts"
      - "server/services/productImageReview.ts"
      - "server/services/autonomousCuratorSemanticDiscovery.ts"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: openai-provider-canary
  cancel-in-progress: true

jobs:
  provider-canary:
    name: openai-provider-canary
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CERBERUS_HEALTH_URL: https://cerberus-forge-deploy-backend.onrender.com/health
      OIDC_AUDIENCE: cerberus-weekly-automation
    steps:
      - name: Wait for exact Render SHA
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          response_file="$RUNNER_TEMP/cerberus-health.json"
          for attempt in $(seq 1 60); do
            status="$(curl --silent --show-error --max-time 20 -o "$response_file" -w '%{http_code}' "$CERBERUS_HEALTH_URL" || true)"
            if [ "$status" = "200" ]; then
              live_sha="$(node - "$response_file" <<'NODE'
          const fs = require('node:fs');
          try {
            const body = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
            process.stdout.write(typeof body?.version === 'string' ? body.version.trim() : '');
          } catch { process.stdout.write(''); }
          NODE
          )"
              if [ "$live_sha" = "$GITHUB_SHA" ]; then
                echo "RENDER_LIVE_SHA_VERIFIED=true"
                break
              fi
            fi
            if [ "$attempt" = "60" ]; then
              echo "Render did not serve the expected SHA."
              exit 1
            fi
            sleep 10
          done

      - name: Probe OpenAI image-review provider through live backend
        shell: bash
        run: |
          set -euo pipefail
          base="${CERBERUS_HEALTH_URL%/health}"
          token_json="$(curl --fail --silent --show-error --max-time 20 \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${OIDC_AUDIENCE}")"
          token="$(node -e 'const b=JSON.parse(process.argv[1]); if(typeof b.value!=="string"||!b.value) process.exit(1); process.stdout.write(b.value)' "$token_json")"
          echo "::add-mask::$token"

          provider_file="$RUNNER_TEMP/openai-provider-health.json"
          curl --fail-with-body --silent --show-error --max-time 30 \
            -o "$provider_file" \
            -X POST \
            -H "Authorization: Bearer ${token}" \
            -H 'Content-Type: application/json' \
            -d '{}' \
            "$base/api/internal/autonomous-curator/provider-health"

          node - "$provider_file" <<'NODE'
          const fs = require('node:fs');
          const body = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          const provider = body?.providers?.openai || {};
          const summary = {
            configured: provider.configured === true,
            enabled: provider.enabled === true,
            model: typeof provider.model === 'string' ? provider.model : null,
            fallbackModel: typeof provider.fallbackModel === 'string' ? provider.fallbackModel : null,
            status: typeof provider.status === 'string' ? provider.status : 'unknown',
            httpStatus: Number.isInteger(provider.httpStatus) ? provider.httpStatus : null,
            errorCode: typeof provider.errorCode === 'string' ? provider.errorCode : null,
          };
          console.log(`OPENAI_PROVIDER_CANARY=${JSON.stringify(summary)}`);
          if (body?.ok !== true || summary.configured !== true || summary.enabled !== true || summary.status !== 'ok') {
            process.exit(1);
          }
          NODE
