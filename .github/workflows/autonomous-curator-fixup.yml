name: Autonomous Curator Completion Fixup

on:
  push:
    branches:
      - feat/autonomous-curator-2026-08-29
    paths:
      - ".github/workflows/autonomous-curator-fixup.yml"

permissions:
  contents: write

jobs:
  fixup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/autonomous-curator-2026-08-29
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply reviewed fixup
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"pattern not found in {path}: {old[:100]!r}")
              text = text.replace(old, new, 1)
              p.write_text(text)

          # TypeScript diagnostic: Product.destaque is required.
          replace_once(
              "tests/autonomousCurator.test.ts",
              '    ativo: true,\n    status: "published",',
              '    ativo: true,\n    destaque: false,\n    status: "published",',
          )

          # Persist review ownership in source identities.
          replace_once(
              "server/repositories/autonomousCuratorRepository.ts",
              '  productId: string | null;\n  reservedRunId: string | null;',
              '  productId: string | null;\n  reviewId: string | null;\n  reservedRunId: string | null;',
          )
          replace_once(
              "server/repositories/autonomousCuratorRepository.ts",
              '    productId: data.product_id ? String(data.product_id) : null,\n    reservedRunId:',
              '    productId: data.product_id ? String(data.product_id) : null,\n    reviewId: data.review_id ? String(data.review_id) : null,\n    reservedRunId:',
          )
          replace_once(
              "server/repositories/autonomousCuratorRepository.ts",
              '  runId: string;\n  ttlMinutes?: number;\n}): Promise<{ reserved: boolean; identity: ProductSourceIdentity | null }> {\n  const client = requireSupabase();\n  const now = Date.now();\n  const reservedUntil = new Date(now + Math.max(5, Math.min(120, input.ttlMinutes ?? 30)) * 60_000).toISOString();',
              '  runId: string;\n  reviewId?: string | null;\n  ttlMinutes?: number;\n}): Promise<{ reserved: boolean; identity: ProductSourceIdentity | null }> {\n  const client = requireSupabase();\n  const now = Date.now();\n  const maxTtlMinutes = input.reviewId ? 24 * 60 : 120;\n  const defaultTtlMinutes = input.reviewId ? 24 * 60 : 30;\n  const reservedUntil = new Date(now + Math.max(5, Math.min(maxTtlMinutes, input.ttlMinutes ?? defaultTtlMinutes)) * 60_000).toISOString();',
          )
          replace_once(
              "server/repositories/autonomousCuratorRepository.ts",
              '    source: "autonomous_curator",\n    reserved_run_id: input.runId,',
              '    source: "autonomous_curator",\n    review_id: input.reviewId ?? null,\n    reserved_run_id: input.runId,',
          )
          replace_once(
              "server/repositories/autonomousCuratorRepository.ts",
              '        productId: null,\n        reservedRunId: input.runId,',
              '        productId: null,\n        reviewId: input.reviewId ?? null,\n        reservedRunId: input.runId,',
          )
          replace_once(
              "server/repositories/autonomousCuratorRepository.ts",
              '  const expiry = existing.reservedUntil ? Date.parse(existing.reservedUntil) : 0;\n  if (existing.reservedRunId === input.runId || (Number.isFinite(expiry) && expiry <= now)) {\n    const { data, error: updateError } = await client.from("product_source_identities").update({\n      source_product_url: input.sourceProductUrl,\n      reserved_run_id: input.runId,',
              '  const expiry = existing.reservedUntil ? Date.parse(existing.reservedUntil) : 0;\n  const expired = Number.isFinite(expiry) && expiry <= now;\n  const sameReview = Boolean(input.reviewId && existing.reviewId === input.reviewId);\n  const sameRunWithoutReview = !input.reviewId && !existing.reviewId && existing.reservedRunId === input.runId;\n  if (sameReview || sameRunWithoutReview || expired) {\n    const { data, error: updateError } = await client.from("product_source_identities").update({\n      source_product_url: input.sourceProductUrl,\n      review_id: input.reviewId ?? null,\n      reserved_run_id: input.runId,',
          )
          replace_once(
              "server/repositories/autonomousCuratorRepository.ts",
              '    if (data) return { reserved: true, identity: { ...existing, sourceProductUrl: input.sourceProductUrl, reservedRunId: input.runId, reservedUntil } };',
              '    if (data) return { reserved: true, identity: { ...existing, sourceProductUrl: input.sourceProductUrl, reviewId: input.reviewId ?? null, reservedRunId: input.runId, reservedUntil } };',
          )
          replace_once(
              "server/repositories/autonomousCuratorRepository.ts",
              '  const { error } = await client.from("product_source_identities").update({\n    product_id: input.productId,\n    reserved_run_id: input.runId,\n    reserved_until: null,',
              '  const { error } = await client.from("product_source_identities").update({\n    product_id: input.productId,\n    review_id: null,\n    reserved_run_id: input.runId,\n    reserved_until: null,',
          )
          marker = 'export async function saveProductImageEditorialReview(input: {'
          repo = Path("server/repositories/autonomousCuratorRepository.ts")
          text = repo.read_text()
          if marker not in text:
              raise SystemExit("saveProductImageEditorialReview marker not found")
          addition = '''export async function bindProductSourceIdentityByReview(input: {\n  reviewId: string;\n  productId: string;\n}): Promise<void> {\n  const client = requireSupabase();\n  const { data, error } = await client.from("product_source_identities").update({\n    product_id: input.productId,\n    review_id: null,\n    reserved_run_id: null,\n    reserved_until: null,\n    updated_at: new Date().toISOString(),\n  }).eq("review_id", input.reviewId).is("product_id", null).select("id").maybeSingle();\n  if (error) throw error;\n  if (!data) throw new Error("AUTONOMOUS_CURATOR_REVIEW_IDENTITY_MISSING");\n}\n\nexport async function releaseProductSourceIdentityByReview(reviewId: string): Promise<void> {\n  const client = requireSupabase();\n  const { error } = await client.from("product_source_identities").delete()\n    .eq("review_id", reviewId).is("product_id", null);\n  if (error) throw error;\n}\n\n'''
          repo.write_text(text.replace(marker, addition + marker, 1))

          # A live pending-review repository becomes the lifecycle bridge:
          # pending reserves; published binds; rejected/cancelled/expired releases.
          replace_once(
              "server/repositories/telegramRepository.ts",
              'import type { PendingReview, TelegramReviewStatus } from "../services/telegramTypes";\n',
              'import type { PendingReview, TelegramReviewStatus } from "../services/telegramTypes";\nimport { bindProductSourceIdentityByReview, releaseProductSourceIdentityByReview, reserveProductSourceIdentity } from "./autonomousCuratorRepository";\n',
          )
          marker = 'export async function savePendingReview(review: PendingReview): Promise<void> {'
          p = Path("server/repositories/telegramRepository.ts")
          text = p.read_text()
          helper = '''async function syncAutonomousCuratorReviewIdentity(review: PendingReview): Promise<void> {\n  const meta = review.existingProduct as any;\n  if (meta?.source !== "autonomous_curator") return;\n  const shopId = String(meta.shopId || "").trim();\n  const itemId = String(meta.itemId || "").trim();\n  const runId = String(meta.autonomousCuratorRunId || "").trim();\n  if (!shopId || !itemId || !runId || !review.normalizedUrl) {\n    throw new Error("AUTONOMOUS_CURATOR_REVIEW_IDENTITY_METADATA_INVALID");\n  }\n  const status = review.status || "pending";\n  if (status === "published") {\n    const productId = review.lifecycle?.publishedProductId;\n    if (!productId) throw new Error("AUTONOMOUS_CURATOR_REVIEW_PUBLISHED_PRODUCT_MISSING");\n    await bindProductSourceIdentityByReview({ reviewId: review.id, productId });\n    return;\n  }\n  if (["rejected", "cancelled", "expired"].includes(status)) {\n    await releaseProductSourceIdentityByReview(review.id);\n    return;\n  }\n  const ttlMinutes = Math.max(5, Math.ceil(((review.expiresAt || (Date.now() + SESSION_EXPIRATION_MS)) - Date.now()) / 60_000));\n  const reservation = await reserveProductSourceIdentity({\n    marketplace: "Shopee",\n    shopId,\n    itemId,\n    sourceProductUrl: review.normalizedUrl,\n    runId,\n    reviewId: review.id,\n    ttlMinutes,\n  });\n  if (!reservation.reserved) throw new Error("AUTONOMOUS_CURATOR_REVIEW_IDENTITY_CONFLICT");\n}\n\n'''
          if marker not in text:
              raise SystemExit("savePendingReview marker not found")
          text = text.replace(marker, helper + marker, 1)
          old = '''  const normReview: PendingReview = {\n    ...review,\n    createdAt,\n    expiresAt,\n    status,\n  };\n\n  const reviews = readReviewsFromFile();'''
          new = '''  const normReview: PendingReview = {\n    ...review,\n    createdAt,\n    expiresAt,\n    status,\n  };\n\n  await syncAutonomousCuratorReviewIdentity(normReview);\n\n  const reviews = readReviewsFromFile();'''
          if old not in text:
              raise SystemExit("normReview insertion marker not found")
          p.write_text(text.replace(old, new, 1))

          # Skip active source reservations before affiliate acquisition / Gemini.
          replace_once(
              "server/services/autonomousCurator.ts",
              '    const sourceIdentity = await findIdentity("Shopee", shopId, itemId);\n    const existingByIdentity = exactExistingIdentity(input.existingProducts, shopId, itemId);\n    if (sourceIdentity?.productId || existingByIdentity) {',
              '    const sourceIdentity = await findIdentity("Shopee", shopId, itemId);\n    const existingByIdentity = exactExistingIdentity(input.existingProducts, shopId, itemId);\n    const reservedUntilMs = sourceIdentity?.reservedUntil ? Date.parse(sourceIdentity.reservedUntil) : 0;\n    const sourceIdentityReserved = Boolean(sourceIdentity && !sourceIdentity.productId && Number.isFinite(reservedUntilMs) && reservedUntilMs > Date.now());\n    if (sourceIdentity?.productId || sourceIdentityReserved || existingByIdentity) {',
          )

          # Extend unit coverage: active reservation is deduped before extraction.
          test_file = Path("tests/autonomousCurator.test.ts")
          text = test_file.read_text()
          append = '''\n\ntest("identidade Shopee reservada por review ativa é descartada antes de Gemini/scraper", async () => {\n  const repo = persistence({\n    findSourceIdentity: async () => ({\n      marketplace: "Shopee",\n      shopId: "123",\n      itemId: "456",\n      sourceProductUrl: "https://shopee.com.br/product/123/456",\n      productId: null,\n      reviewId: "autocur-review-1",\n      reservedRunId: "run-existing",\n      reservedUntil: new Date(Date.now() + 60_000).toISOString(),\n    }),\n  });\n  let extractorCalls = 0;\n  const result = await runAutonomousCuratorDaily({ dryRun: true, notify: false }, {\n    env: {},\n    now: new Date("2026-08-29T12:00:00-03:00"),\n    shopeeClient: shopeeClient(),\n    getConfig: async () => config(),\n    openRun: repo.openRun as any,\n    getCategoryResult: repo.getCategoryResult as any,\n    saveCategoryResult: repo.saveCategoryResult as any,\n    finishRun: repo.finishRun as any,\n    findSourceIdentity: repo.findSourceIdentity as any,\n    productsLoader: async () => [],\n    extractor: (async () => { extractorCalls += 1; return { success: false }; }) as any,\n  });\n  assert.equal(extractorCalls, 0);\n  assert.equal(result.categories[0].decision, "duplicate");\n});\n'''
          if 'reservada por review ativa' not in text:
              test_file.write_text(text + append)

          # Diagnostic and fixup workflows are temporary and must not merge.
          for wf in [
              Path(".github/workflows/autonomous-curator-ts-diagnostic.yml"),
              Path(".github/workflows/autonomous-curator-fixup.yml"),
          ]:
              if wf.exists():
                  wf.unlink()
          PY
      - run: npm ci
      - name: Focused autonomous curator tests
        run: node --import tsx/esm --test --test-concurrency=1 tests/autonomousCurator.test.ts
      - name: TypeScript
        run: npm run lint
      - name: Commit fixup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: complete autonomous curator review identity lifecycle"
          git push origin HEAD:feat/autonomous-curator-2026-08-29
