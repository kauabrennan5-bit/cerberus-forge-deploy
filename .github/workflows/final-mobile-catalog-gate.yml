name: Final mobile catalog gate

on:
  push:
    branches:
      - fix/mobile-catalog-categories-2026-08-28
    paths:
      - .github/workflows/final-mobile-catalog-gate.yml

jobs:
  final-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Dependency audit
        run: npm audit --audit-level=high

      - name: Full tests
        run: npm test

      - name: TypeScript
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Diff integrity
        run: git diff --check origin/main...HEAD

      - name: Exact changed-file allowlist
        shell: bash
        run: |
          cat > /tmp/expected-files.txt <<'EOF'
          package.json
          scripts/generate-static-catalog.js
          server/commercial/publication/contract.ts
          server/commercial/publication/publicationExecutor.ts
          server/repositories/productsRepository.ts
          server/services/productAutomation.ts
          server/services/telegramBot.ts
          src/App.tsx
          src/components/ProductCard.tsx
          src/components/ProductDetail.tsx
          src/components/ProductGrid.tsx
          src/lib/catalogNavigation.ts
          src/lib/productCategory.ts
          src/lib/relatedProducts.ts
          src/services/api.ts
          tests/affiliateResolverN7.test.ts
          tests/catalogNavigation.test.ts
          tests/promotionOffer.test.ts
          tests/publicCategoryPipeline.test.ts
          tests/relatedProductsCarousel.test.ts
          tests/telegramAndMarketplace.test.ts
          EOF
          git diff --name-only origin/main...HEAD | grep -v '^\.github/workflows/final-mobile-catalog-gate\.yml$' | sort > /tmp/actual-files.txt
          sort -o /tmp/expected-files.txt /tmp/expected-files.txt
          echo 'Changed files:'
          cat /tmp/actual-files.txt
          diff -u /tmp/expected-files.txt /tmp/actual-files.txt

      - name: Install verified Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          version='8.30.1'
          archive="gitleaks_${version}_linux_x64.tar.gz"
          base="https://github.com/gitleaks/gitleaks/releases/download/v${version}"
          curl -fsSL "$base/$archive" -o "/tmp/$archive"
          curl -fsSL "$base/gitleaks_${version}_checksums.txt" -o /tmp/gitleaks-checksums.txt
          (cd /tmp && grep "  $archive$" gitleaks-checksums.txt | sha256sum -c -)
          tar -xzf "/tmp/$archive" -C /tmp gitleaks
          /tmp/gitleaks version

      - name: New-secret scan on merge diff
        shell: bash
        run: |
          set -euo pipefail
          git diff --unified=0 origin/main...HEAD -- \
            ':!.github/workflows/final-mobile-catalog-gate.yml' \
            | awk '/^\+\+\+/{next} /^\+/{sub(/^\+/, ""); print}' > /tmp/added-lines.txt
          /tmp/gitleaks stdin --redact --no-banner < /tmp/added-lines.txt
          echo 'No new secrets detected in added merge-diff lines.'

      - name: Final branch summary
        run: |
          echo "HEAD=$(git rev-parse HEAD)"
          echo "BASE=$(git rev-parse origin/main)"
          echo "CHANGED_FILES=$(git diff --name-only origin/main...HEAD | grep -v '^\.github/workflows/final-mobile-catalog-gate\.yml$' | wc -l)"
