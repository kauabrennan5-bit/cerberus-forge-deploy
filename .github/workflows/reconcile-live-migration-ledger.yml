name: Reconcile live migration ledger
on:
  push:
    branches: [fix/production-single-source-2026-09-03]
    paths: [.github/workflows/reconcile-live-migration-ledger.yml]
permissions:
  contents: write
jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Align tracked files to LIVE versions
        shell: bash
        run: |
          set -euo pipefail
          mv supabase/migrations/20260817_commercial_cycles.sql supabase/migrations/20260817191857_commercial_cycles.sql
          mv supabase/migrations/20260819_commercial_brain_candidates.sql supabase/migrations/20260819033038_commercial_brain_candidates.sql
          mv supabase/migrations/20260821_n17_acquisition_api.sql supabase/migrations/20260820160811_n17_acquisition_api.sql
          mv supabase/migrations/20260825195922_newsletter_outbox_claim_worker.sql supabase/migrations/20260825210617_newsletter_outbox_claim_worker.sql
          mv supabase/migrations/20260826010000_email_campaigns.sql supabase/migrations/20260826015708_email_campaigns.sql
          mv supabase/migrations/20260826050500_email_campaign_test_provider_reference.sql supabase/migrations/20260826050947_email_campaign_test_provider_reference.sql
          mv supabase/migrations/20260826124500_email_campaign_welcome_type.sql supabase/migrations/20260826124540_email_campaign_welcome_type.sql
          mv supabase/migrations/20260826150000_fix_email_campaign_recipient_email_format.sql supabase/migrations/20260826223722_fix_email_campaign_recipient_email_format.sql
          mv supabase/migrations/20260827040000_newsletter_campaign_test_retention.sql supabase/migrations/20260827040234_newsletter_campaign_test_retention.sql
          mv supabase/migrations/20260827100000_newsletter_collection_campaign.sql supabase/migrations/20260827045741_newsletter_collection_campaign.sql
          mv supabase/migrations/20260827170000_email_campaign_telegram_cards.sql supabase/migrations/20260827170502_email_campaign_telegram_cards.sql
          mv supabase/migrations/20260827210000_social_links.sql supabase/migrations/20260827214038_social_links.sql
          mv supabase/migrations/20260828020000_email_campaign_collection_dedupe.sql supabase/migrations/20260828021300_email_campaign_collection_dedupe.sql
          mv supabase/migrations/20260829225000_newsletter_weekly_runtime_config.sql supabase/migrations/20260829231313_newsletter_weekly_runtime_config.sql
          mv supabase/migrations/20260829212000_autonomous_curator.sql supabase/migrations/20260830012309_autonomous_curator.sql
          mv supabase/migrations/20260830023000_autonomous_curator_recovery.sql supabase/migrations/20260830023433_autonomous_curator_recovery.sql
          mv supabase/migrations/20260830050600_weekly_production_hardening_final.sql supabase/migrations/20260830060114_weekly_production_hardening_final.sql
          mv supabase/migrations/20260830174500_autonomous_curator_search_recall.sql supabase/migrations/20260830175646_autonomous_curator_search_recall.sql
          mv supabase/migrations/20260831180500_product_rotation_requests.sql supabase/migrations/20260831175905_product_rotation_requests.sql
          mv supabase/migrations/20260831182000_harden_product_rotation_transitions.sql supabase/migrations/20260831181616_harden_product_rotation_transitions.sql
          mv supabase/migrations/20260902233000_product_publication_gate.sql supabase/migrations/20260903041603_product_publication_gate.sql
          mv supabase/migrations/20260902234500_autonomous_curator_run_recovery.sql supabase/migrations/20260903041613_autonomous_curator_run_recovery.sql
          mv supabase/migrations/20260902235500_operator_incident_recovery.sql supabase/migrations/20260903041623_operator_incident_recovery.sql

          cat > supabase/migrations/20260821000252_create_telegram_pending_reviews.sql <<'SQL'
          create table if not exists public.telegram_pending_reviews (
            id text primary key, chat_id text not null, sender_id text not null, first_name text, username text,
            created_at bigint not null, expires_at bigint not null, status text not null default 'pending', data jsonb,
            inserted_at timestamptz not null default now(), updated_at timestamptz not null default now()
          );
          SQL
          cat > supabase/migrations/20260822202859_enable_telegram_pending_reviews_rls.sql <<'SQL'
          alter table public.telegram_pending_reviews enable row level security;
          revoke all on table public.telegram_pending_reviews from anon, authenticated;
          SQL

          for spec in \
            '20260825043450 newsletter_subscribers_subscribed_consent_check' \
            '20260825125507 newsletter_outbox_persistence' \
            '20260825131144 newsletter_outbox_security_hardening' \
            '20260825141117 confirm_newsletter_consent_with_outbox' \
            '20260825141656 rollback_confirm_newsletter_consent_with_outbox' \
            '20260825143032 confirm_newsletter_consent_with_outbox' \
            '20260825143321 rollback_q7r2_confirm_newsletter_consent_with_outbox' \
            '20260825173156 confirm_newsletter_consent_with_outbox_q7r13' \
            '20260825173430 rollback_q7r2_confirm_newsletter_consent_with_outbox' \
            '20260828012117 email_campaign_direct_send'; do
            set -- $spec
            printf '%s\n' '-- Historical version recorded as applied in LIVE.' '-- Original SQL artifact is not present in repository history; final schema is reconstructed by supabase/baseline and later surviving migrations.' > "supabase/migrations/${1}_${2}.sql"
          done

          node - <<'NODE'
          const fs=require('fs');
          const files=fs.readdirSync('supabase/migrations').filter(f=>f.endsWith('.sql')).sort();
          const versions=files.map(f=>f.split('_')[0]);
          const dups=versions.filter((v,i)=>versions.indexOf(v)!==i);
          if (dups.length) throw new Error(`duplicate versions: ${[...new Set(dups)].join(',')}`);
          console.log(`migration files=${files.length}`);
          NODE
          rm .github/workflows/reconcile-live-migration-ledger.yml
      - name: Commit ledger reconciliation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix(db): align migrations with LIVE ledger'
          git push origin HEAD:fix/production-single-source-2026-09-03
