name: One-off Admin P0 patch

on:
  push:
    branches: [fix/security-p0-2026-08-28]
    paths:
      - PATCH_ADMIN_P0_NOW

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'chore: trigger admin P0 patch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/security-p0-2026-08-28
          fetch-depth: 0
      - name: Apply exact AdminForm patch
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/components/AdminForm.tsx')
          s = p.read_text()

          replacements = [
            (
              "  const [submitSuccess, setSubmitSuccess] = useState<boolean>(false);\n  const [submitError, setSubmitError] = useState<string | null>(null);",
              "  const [submitSuccess, setSubmitSuccess] = useState<boolean>(false);\n  const [submitPending, setSubmitPending] = useState<string | null>(null);\n  const [submitError, setSubmitError] = useState<string | null>(null);"
            ),
            (
              "    setSubmitError(null);\n    setSubmitSuccess(false);",
              "    setSubmitError(null);\n    setSubmitPending(null);\n    setSubmitSuccess(false);"
            ),
            (
              "      if (resJson.success) {\n        setSubmitSuccess(true);",
              "      if (resJson.pending) {\n        setSubmitError(null);\n        setSubmitPending(resJson.message || resJson.error || 'Produto enviado para revisão e aguardando aprovação humana no Telegram.');\n      } else if (resJson.success) {\n        setSubmitSuccess(true);"
            ),
            (
              "        {/* Global Submit Error Banner */}\n        {submitError && (",
              "        {/* Pending approval is an expected workflow state, not a backend error. */}\n        {submitPending && (\n          <div role=\"status\" className=\"bg-[#181512] border border-[#8A1F1F] rounded-none p-4 text-xs text-[#E8E1D3] flex items-start space-x-2\">\n            <ShieldCheck className=\"w-4 h-4 text-[#8A1F1F] shrink-0 mt-0.5\" />\n            <div>\n              <p className=\"font-bold uppercase tracking-wider\">Aguardando aprovação humana</p>\n              <p className=\"leading-relaxed mt-1\">{submitPending}</p>\n            </div>\n          </div>\n        )}\n\n        {/* Global Submit Error Banner */}\n        {submitError && ("
            ),
            (
              "                  <span>Publicar no Banco do Acervo</span>",
              "                  <span>Enviar para Revisão</span>"
            ),
            (
              "        adminPassword={config.adminPassword}",
              "        adminPassword={passwordInput}"
            ),
          ]

          for old, new in replacements:
            count = s.count(old)
            if count != 1:
              raise SystemExit(f'Expected exactly one match, got {count}: {old[:80]!r}')
            s = s.replace(old, new, 1)

          p.write_text(s)
          PY
      - name: Commit patch and remove trigger
        run: |
          rm -f PATCH_ADMIN_P0_NOW
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/AdminForm.tsx PATCH_ADMIN_P0_NOW
          git commit -m "fix(admin): keep credentials ephemeral and show pending approval"
          git push origin HEAD:fix/security-p0-2026-08-28
