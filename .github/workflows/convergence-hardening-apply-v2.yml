name: Apply Convergence Hardening V2

on:
  push:
    branches: [convergence/public-edge-3d]
    paths:
      - .github/workflows/convergence-hardening-apply-v2.yml

permissions:
  contents: write

concurrency:
  group: convergence-hardening-apply-v2
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout convergence branch
        uses: actions/checkout@v4
        with:
          ref: convergence/public-edge-3d
          fetch-depth: 0

      - name: Apply deterministic patch
        run: python scripts/apply-convergence-hardening.py

      - name: Install dependencies
        run: npm ci

      - name: Architecture and Curator focused tests
        run: node --import tsx --test tests/productionArchitectureContract.test.ts tests/catalogRuntimeProjection.test.ts tests/operatorV2FacadeIntegration.test.ts tests/backendFrontendBoundary.test.ts tests/autonomousCuratorContinuousV2.test.ts tests/autonomousCuratorCategoryBalancePolicy.test.ts

      - name: Global regression suite
        run: npm test

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Diff check
        run: git diff --check

      - name: Commit validated hardening
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: enforce canonical public architecture and category floor"
          git push origin HEAD:convergence/public-edge-3d
