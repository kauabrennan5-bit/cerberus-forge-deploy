name: Best of lot runner
on: push
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24.14.1'
          cache: npm
      - name: Extract and apply patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/apply-mandatory-best-of-lot-patch.yml').read_text()
          marker = "          python3 <<'PY'\n"
          start = source.index(marker) + len(marker)
          end = source.index("\n          PY\n", start)
          body = source[start:end]
          lines = [(line[10:] if line.startswith('          ') else line) for line in body.splitlines()]
          Path('/tmp/apply-best-of-lot.py').write_text('\n'.join(lines) + '\n')
          PY
          python3 /tmp/apply-best-of-lot.py
      - name: Install dependencies
        run: npm ci
      - name: Focused tests
        run: node --import tsx/esm --test --test-concurrency=1 tests/autonomousCuratorBestOfLotPolicy.test.ts tests/productPublicationGate.test.ts tests/autonomousCuratorCategoryBalancePolicy.test.ts tests/autonomousCuratorPublicationGateIntegration.test.ts
      - name: TypeScript
        run: npm run lint
      - name: Backend build
        env:
          CERBERUS_BUILD_TARGET: backend
        run: npm run build
      - name: Diff check
        run: git diff --check
      - name: Commit validated implementation
        shell: bash
        run: |
          rm -f .github/workflows/apply-mandatory-best-of-lot-patch.yml .github/workflows/best-of-lot-runner.yml
          git config user.name 'cerberus-automation'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git status --short
          git commit -m 'fix: make deficit recovery best-of-lot mandatory [best-of-lot-patch]'
          git push origin HEAD:fix/mandatory-best-of-lot-deficit-recovery-20260904
