name: Repair Newsletter Logo Transparency

on:
  push:
    branches:
      - fix/newsletter-logo-transparent-clean

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/newsletter-logo-transparent-clean
          fetch-depth: 2
      - name: Generate true-transparent logo and remove masthead plate
        shell: bash
        run: |
          set -euxo pipefail
          python -m pip install --disable-pip-version-check --quiet pillow
          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          asset = Path('public/assets/newsletter/branding/cerberus-logo-user-tight.png')
          image = Image.open(asset).convert('RGBA')
          if image.size != (384, 280):
              raise SystemExit(f'unexpected logo canvas: {image.size}')
          bg = image.getpixel((0, 0))[:3]
          alpha = Image.new('L', image.size, 0)
          ap = alpha.load()
          px = image.load()
          for y in range(image.height):
              for x in range(image.width):
                  r, g, b, _ = px[x, y]
                  d = max(abs(r - bg[0]), abs(g - bg[1]), abs(b - bg[2]))
                  ap[x, y] = max(0, min(255, round((d - 3) * 255 / 32)))
          if alpha.getextrema() != (0, 255):
              raise SystemExit(f'logo alpha is not truly transparent: {alpha.getextrema()}')
          transparent = Image.new('RGBA', image.size, (0, 0, 0, 0))
          black = Image.new('RGBA', image.size, (0, 0, 0, 255))
          transparent.paste(black, (0, 0), alpha)
          transparent.save(asset, format='PNG', optimize=True, compress_level=9)
          check = Image.open(asset).convert('RGBA')
          if check.getpixel((0, 0))[3] != 0 or check.getchannel('A').getextrema() != (0, 255):
              raise SystemExit('generated logo lost real transparency')

          blocks = Path('server/services/newsletterCampaignBlocks.ts')
          text = blocks.read_text()
          text = text.replace('  brandPlate: "#F2EDE4",\n', '')
          old_mark = '  const brandMark = logoUrl\n    ? `<img class="email-masthead-logo" src="${escapeHtml(logoUrl)}" width="96" height="70" alt="Logo Cerberus Finds" style="display:block;width:96px!important;height:70px!important;object-fit:contain;border:0;outline:none;text-decoration:none;-ms-interpolation-mode:bicubic;" />`'
          new_mark = '  const brandMark = logoUrl\n    ? `<img class="email-masthead-logo" src="${escapeHtml(logoUrl)}" width="96" height="70" alt="Logo Cerberus Finds" style="display:block;width:96px!important;height:70px!important;object-fit:contain;border:0;outline:none;text-decoration:none;background:transparent;background-color:transparent;box-shadow:none;-ms-interpolation-mode:bicubic;" />`'
          if old_mark not in text:
              raise SystemExit('masthead logo markup anchor not found')
          text = text.replace(old_mark, new_mark, 1)
          old_cell = '<td class="email-masthead-brand-mark" width="108" height="82" valign="middle" align="center" bgcolor="${COLORS.brandPlate}" style="width:108px!important;height:82px!important;padding:6px;background:${COLORS.brandPlate};background-color:${COLORS.brandPlate};">${brandMark}</td>'
          new_cell = '<td class="email-masthead-brand-mark" width="108" height="82" valign="middle" align="left" style="width:108px!important;height:82px!important;padding:0;background:transparent;background-color:transparent;border:0;box-shadow:none;">${brandMark}</td>'
          if old_cell not in text:
              raise SystemExit('masthead brand plate anchor not found')
          text = text.replace(old_cell, new_cell, 1)
          blocks.write_text(text)

          regression = Path('tests/newsletterCollectionBrandSlotRegression.test.ts')
          text = regression.read_text()
          old_png = '  assert.equal(png.readUInt32BE(16), 384);\n  assert.equal(png.readUInt32BE(20), 280);'
          new_png = '  assert.equal(png.readUInt32BE(16), 384);\n  assert.equal(png.readUInt32BE(20), 280);\n  assert.equal(png[24], 8, "PNG must use 8-bit channels");\n  assert.equal(png[25], 6, "PNG must use RGBA color type so the background can remain transparent");'
          if old_png not in text:
              raise SystemExit('PNG regression anchor not found')
          text = text.replace(old_png, new_png, 1)
          old_brand_assert = '  assert.match(masthead, /class="email-masthead-brand-mark" width="108" height="82"/);'
          new_brand_assert = '  assert.match(masthead, /class="email-masthead-brand-mark" width="108" height="82"/);\n  assert.doesNotMatch(masthead, /email-masthead-brand-mark[^>]+bgcolor=/);\n  assert.doesNotMatch(masthead, /email-masthead-brand-mark[^>]+#F2EDE4/);\n  assert.match(masthead, /email-masthead-brand-mark[^>]+background:transparent/);'
          if old_brand_assert not in text:
              raise SystemExit('brand regression anchor not found')
          text = text.replace(old_brand_assert, new_brand_assert, 1)
          regression.write_text(text)

          campaign_test = Path('tests/newsletterCampaign.test.ts')
          text = campaign_test.read_text()
          old = '  assert.match(rendered.html, /class="email-masthead-brand-mark"[^>]+bgcolor="#F2EDE4"/);'
          new = '  assert.doesNotMatch(rendered.html, /class="email-masthead-brand-mark"[^>]+bgcolor=/);\n  assert.doesNotMatch(rendered.html, /class="email-masthead-brand-mark"[^>]+#F2EDE4/);'
          if old not in text:
              raise SystemExit('newsletter campaign brand plate assertion not found')
          text = text.replace(old, new, 1)
          campaign_test.write_text(text)
          PY

          file public/assets/newsletter/branding/cerberus-logo-user-tight.png
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          p=Path('public/assets/newsletter/branding/cerberus-logo-user-tight.png')
          im=Image.open(p).convert('RGBA')
          print('alpha extrema', im.getchannel('A').getextrema(), 'corner', im.getpixel((0,0)))
          assert im.getchannel('A').getextrema() == (0,255)
          assert im.getpixel((0,0))[3] == 0
          blocks=Path('server/services/newsletterCampaignBlocks.ts').read_text()
          tag=blocks.split('<td class="email-masthead-brand-mark"',1)[1].split('</td>',1)[0]
          assert 'bgcolor=' not in tag
          assert '#F2EDE4' not in tag
          assert 'background:transparent' in tag
          assert 'border:0' in tag
          PY
          git diff --check
      - name: Persist fix and remove one-off workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/repair-newsletter-logo-transparency.yml
          git add public/assets/newsletter/branding/cerberus-logo-user-tight.png server/services/newsletterCampaignBlocks.ts tests/newsletterCollectionBrandSlotRegression.test.ts tests/newsletterCampaign.test.ts
          git diff --cached --check
          git commit -m "fix: make newsletter logo transparent and borderless"
          git push origin HEAD:fix/newsletter-logo-transparent-clean
