name: One-off full test log

on:
  push:
    branches: [fix/security-p0-2026-08-28]
    paths:
      - RUN_FULL_TEST_LOG

permissions:
  contents: read

jobs:
  test-log:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run full suite and capture output
        shell: bash
        run: |
          set +e
          npm test > test-output.log 2>&1
          status=$?
          echo "$status" > test-exit-code.txt
          cat test-output.log
          exit "$status"
      - name: Upload full test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-test-log
          path: |
            test-output.log
            test-exit-code.txt
          retention-days: 1
