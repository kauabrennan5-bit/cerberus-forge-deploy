name: Continuous V2 Direct Dry Run

on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/autonomous-curator-continuous-v2-dry-run.yml"
      - "scripts/run-autonomous-curator-continuous-v2-dry-run.ts"
      - "server/commercial/affiliate/shopeeApiClient.ts"
      - "server/services/autonomousCuratorContinuousV2.ts"
      - "server/services/autonomousCuratorContinuousV2Base.ts"

permissions:
  contents: read

concurrency:
  group: cerberus-continuous-v2-direct-dry-run
  cancel-in-progress: true

jobs:
  dry-run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_URL: https://ppsxlclycyinhhoqijvz.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      SHOPEE_APP_ID: ${{ secrets.SHOPEE_APP_ID }}
      SHOPEE_APP_SECRET: ${{ secrets.SHOPEE_APP_SECRET }}
      SHOPEE_AFFILIATE_APP_ID: ${{ secrets.SHOPEE_AFFILIATE_APP_ID }}
      SHOPEE_AFFILIATE_APP_SECRET: ${{ secrets.SHOPEE_AFFILIATE_APP_SECRET }}
      SHOPEE_AFFILIATE_API_BASE_URL: ${{ vars.SHOPEE_AFFILIATE_API_BASE_URL }}
      CONTINUOUS_V2_DRY_RUN_MAX_CANDIDATES: "3"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.1
          cache: npm
      - name: Probe Shopee DNS and TLS path
        shell: bash
        run: |
          node <<'NODE'
          const dns = require('node:dns').promises;
          const tls = require('node:tls');
          const host = 'open-api.affiliate.shopee.com.br';
          (async () => {
            try {
              const result = await dns.lookup(host);
              console.log(`SHOPEE_DNS=PASS family=${result.family}`);
            } catch (error) {
              console.log(`SHOPEE_DNS=FAIL code=${String(error?.code || 'unknown')}`);
              return;
            }
            await new Promise((resolve) => {
              let settled = false;
              const finish = (message) => {
                if (settled) return;
                settled = true;
                console.log(message);
                resolve();
              };
              const socket = tls.connect({ host, port: 443, servername: host, rejectUnauthorized: true });
              const timer = setTimeout(() => {
                socket.destroy();
                finish('SHOPEE_TLS=FAIL code=timeout');
              }, 5000);
              socket.once('secureConnect', () => {
                clearTimeout(timer);
                const protocol = socket.getProtocol() || 'unknown';
                socket.end();
                finish(`SHOPEE_TLS=PASS protocol=${protocol}`);
              });
              socket.once('error', (error) => {
                clearTimeout(timer);
                finish(`SHOPEE_TLS=FAIL code=${String(error?.code || 'unknown')}`);
              });
            });
          })().catch(() => console.log('SHOPEE_NETWORK_PREFLIGHT=FAIL code=unexpected'));
          NODE
      - name: Probe Shopee HTTP transports without auth
        shell: bash
        run: |
          endpoint="https://open-api.affiliate.shopee.com.br/graphql"
          payload='{"query":"{ __typename }"}'
          set +e
          curl_status="$(curl -sS --connect-timeout 5 --max-time 10 -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: application/json' --data-binary "$payload" "$endpoint" 2>/tmp/shopee-curl.err)"
          curl_exit=$?
          set -e
          if [ "$curl_exit" -eq 0 ]; then
            echo "SHOPEE_CURL_HTTP=PASS status=${curl_status}"
          else
            curl_code="$(sed -n 's/^curl: (\([0-9][0-9]*\)).*/\1/p' /tmp/shopee-curl.err | head -n1)"
            echo "SHOPEE_CURL_HTTP=FAIL exit=${curl_exit} code=${curl_code:-unknown}"
          fi
          node <<'NODE'
          const endpoint = 'https://open-api.affiliate.shopee.com.br/graphql';
          const payload = JSON.stringify({ query: '{ __typename }' });
          (async () => {
            try {
              const response = await fetch(endpoint, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: payload,
                signal: AbortSignal.timeout(10000),
              });
              console.log(`SHOPEE_NODE_FETCH=PASS status=${response.status}`);
              await response.body?.cancel();
            } catch (error) {
              const code = error?.cause?.code || error?.code || error?.name || 'unknown';
              console.log(`SHOPEE_NODE_FETCH=FAIL code=${String(code)}`);
            }
          })().catch(() => console.log('SHOPEE_NODE_FETCH=FAIL code=unexpected'));
          NODE
      - name: Install dependencies
        run: npm ci
      - name: Run Continuous V2 direct dry-run probe
        run: npx tsx scripts/run-autonomous-curator-continuous-v2-dry-run.ts
