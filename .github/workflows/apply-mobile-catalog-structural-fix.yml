name: Apply mobile catalog structural fix

on:
  push:
    branches:
      - fix/mobile-catalog-categories-2026-08-28
    paths:
      - .github/workflows/apply-mobile-catalog-structural-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/mobile-catalog-categories-2026-08-28
          fetch-depth: 0

      - name: Apply audited structural changes
        run: |
          python <<'PY'
          from pathlib import Path
          import re

          def read(path):
              return Path(path).read_text(encoding='utf-8')

          def write(path, text):
              Path(path).write_text(text, encoding='utf-8')

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 occurrence, found {count}')
              return text.replace(old, new, 1)

          # ProductGrid: canonical taxonomy + controlled catalog state so remounts do not erase filters.
          path = 'src/components/ProductGrid.tsx'
          text = read(path)
          text = replace_once(text, "import React, { useState, useMemo } from 'react';", "import React, { useMemo } from 'react';", 'ProductGrid React import')
          text = replace_once(
              text,
              "import { getProductDisplayCategory, getProductDisplayTitle } from '../lib/productPresentation';\n",
              "import { getProductDisplayCategory, getProductDisplayTitle } from '../lib/productPresentation';\nimport { PUBLIC_PRODUCT_CATEGORIES } from '../lib/productCategory';\nimport type { CatalogViewState } from '../lib/catalogNavigation';\n",
              'ProductGrid canonical imports',
          )
          base_block = """const BASE_CATEGORIES = [
            'Iluminação',
            'Decoração',
            'Móveis',
            'Cozinha & Mesa',
            'Organização',
            'Vestuário',
            'Calçados & Acessórios',
            'Tecnologia',
            'Beleza & Bem-estar',
            'Infantil',
          ] as const;

          """
          text = replace_once(text, base_block, '', 'ProductGrid duplicate taxonomy')
          text = replace_once(
              text,
              "  metaAccessToken?: string;\n}",
              "  metaAccessToken?: string;\n  viewState: CatalogViewState;\n  onViewStateChange: (state: CatalogViewState) => void;\n}",
              'ProductGrid props type',
          )
          text = replace_once(
              text,
              "  metaPixelId,\n  metaAccessToken\n}) => {\n  const [selectedCategory, setSelectedCategory] = useState<string>('Todos');\n  const [searchQuery, setSearchQuery] = useState<string>('');\n  const [isCategoryPanelOpen, setIsCategoryPanelOpen] = useState(false);\n",
              "  metaPixelId,\n  metaAccessToken,\n  viewState,\n  onViewStateChange,\n}) => {\n  const { selectedCategory, searchQuery, isCategoryPanelOpen } = viewState;\n  const setSelectedCategory = (value: string) => onViewStateChange({ ...viewState, selectedCategory: value });\n  const setSearchQuery = (value: string) => onViewStateChange({ ...viewState, searchQuery: value });\n  const setIsCategoryPanelOpen = (next: boolean | ((open: boolean) => boolean)) => {\n    const resolved = typeof next === 'function' ? next(isCategoryPanelOpen) : next;\n    onViewStateChange({ ...viewState, isCategoryPanelOpen: resolved });\n  };\n",
              'ProductGrid controlled state',
          )
          text = replace_once(text, 'return BASE_CATEGORIES.map((name) => ({', 'return [...PUBLIC_PRODUCT_CATEGORIES].map((name) => ({', 'ProductGrid canonical categories')
          text = replace_once(
              text,
              '                  key={category.name}\n                  onClick={() => {',
              '                  key={category.name}\n                  data-testid={`category-option-${category.name}`}\n                  onClick={() => {',
              'ProductGrid category test id',
          )
          text = replace_once(
              text,
              '<div className="grid min-w-0 grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-3 sm:gap-4 lg:gap-5">',
              '<div data-testid="product-grid" className="grid min-w-0 grid-cols-2 items-stretch md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-3 sm:gap-4 lg:gap-5">',
              'ProductGrid stable rows',
          )
          write(path, text)

          # ProductDetail: remove JS gesture capture; browser handles nested horizontal/vertical pan natively.
          path = 'src/components/ProductDetail.tsx'
          text = read(path)
          related_handlers = """  const relatedTouchStart = useRef<{ x: number; y: number; scrollLeft: number } | null>(null);

            const handleRelatedTouchStart = (event: React.TouchEvent<HTMLDivElement>) => {
              const touch = event.touches[0];
              if (!touch || !relatedRailRef.current) return;
              relatedTouchStart.current = {
                x: touch.clientX,
                y: touch.clientY,
                scrollLeft: relatedRailRef.current.scrollLeft,
              };
            };

            const handleRelatedTouchMove = (event: React.TouchEvent<HTMLDivElement>) => {
              const start = relatedTouchStart.current;
              const touch = event.touches[0];
              const rail = relatedRailRef.current;
              if (!start || !touch || !rail) return;

              const deltaX = touch.clientX - start.x;
              const deltaY = touch.clientY - start.y;
              if (Math.abs(deltaX) <= Math.abs(deltaY) || Math.abs(deltaX) < 4) return;

              if (event.cancelable) event.preventDefault();
              rail.scrollLeft = start.scrollLeft - deltaX;
            };

            const clearRelatedTouch = () => {
              relatedTouchStart.current = null;
            };

          """
          text = replace_once(text, related_handlers, '', 'ProductDetail related touch handlers')
          touch_props = """              onTouchStart={handleRelatedTouchStart}
                        onTouchMove={handleRelatedTouchMove}
                        onTouchEnd={clearRelatedTouch}
                        onTouchCancel={clearRelatedTouch}
          """
          text = replace_once(text, touch_props, '', 'ProductDetail related touch props')
          text = replace_once(
              text,
              'className="flex min-w-0 touch-pan-x snap-x snap-mandatory gap-2 overflow-x-auto overscroll-x-contain scroll-smooth pb-2 pr-1 outline-none [-ms-overflow-style:none] [scrollbar-width:none] [&::-webkit-scrollbar]:hidden md:grid md:grid-cols-3 md:gap-3 md:overflow-visible md:pr-0 lg:grid-cols-4"',
              'data-testid="related-products-rail"\n              className="flex min-w-0 touch-auto snap-x snap-proximity gap-2 overflow-x-auto overscroll-x-contain scroll-smooth pb-2 pr-1 outline-none [-ms-overflow-style:none] [scrollbar-width:none] [&::-webkit-scrollbar]:hidden md:grid md:grid-cols-3 md:gap-3 md:overflow-visible md:pr-0 lg:grid-cols-4"',
              'ProductDetail native related rail',
          )
          text = replace_once(
              text,
              'className="w-[calc(100vw-2.75rem)] max-w-[18rem] shrink-0 snap-start sm:w-[76vw] sm:max-w-[17rem] md:w-auto md:max-w-none md:min-w-0"',
              'className="h-full w-[calc(100vw-2.75rem)] max-w-[18rem] shrink-0 snap-start sm:w-[76vw] sm:max-w-[17rem] md:w-auto md:max-w-none md:min-w-0"',
              'ProductDetail related card height',
          )
          text = replace_once(
              text,
              'className="relative w-full h-[32vh] max-h-[260px] sm:h-auto sm:max-h-none sm:aspect-square bg-[#090807] border border-[#3A342E] rounded-none overflow-hidden flex items-center justify-center p-2 sm:p-4 touch-pan-y tech-frame group cursor-pointer"',
              'className="relative w-full aspect-[4/3] max-h-[300px] sm:max-h-none sm:aspect-square bg-[#090807] border border-[#3A342E] rounded-none overflow-hidden flex items-center justify-center p-2 sm:p-4 touch-pan-y tech-frame group cursor-pointer"',
              'ProductDetail stable image ratio',
          )
          write(path, text)

          # App: single deterministic history-based restoration mechanism; preserve catalog context across remounts.
          path = 'src/App.tsx'
          text = read(path)
          text = replace_once(
              text,
              "import { getRelatedProducts } from './lib/relatedProducts';\n",
              "import { getRelatedProducts } from './lib/relatedProducts';\nimport {\n  DEFAULT_CATALOG_VIEW_STATE,\n  createCatalogHistoryState,\n  createProductHistoryState,\n  mergeCerberusHistoryState,\n  readCerberusHistoryEntry,\n  type CatalogViewState,\n} from './lib/catalogNavigation';\n",
              'App navigation imports',
          )
          old_scroll_helpers = """const CATALOG_SCROLL_STORAGE_KEY = 'cerberus_catalog_scroll_v1';

          type CatalogScrollSnapshot = { path: string; y: number };

          function normalizeCatalogScrollY(value: unknown): number {
            if (typeof value !== 'number' || !Number.isFinite(value)) return 0;
            return Math.max(0, Math.round(value));
          }

          function serializeCatalogScroll(y: unknown, path = '/'): string {
            const snapshot: CatalogScrollSnapshot = { path: path || '/', y: normalizeCatalogScrollY(y) };
            return JSON.stringify(snapshot);
          }

          function parseCatalogScroll(value: string | null | undefined, expectedPath = '/'): number | null {
            if (!value) return null;
            try {
              const snapshot = JSON.parse(value) as Partial<CatalogScrollSnapshot>;
              if (snapshot.path && snapshot.path !== (expectedPath || '/')) return null;
              if (typeof snapshot.y !== 'number' || !Number.isFinite(snapshot.y)) return null;
              return normalizeCatalogScrollY(snapshot.y);
            } catch {
              return null;
            }
          }

          """
          text = replace_once(text, old_scroll_helpers, '', 'App legacy scroll helpers')
          text = replace_once(
              text,
              "  const [selectedProduct, setSelectedProduct] = useState<Product | null>(null);\n  const catalogScrollYRef = useRef<number | null>(null);\n  const [showOnlyFavorites, setShowOnlyFavorites] = useState<boolean>(false);\n",
              "  const initialHistoryEntry = typeof window !== 'undefined' ? readCerberusHistoryEntry(window.history.state) : null;\n  const [selectedProduct, setSelectedProduct] = useState<Product | null>(null);\n  const [catalogViewState, setCatalogViewState] = useState<CatalogViewState>(() =>\n    initialHistoryEntry?.view === 'catalog' ? initialHistoryEntry.catalog : { ...DEFAULT_CATALOG_VIEW_STATE },\n  );\n  const [showOnlyFavorites, setShowOnlyFavorites] = useState<boolean>(() =>\n    initialHistoryEntry?.view === 'catalog' ? initialHistoryEntry.showOnlyFavorites : false,\n  );\n  const pendingScrollRestoreRef = useRef<{ path: string; y: number } | null>(null);\n",
              'App catalog state ownership',
          )
          old_restore = """  const restoreCatalogScroll = useCallback(() => {
            if (typeof window === 'undefined') return;
            let target = catalogScrollYRef.current;
            if (target === null) {
              try {
                target = parseCatalogScroll(window.sessionStorage.getItem(CATALOG_SCROLL_STORAGE_KEY), window.location.pathname);
              } catch {
                target = null;
              }
            }
            if (target === null) return;
            catalogScrollYRef.current = target;
            window.requestAnimationFrame(() => {
              window.requestAnimationFrame(() => window.scrollTo({ top: target ?? 0, behavior: 'auto' }));
            });
          }, []);

          """
          text = replace_once(
              text,
              old_restore,
              """  const queueScrollRestore = useCallback((path: string, y: number) => {
            pendingScrollRestoreRef.current = { path, y: Math.max(0, Math.round(y || 0)) };
          }, []);

          """,
              'App restoration queue',
          )
          marker = "  const [socialLinks, setSocialLinks] = useState<PublicSocialLink[]>([]);\n\n"
          effects = """  const [socialLinks, setSocialLinks] = useState<PublicSocialLink[]>([]);

            // One restoration mechanism only: history.state owns per-entry UI context and scroll.
            // Restoration waits for the route's layout to exist, avoiding scroll-to-top races after remount.
            useEffect(() => {
              if (typeof window === 'undefined') return;
              const pending = pendingScrollRestoreRef.current;
              if (!pending || window.location.pathname !== pending.path) return;

              let cancelled = false;
              let frameId = 0;
              let attempts = 0;
              const restore = () => {
                if (cancelled) return;
                const maxY = Math.max(0, document.documentElement.scrollHeight - window.innerHeight);
                if (maxY >= pending.y || attempts >= 12) {
                  window.scrollTo({ top: Math.min(pending.y, maxY), behavior: 'auto' });
                  pendingScrollRestoreRef.current = null;
                  return;
                }
                attempts += 1;
                frameId = window.requestAnimationFrame(restore);
              };
              frameId = window.requestAnimationFrame(restore);
              return () => {
                cancelled = true;
                window.cancelAnimationFrame(frameId);
              };
            }, [currentView, selectedProduct?.id, products.length, catalogViewState.selectedCategory, catalogViewState.searchQuery, showOnlyFavorites]);

            // Catalog filters live outside ProductGrid and are mirrored into the current history entry.
            // This runs only when UI context changes; there is no per-pixel scroll listener.
            useEffect(() => {
              if (typeof window === 'undefined' || currentView !== 'catalog') return;
              const currentEntry = readCerberusHistoryEntry(window.history.state);
              const scrollY = currentEntry?.view === 'catalog' ? currentEntry.scrollY : window.scrollY;
              window.history.replaceState(
                mergeCerberusHistoryState(window.history.state, createCatalogHistoryState(catalogViewState, showOnlyFavorites, scrollY)),
                '',
                window.location.href,
              );
            }, [catalogViewState, showOnlyFavorites, currentView]);

          """
          text = replace_once(text, marker, effects, 'App restoration effects')

          old_found = """          if (found) {
                    setSelectedProduct(found);
                    setCurrentView('product-detail');
                  }
          """
          new_found = """          if (found) {
                    setSelectedProduct(found);
                    setCurrentView('product-detail');
                    const existingEntry = readCerberusHistoryEntry(window.history.state);
                    if (existingEntry?.view !== 'product-detail') {
                      window.history.replaceState(
                        mergeCerberusHistoryState(
                          window.history.state,
                          createProductHistoryState(found.slug || found.id, 0, { canGoBack: false, fromView: 'other' }),
                        ),
                        '',
                        window.location.href,
                      );
                    }
                  }
          """
          text = replace_once(text, old_found, new_found, 'App direct detail history')

          old_select_back = """  // Navigate to Product Detail View and update URL
            const handleSelectProduct = (product: Product) => {
              setSelectedProduct(product);
              setCurrentView('product-detail');
              if (typeof window !== 'undefined') {
                if (currentView === 'catalog') {
                  const currentScrollY = window.scrollY;
                  catalogScrollYRef.current = currentScrollY;
                  try {
                    window.sessionStorage.setItem(CATALOG_SCROLL_STORAGE_KEY, serializeCatalogScroll(currentScrollY, window.location.pathname));
                  } catch {
                    // A restauração baseada em sessionStorage é uma melhoria; a navegação continua funcional sem ela.
                  }
                }
                const slug = product.slug || product.id;
                window.history.pushState({}, '', `/produto/${slug}`);
                window.scrollTo({ top: 0, behavior: 'auto' });
              }
            };

            // Handle Back to Catalog from Detail
            const handleBackToCatalog = () => {
              setCurrentView('catalog');
              setSelectedProduct(null);
              if (typeof window !== 'undefined') {
                window.history.pushState({}, '', '/');
                restoreCatalogScroll();
              }
            };
          """
          new_select_back = """  // Navigate to a product while preserving the current history entry's exact context.
            const handleSelectProduct = (product: Product) => {
              if (typeof window !== 'undefined') {
                if (currentView === 'catalog') {
                  window.history.replaceState(
                    mergeCerberusHistoryState(
                      window.history.state,
                      createCatalogHistoryState(catalogViewState, showOnlyFavorites, window.scrollY),
                    ),
                    '',
                    window.location.href,
                  );
                } else if (currentView === 'product-detail' && selectedProduct) {
                  const currentEntry = readCerberusHistoryEntry(window.history.state);
                  window.history.replaceState(
                    mergeCerberusHistoryState(
                      window.history.state,
                      createProductHistoryState(selectedProduct.slug || selectedProduct.id, window.scrollY, {
                        canGoBack: currentEntry?.view === 'product-detail' ? currentEntry.canGoBack : false,
                        fromView: currentEntry?.view === 'product-detail' ? currentEntry.fromView : 'other',
                      }),
                    ),
                    '',
                    window.location.href,
                  );
                }

                const slug = product.slug || product.id;
                const fromView = currentView === 'catalog' ? 'catalog' : currentView === 'product-detail' ? 'product-detail' : 'other';
                window.history.pushState(
                  mergeCerberusHistoryState(
                    {},
                    createProductHistoryState(slug, 0, { canGoBack: true, fromView }),
                  ),
                  '',
                  `/produto/${slug}`,
                );
                window.scrollTo({ top: 0, behavior: 'auto' });
              }
              setSelectedProduct(product);
              setCurrentView('product-detail');
            };

            // Internal Back follows the same history entry as the browser Back button.
            const handleBackToCatalog = () => {
              if (typeof window !== 'undefined') {
                const currentEntry = readCerberusHistoryEntry(window.history.state);
                if (currentEntry?.view === 'product-detail' && currentEntry.canGoBack) {
                  window.history.back();
                  return;
                }
                window.history.replaceState(
                  mergeCerberusHistoryState(window.history.state, createCatalogHistoryState(catalogViewState, showOnlyFavorites, 0)),
                  '',
                  '/',
                );
                queueScrollRestore('/', 0);
              }
              setCurrentView('catalog');
              setSelectedProduct(null);
            };
          """
          text = replace_once(text, old_select_back, new_select_back, 'App select/back navigation')

          old_select_view = """  const handleSelectView = (view: ViewMode) => {
            if (view !== 'product-detail') {
              setSelectedProduct(null);
              if (typeof window !== 'undefined') {
                const path = view === 'admin'
                  ? '/admin'
                  : view === 'privacy'
                    ? INSTITUTIONAL_PATHS.privacy
                    : view === 'terms'
                      ? INSTITUTIONAL_PATHS.terms
                      : '/';
                window.history.pushState({}, '', path);
              }
            }
            setCurrentView(view);
            if (view === 'catalog') restoreCatalogScroll();
          };
          """
          new_select_view = """  const handleSelectView = (view: ViewMode) => {
            if (view !== 'product-detail') {
              setSelectedProduct(null);
              if (typeof window !== 'undefined') {
                const path = view === 'admin'
                  ? '/admin'
                  : view === 'privacy'
                    ? INSTITUTIONAL_PATHS.privacy
                    : view === 'terms'
                      ? INSTITUTIONAL_PATHS.terms
                      : '/';

                if (view === 'catalog') {
                  const nextState = mergeCerberusHistoryState(
                    {},
                    createCatalogHistoryState(catalogViewState, showOnlyFavorites, 0),
                  );
                  if (currentView === 'catalog' && window.location.pathname === '/') {
                    window.history.replaceState(nextState, '', path);
                  } else {
                    window.history.pushState(nextState, '', path);
                  }
                  queueScrollRestore('/', 0);
                } else {
                  window.history.pushState({}, '', path);
                  window.scrollTo({ top: 0, behavior: 'auto' });
                }
              }
            }
            setCurrentView(view);
          };
          """
          text = replace_once(text, old_select_view, new_select_view, 'App view navigation')

          pop_pattern = re.compile(r"  // Listen to popstate browser navigation \(Back/Forward\)\n  useEffect\(\(\) => \{.*?\n  \}, \[products\]\);", re.S)
          pop_replacement = """  // Back/Forward restores the exact history entry instead of applying a global catalog scroll snapshot.
            useEffect(() => {
              const handlePopState = (event: PopStateEvent) => {
                const path = window.location.pathname;
                const historyEntry = readCerberusHistoryEntry(event.state);

                if (path === INSTITUTIONAL_PATHS.privacy) {
                  setCurrentView('privacy');
                  setSelectedProduct(null);
                  return;
                }
                if (path === INSTITUTIONAL_PATHS.terms) {
                  setCurrentView('terms');
                  setSelectedProduct(null);
                  return;
                }
                if (path.startsWith('/admin')) {
                  setCurrentView('admin');
                  setSelectedProduct(null);
                  return;
                }
                if (path.startsWith('/produto/')) {
                  const requestedSlugOrId = path.replace('/produto/', '').trim();
                  const found = products.find((product) => product.slug === requestedSlugOrId || product.id === requestedSlugOrId);
                  if (found) {
                    setSelectedProduct(found);
                    setCurrentView('product-detail');
                    queueScrollRestore(path, historyEntry?.view === 'product-detail' ? historyEntry.scrollY : 0);
                  }
                  return;
                }

                const params = new URLSearchParams(window.location.search);
                const viewParam = params.get('view') || params.get('mode');
                if (viewParam === 'admin' || viewParam === 'form') {
                  setCurrentView('admin');
                  setSelectedProduct(null);
                  return;
                }

                if (historyEntry?.view === 'catalog') {
                  setCatalogViewState(historyEntry.catalog);
                  setShowOnlyFavorites(historyEntry.showOnlyFavorites);
                  queueScrollRestore('/', historyEntry.scrollY);
                } else {
                  setCatalogViewState({ ...DEFAULT_CATALOG_VIEW_STATE });
                  setShowOnlyFavorites(false);
                  queueScrollRestore('/', 0);
                }
                setCurrentView('catalog');
                setSelectedProduct(null);
              };

              window.addEventListener('popstate', handlePopState);
              return () => window.removeEventListener('popstate', handlePopState);
            }, [products, queueScrollRestore]);"""
          text, count = pop_pattern.subn(pop_replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'App popstate block: expected 1, found {count}')

          text = replace_once(
              text,
              "            metaAccessToken={config.metaAccessToken}\n          />",
              "            metaAccessToken={config.metaAccessToken}\n            viewState={catalogViewState}\n            onViewStateChange={setCatalogViewState}\n          />",
              'App ProductGrid controlled props',
          )
          write(path, text)

          # Source-level regression test: assert browser-native related scrolling, not JS gesture capture.
          path = 'tests/relatedProductsCarousel.test.ts'
          text = read(path)
          text = text.replace("    assert.match(productDetailSource, /touch-pan-x/);", "    assert.match(productDetailSource, /touch-auto/);")
          for old in [
              "    assert.match(productDetailSource, /onTouchStart=\\{handleRelatedTouchStart\\}/);\n",
              "    assert.match(productDetailSource, /onTouchMove=\\{handleRelatedTouchMove\\}/);\n",
              "    assert.match(productDetailSource, /rail\\.scrollLeft = start\\.scrollLeft - deltaX/);\n",
          ]:
              if old not in text:
                  raise SystemExit(f'relatedProductsCarousel missing old assertion: {old.strip()}')
              text = text.replace(old, '')
          insert_after = "    assert.match(productDetailSource, /tabIndex=\\{0\\}/);\n"
          addition = "    assert.doesNotMatch(productDetailSource, /handleRelatedTouchMove/);\n    assert.doesNotMatch(productDetailSource, /preventDefault\\(\\)/);\n"
          text = replace_once(text, insert_after, insert_after + addition, 'relatedProductsCarousel native assertions')
          write(path, text)
          PY

      - name: Install dependencies
        run: npm ci

      - name: Validate TypeScript and related contract
        run: |
          npm run lint
          node --import tsx/esm --test --test-concurrency=1 --test-reporter=spec tests/relatedProductsCarousel.test.ts

      - name: Commit structural changes and remove patch workflow
        run: |
          git rm .github/workflows/apply-mobile-catalog-structural-fix.yml
          git config user.name "kauabrennan5-bit"
          git config user.email "kauabrennan5@gmail.com"
          git add src/App.tsx src/components/ProductGrid.tsx src/components/ProductDetail.tsx tests/relatedProductsCarousel.test.ts
          git diff --cached --check
          git commit -m "fix(mobile): restore catalog context and native related scrolling"
          git push origin HEAD:fix/mobile-catalog-categories-2026-08-28
