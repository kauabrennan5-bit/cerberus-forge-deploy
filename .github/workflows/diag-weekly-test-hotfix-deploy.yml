name: Telegram Weekly Test Hotfix Deploy Check
on:
  push:
    branches: [diag/weekly-test-hotfix-deploy-2026-08-29]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      EXPECTED_SHA: ae7f882dfcb05a3e3f6dba117560f669399cc7b2
      HEALTH_URL: https://cerberus-forge-deploy-backend.onrender.com/health
    steps:
      - name: Verify live deploy SHA
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 36); do
            body="$(curl --fail-with-body --silent --show-error --max-time 15 "$HEALTH_URL" || true)"
            status="$(printf '%s' "$body" | jq -r '.status // empty' 2>/dev/null || true)"
            version="$(printf '%s' "$body" | jq -r '.version // empty' 2>/dev/null || true)"
            if [ "$status" = "ok" ] && [ "$version" = "$EXPECTED_SHA" ]; then
              echo "HEALTH_STATUS=PASS"
              echo "LIVE_VERSION_SHA=$version"
              exit 0
            fi
            sleep 10
          done
          echo "HEALTH_STATUS=FAIL"
          echo "LIVE_VERSION_SHA=${version:-UNKNOWN}"
          exit 1
