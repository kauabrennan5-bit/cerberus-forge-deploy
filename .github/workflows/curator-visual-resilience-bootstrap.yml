name: Curator Visual Resilience Bootstrap

on:
  push:
    branches:
      - fix/curator-visual-review-resilience-2026-08-30

permissions:
  contents: write

concurrency:
  group: curator-visual-resilience-bootstrap
  cancel-in-progress: true

jobs:
  patch-test-commit:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      TELEGRAM_ALLOWED_USER_IDS: "1976526372"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/curator-visual-review-resilience-2026-08-30
          fetch-depth: 2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply resilience patch
        run: |
          python3 scripts/curator-visual-resilience-patch.py
          python3 scripts/curator-query-budget-fixup.py

      - name: Install dependencies
        run: npm ci

      - name: Focused curator and image tests
        id: focused
        shell: bash
        run: |
          set +e
          node --import tsx/esm --test --test-concurrency=1 \
            tests/autonomousCurator.test.ts \
            tests/productImageReview.test.ts \
            tests/productImageRepair.test.ts \
            tests/productCanonical.test.ts > focused-tests.log 2>&1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          tail -n 250 focused-tests.log
          exit 0

      - name: Upload focused test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: curator-visual-focused-log
          path: focused-tests.log
          if-no-files-found: error
          retention-days: 1

      - name: Enforce focused tests
        if: steps.focused.outputs.exit_code != '0'
        run: exit 1

      - name: TypeScript
        run: npm run lint

      - name: Global tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Diff check
        run: git diff --check

      - name: Commit validated implementation and remove bootstrap
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/curator-visual-resilience-bootstrap.yml scripts/curator-visual-resilience-patch.py scripts/curator-query-budget-fixup.py
          git add -A
          git commit -m "fix: make curator visual review resilient and bounded"
          git push origin HEAD:fix/curator-visual-review-resilience-2026-08-30
