name: Curator Visual Resilience Bootstrap

on:
  push:
    branches:
      - fix/curator-visual-review-resilience-2026-08-30
    paths:
      - ".github/workflows/curator-visual-resilience-bootstrap.yml"
      - "scripts/curator-visual-resilience-patch.py"
      - "scripts/curator-query-budget-fixup.py"

permissions:
  contents: write

concurrency:
  group: curator-visual-resilience-bootstrap
  cancel-in-progress: true

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/curator-visual-review-resilience-2026-08-30
          fetch-depth: 2

      - name: Apply already-validated patch
        run: |
          python3 scripts/curator-visual-resilience-patch.py
          python3 scripts/curator-query-budget-fixup.py
          git diff --check

      - name: Commit application code
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/services/productImageReview.ts server/services/productAutomation.ts server/services/productImageRepair.ts server/services/autonomousCurator.ts src/lib/productImageCuration.ts tests/productImageReview.test.ts
          git commit -m "fix: make curator visual review resilient and bounded"
          git push origin HEAD:fix/curator-visual-review-resilience-2026-08-30
