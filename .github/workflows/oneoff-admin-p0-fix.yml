name: One-off Admin P0 fix

on:
  push:
    branches: [fix/security-p0-2026-08-28]
    paths:
      - PATCH_ADMIN_P0_FIX

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/security-p0-2026-08-28
          fetch-depth: 0

      - name: Patch AdminForm
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/components/AdminForm.tsx')
          s = p.read_text()

          replacements = [
            ("import React, { useState, useRef, useEffect } from 'react';", "import React, { useState, useRef } from 'react';", 1),
            ("  config,\n  products,", "  products,", 1),
            ("  const [submitSuccess, setSubmitSuccess] = useState<boolean>(false);\n  const [submitError, setSubmitError] = useState<string | null>(null);", "  const [submitSuccess, setSubmitSuccess] = useState<boolean>(false);\n  const [submitPending, setSubmitPending] = useState<string | null>(null);\n  const [submitError, setSubmitError] = useState<string | null>(null);", 1),
            ("  // Verify saved password on mount\n  useEffect(() => {\n    const storedPass = typeof window !== 'undefined' ? localStorage.getItem('cerberus_admin_password') : null;\n    const passToCheck = storedPass || config.adminPassword;\n\n    if (passToCheck) {\n      verifyAdminPassword(passToCheck).then((res) => {\n        if (res.success) {\n          setPasswordInput(passToCheck);\n          setIsAuthenticated(true);\n        } else {\n          if (typeof window !== 'undefined') {\n            localStorage.removeItem('cerberus_admin_password');\n          }\n          setIsAuthenticated(false);\n          setPasswordInput('');\n        }\n      });\n    }\n  }, [config.adminPassword]);\n\n", "", 1),
            ("    if (typeof window !== 'undefined') {\n      localStorage.removeItem('cerberus_admin_password');\n    }\n", "", 1),
            ("      if (typeof window !== 'undefined') {\n        localStorage.setItem('cerberus_admin_password', typedPass);\n      }\n", "", 1),
            ("      if (typeof window !== 'undefined') {\n        localStorage.removeItem('cerberus_admin_password');\n      }\n", "", 1),
            ("      const adminPass = passwordInput || (typeof window !== 'undefined' ? localStorage.getItem('cerberus_admin_password') || '' : '') || config.adminPassword;", "      const adminPass = passwordInput;", 3),
            ("    setSubmitError(null);\n    setSubmitSuccess(false);", "    setSubmitError(null);\n    setSubmitPending(null);\n    setSubmitSuccess(false);", 1),
            ("        senha: adminPass,\n        produto: produto.trim(),", "        produto: produto.trim(),", 1),
            ("      if (resJson.success) {\n        setSubmitSuccess(true);", "      if (resJson.pending) {\n        setSubmitError(null);\n        setSubmitPending(resJson.message || resJson.error || 'Produto enviado para revisão e aguardando aprovação humana no Telegram.');\n      } else if (resJson.success) {\n        setSubmitSuccess(true);", 1),
            ("        {/* Global Submit Error Banner */}\n        {submitError && (", "        {/* Pending approval is an expected workflow state, not a backend error. */}\n        {submitPending && (\n          <div role=\"status\" className=\"bg-[#181512] border border-[#8A1F1F] rounded-none p-4 text-xs text-[#E8E1D3] flex items-start space-x-2\">\n            <ShieldCheck className=\"w-4 h-4 text-[#8A1F1F] shrink-0 mt-0.5\" />\n            <div>\n              <p className=\"font-bold uppercase tracking-wider\">Aguardando aprovação humana</p>\n              <p className=\"leading-relaxed mt-1\">{submitPending}</p>\n            </div>\n          </div>\n        )}\n\n        {/* Global Submit Error Banner */}\n        {submitError && (", 1),
            ("                <span>Salvando no banco de dados...</span>", "                <span>Enviando para revisão...</span>", 1),
            ("                  <span>Publicar no Banco do Acervo</span>", "                  <span>Enviar para Revisão</span>", 1),
            ("        adminPassword={config.adminPassword}", "        adminPassword={passwordInput}", 1),
          ]

          for old, new, expected in replacements:
            count = s.count(old)
            if count != expected:
              raise SystemExit(f'Expected {expected} matches, got {count}: {old[:120]!r}')
            s = s.replace(old, new)

          if 'localStorage' in s:
            raise SystemExit('AdminForm still references localStorage after patch')
          if 'config.adminPassword' in s:
            raise SystemExit('AdminForm still references config.adminPassword after patch')

          p.write_text(s)
          PY

      - name: Commit patch
        run: |
          rm -f PATCH_ADMIN_P0_FIX
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/AdminForm.tsx PATCH_ADMIN_P0_FIX
          git commit -m "fix(admin): keep password ephemeral and reflect pending approval"
          git push origin HEAD:fix/security-p0-2026-08-28
