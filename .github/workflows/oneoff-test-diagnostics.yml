name: One-off test diagnostics

on:
  push:
    branches: [fix/security-p0-2026-08-28]
    paths:
      - RUN_TEST_DIAGNOSTICS

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run test files individually
        shell: bash
        run: |
          mkdir -p test-diagnostics
          : > test-diagnostics/failures.txt
          for f in tests/*.test.ts; do
            safe="$(basename "$f")"
            echo "=== $f ===" > "test-diagnostics/$safe.log"
            if ! node --import tsx/esm --test --test-concurrency=1 --test-reporter=spec "$f" >> "test-diagnostics/$safe.log" 2>&1; then
              echo "$f" | tee -a test-diagnostics/failures.txt
            fi
          done
          if [ -s test-diagnostics/failures.txt ]; then
            echo "Failing tests:"
            cat test-diagnostics/failures.txt
            exit 1
          fi
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-diagnostics
          path: test-diagnostics
          retention-days: 1
