name: Temporary Curator Push Contract Correction

on:
  push:
    branches:
      - fix/curator-push-continuous-refill-2026-08-31

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/curator-push-continuous-refill-2026-08-31
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Preserve explicit schedule and push contracts
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          workflow_path = Path('.github/workflows/autonomous-curator.yml')
          workflow = workflow_path.read_text()
          old = "MODE: ${{ (github.event_name == 'schedule' || github.event_name == 'push') && 'continuous' || inputs.mode }}"
          new = "MODE: ${{ github.event_name == 'schedule' && 'continuous' || github.event_name == 'push' && 'continuous' || inputs.mode }}"
          assert workflow.count(old) == 1
          workflow_path.write_text(workflow.replace(old, new))

          test_path = Path('tests/autonomousCuratorContinuous.test.ts')
          tests = test_path.read_text()
          old_test = "assert.match(workflow, /github\\.event_name == 'schedule' \\|\\| github\\.event_name == 'push'/);"
          new_test = "assert.match(workflow, /github\\.event_name == 'push' && 'continuous'/);"
          assert tests.count(old_test) == 1
          test_path.write_text(tests.replace(old_test, new_test))

          Path('.github/workflows/_tmp-fix-curator-push-contract.yml').unlink()
          PY
      - name: Focused curator tests
        env:
          TELEGRAM_ALLOWED_USER_IDS: '1976526372'
        run: |
          npm ci
          node --import tsx/esm --test --test-concurrency=1 tests/autonomousCuratorContinuous.test.ts tests/autonomousCuratorDaily10Recovery.test.ts
          npx tsc --noEmit
          git diff --check
      - name: Commit correction
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/autonomous-curator.yml tests/autonomousCuratorContinuous.test.ts .github/workflows/_tmp-fix-curator-push-contract.yml
          git commit -m "fix: preserve explicit curator production contracts"
          git push origin HEAD:fix/curator-push-continuous-refill-2026-08-31
