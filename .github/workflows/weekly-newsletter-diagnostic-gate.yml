name: Weekly newsletter diagnostic gate

on:
  push:
    branches:
      - diag/weekly-newsletter-ts-2026-08-28
    paths:
      - .github/workflows/weekly-newsletter-diagnostic-gate.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      TELEGRAM_ALLOWED_USER_IDS: "1976526372"
      FEATURE_BASE_SHA: "defa6fe6bbda8eff5e7c8e80b2241a29011ace8c"
    steps:
      - name: Checkout diagnostic branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Materialize exact weekly candidate
        run: python .github/scripts/materialize_weekly_newsletter.py

      - name: Apply complete materializer patch
        shell: bash
        run: |
          set -euo pipefail
          python .github/scripts/diag_weekly_candidate_patch.py

      - name: Remove diagnostic and materializer files from final candidate
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            .github/scripts/diag_weekly_candidate_patch.py \
            .github/scripts/materialize_weekly_newsletter.py \
            .github/workflows/weekly-newsletter-materialize.yml \
            .github/workflows/weekly-newsletter-diagnostic-gate.yml

      - name: Capture complete candidate relative to feature base
        id: candidate
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "${FEATURE_BASE_SHA}^{commit}"
          git add -A
          final_tree="$(git write-tree)"
          echo "FINAL_TREE=${final_tree}" > weekly-functional-tree.txt
          git diff --no-ext-diff --binary "${FEATURE_BASE_SHA}" "${final_tree}" > weekly-functional.patch
          git diff --name-status "${FEATURE_BASE_SHA}" "${final_tree}" > weekly-functional-files.txt
          test -s weekly-functional.patch
          test -s weekly-functional-files.txt
          sha256sum weekly-functional.patch | awk '{print "PATCH_SHA256=" $1}' > weekly-functional-fingerprint.txt
          echo "FINAL_TREE=${final_tree}" >> weekly-functional-fingerprint.txt
          git diff --check "${FEATURE_BASE_SHA}" "${final_tree}"
          echo "final_tree=${final_tree}" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: npm ci

      - name: Publish command isolated
        run: node --import tsx/esm --test --test-concurrency=1 tests/publishCommand.test.ts

      - name: Publish and Telegram contract group
        run: node --import tsx/esm --test --test-concurrency=1 tests/publishCommand.test.ts tests/telegramBotV2Contract.test.ts

      - name: Weekly focused tests with numeric summary
        shell: bash
        run: |
          set -uo pipefail
          set +e
          node --import tsx/esm --test --test-concurrency=1 \
            tests/newsletterWeeklyCampaign.test.ts tests/newsletterCampaign.test.ts \
            > "$RUNNER_TEMP/weekly-focused.raw" 2>&1
          test_status=$?
          set -e
          python - "$RUNNER_TEMP/weekly-focused.raw" weekly-focused-summary.txt <<'PY'
          from pathlib import Path
          import re, sys
          source, output = sys.argv[1:]
          text = Path(source).read_text(encoding="utf-8", errors="replace")
          keys = {
              "FOCUSED_TOTAL": r"(?m)^[#ℹ]\s+tests\s+(\d+)\s*$",
              "FOCUSED_PASS": r"(?m)^[#ℹ]\s+pass\s+(\d+)\s*$",
              "FOCUSED_FAILURES": r"(?m)^[#ℹ]\s+fail\s+(\d+)\s*$",
              "FOCUSED_SKIPPED": r"(?m)^[#ℹ]\s+skipped\s+(\d+)\s*$",
              "FOCUSED_CANCELLED": r"(?m)^[#ℹ]\s+cancelled\s+(\d+)\s*$",
          }
          values = {}
          for key, pattern in keys.items():
              matches = re.findall(pattern, text)
              if not matches:
                  raise SystemExit(f"unparseable focused summary: {key}")
              values[key] = int(matches[-1])
          Path(output).write_text("\n".join(f"{k}={v}" for k, v in values.items()) + "\n", encoding="utf-8")
          print(Path(output).read_text(encoding="utf-8"), end="")
          if values["FOCUSED_TOTAL"] <= 0 or values["FOCUSED_PASS"] != values["FOCUSED_TOTAL"] or values["FOCUSED_FAILURES"] or values["FOCUSED_SKIPPED"] or values["FOCUSED_CANCELLED"]:
              raise SystemExit(98)
          PY
          exit "$test_status"

      - name: Full global suite with numeric summary
        shell: bash
        run: |
          set -uo pipefail
          set +e
          npm test > "$RUNNER_TEMP/weekly-global.raw" 2>&1
          test_status=$?
          set -e
          python - "$RUNNER_TEMP/weekly-global.raw" weekly-global-summary.txt <<'PY'
          from pathlib import Path
          import re, sys
          source, output = sys.argv[1:]
          text = Path(source).read_text(encoding="utf-8", errors="replace")
          keys = {
              "GLOBAL_TOTAL": r"(?m)^[#ℹ]\s+tests\s+(\d+)\s*$",
              "GLOBAL_PASS": r"(?m)^[#ℹ]\s+pass\s+(\d+)\s*$",
              "GLOBAL_FAILURES": r"(?m)^[#ℹ]\s+fail\s+(\d+)\s*$",
              "GLOBAL_SKIPPED": r"(?m)^[#ℹ]\s+skipped\s+(\d+)\s*$",
              "GLOBAL_CANCELLED": r"(?m)^[#ℹ]\s+cancelled\s+(\d+)\s*$",
          }
          values = {}
          for key, pattern in keys.items():
              matches = re.findall(pattern, text)
              if not matches:
                  raise SystemExit(f"unparseable global summary: {key}")
              values[key] = int(matches[-1])
          Path(output).write_text("\n".join(f"{k}={v}" for k, v in values.items()) + "\n", encoding="utf-8")
          print(Path(output).read_text(encoding="utf-8"), end="")
          if values["GLOBAL_TOTAL"] < 1722 or values["GLOBAL_PASS"] != values["GLOBAL_TOTAL"] or values["GLOBAL_FAILURES"] or values["GLOBAL_SKIPPED"] or values["GLOBAL_CANCELLED"]:
              raise SystemExit(99)
          PY
          exit "$test_status"

      - name: TypeScript
        shell: bash
        run: |
          set -uo pipefail
          set +e
          npm run lint -- --pretty false 2>&1 | tee weekly-typescript.log
          status=${PIPESTATUS[0]}
          set -e
          python - "$status" <<'PY'
          from pathlib import Path
          import re, sys
          status = int(sys.argv[1])
          text = Path("weekly-typescript.log").read_text(encoding="utf-8", errors="replace")
          count = len(re.findall(r"\berror TS\d+:", text))
          Path("weekly-typescript-summary.txt").write_text(f"TS_EXIT_CODE={status}\nTS_ERROR_COUNT={count}\n", encoding="utf-8")
          PY
          exit "$status"

      - name: Build
        run: npm run build

      - name: Diff check
        shell: bash
        run: |
          set -euo pipefail
          final_tree="$(sed -n 's/^FINAL_TREE=//p' weekly-functional-tree.txt)"
          test -n "$final_tree"
          git diff --check "${FEATURE_BASE_SHA}" "$final_tree"

      - name: Secret scan functional candidate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/gitleaks-scan
          cp weekly-functional.patch /tmp/gitleaks-scan/weekly-functional.patch
          curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks detect --no-git --source /tmp/gitleaks-scan --redact --exit-code 1

      - name: Upload validated functional candidate
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: weekly-functional-candidate-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 7
          path: |
            weekly-functional.patch
            weekly-functional-files.txt
            weekly-functional-fingerprint.txt
            weekly-functional-tree.txt

      - name: Upload diagnostic summaries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weekly-diagnostic-summaries-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 7
          path: |
            weekly-focused-summary.txt
            weekly-global-summary.txt
            weekly-typescript-summary.txt
            weekly-typescript.log
