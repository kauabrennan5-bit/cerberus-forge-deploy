name: Weekly Production Audience Gate

on:
  push:
    branches:
      - feat/weekly-production-audience-sync-2026-08-29

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      TELEGRAM_ALLOWED_USER_IDS: "1976526372,888111222,999000111"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Directed weekly production tests
        run: |
          node --import tsx/esm --test --test-concurrency=1 \
            tests/newsletterWeeklyBrevoAudienceSync.test.ts \
            tests/newsletterWeeklyProductionAudienceGate.test.ts \
            tests/newsletterWeeklyBrevoProvider.test.ts \
            tests/newsletterWeeklyRuntimePreflight.test.ts \
            tests/newsletterWeeklyCampaign.test.ts \
            tests/newsletterWeeklySendTestRecovery.test.ts \
            tests/newsletterWeeklyRetryRecipientSelfHeal.test.ts
      - name: TypeScript
        run: npm run lint
      - name: Full global suite
        run: npm test
      - name: Production build
        run: npm run build
      - name: Diff check
        run: |
          git fetch origin main
          git diff --check origin/main...HEAD
      - name: Secret scan changed content
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/gitleaks-scan
          git diff --no-ext-diff origin/main...HEAD > /tmp/gitleaks-scan/weekly-production.patch
          curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks detect --no-git --source /tmp/gitleaks-scan --redact --exit-code 1
