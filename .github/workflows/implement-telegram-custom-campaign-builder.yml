name: Implement Telegram Custom Campaign Builder

on:
  push:
    branches:
      - feat/telegram-custom-campaign-builder

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/telegram-custom-campaign-builder
          fetch-depth: 2

      - name: Patch campaign builder
        run: python .github/scripts/implement_telegram_custom_campaign_builder.py

      - name: Install dependencies
        run: npm ci

      - name: Focused campaign tests
        run: node --import tsx/esm --test --test-concurrency=1 tests/newsletterCampaign.test.ts

      - name: TypeScript
        run: npm run lint

      - name: Migration contract
        run: node scripts/validate-supabase-migrations.mjs

      - name: Persist implementation
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/implement-telegram-custom-campaign-builder.yml
          git rm .github/scripts/implement_telegram_custom_campaign_builder.py
          git add \
            server/repositories/telegramRepository.ts \
            server/services/newsletterCampaignCollection.ts \
            server/services/newsletterCampaignService.ts \
            server/services/newsletterCampaignTelegram.ts \
            scripts/validate-supabase-migrations.mjs \
            supabase/migrations/20260905_telegram_campaign_builder_state.sql \
            tests/newsletterCampaign.test.ts
          git diff --cached --check
          git commit -m "feat: add Telegram custom campaign builder"
          git push origin HEAD:feat/telegram-custom-campaign-builder
