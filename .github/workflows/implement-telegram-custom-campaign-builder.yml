name: Implement Telegram Custom Campaign Builder

on:
  push:
    branches:
      - feat/telegram-custom-campaign-builder

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/telegram-custom-campaign-builder
          fetch-depth: 2

      - name: Patch campaign builder
        shell: bash
        run: |
          set -euxo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected 1 anchor, found {count}: {old[:120]!r}')
              p.write_text(text.replace(old, new, 1))

          # 1) Persist rich Telegram user state (builder catalog, selected IDs and page).
          repo = Path('server/repositories/telegramRepository.ts')
          text = repo.read_text()
          old = '''export interface UserState {\n  senderId: string;\n  action: string;\n  reviewId?: string;\n  productId?: string;\n  updatedAt: number;\n}\n'''
          new = '''export type UserStateInput = {\n  action: string;\n  reviewId?: string;\n  productId?: string;\n  data?: Record<string, unknown>;\n};\n\nexport interface UserState extends UserStateInput {\n  senderId: string;\n  updatedAt: number;\n}\n'''
          if text.count(old) != 1:
              raise SystemExit('telegramRepository UserState anchor mismatch')
          text = text.replace(old, new, 1)
          text = text.replace('let testOverrideSetUserState: ((senderId: string | number, state: { action: string; reviewId?: string; productId?: string }) => Promise<void>) | null = null;', 'let testOverrideSetUserState: ((senderId: string | number, state: UserStateInput) => Promise<void>) | null = null;')
          text = text.replace('let testOverrideGetUserState: ((senderId: string | number) => Promise<{ action: string; reviewId?: string; productId?: string } | null>) | null = null;', 'let testOverrideGetUserState: ((senderId: string | number) => Promise<UserStateInput | null>) | null = null;')
          text = text.replace('  set?: ((senderId: string | number, state: { action: string; reviewId?: string; productId?: string }) => Promise<void>) | null;\n  get?: ((senderId: string | number) => Promise<{ action: string; reviewId?: string; productId?: string } | null>) | null;', '  set?: ((senderId: string | number, state: UserStateInput) => Promise<void>) | null;\n  get?: ((senderId: string | number) => Promise<UserStateInput | null>) | null;')
          text = text.replace('  state: { action: string; reviewId?: string; productId?: string },', '  state: UserStateInput,')
          text = text.replace('    productId: state.productId,\n    updatedAt: Date.now(),', '    productId: state.productId,\n    data: state.data,\n    updatedAt: Date.now(),')
          text = text.replace('        product_id: state.productId,\n        updated_at: userStateObj.updatedAt,', '        product_id: state.productId,\n        data: state.data || {},\n        updated_at: userStateObj.updatedAt,')
          text = text.replace('): Promise<{ action: string; reviewId?: string; productId?: string } | null> {', '): Promise<UserStateInput | null> {')
          text = text.replace('          productId: data.product_id,\n          updatedAt: data.updated_at || Date.now(),', '          productId: data.product_id,\n          data: data.data && typeof data.data === "object" && !Array.isArray(data.data) ? data.data : {},\n          updatedAt: Number(data.updated_at) || Date.now(),')
          text = text.replace('  return { action: stateObj.action, reviewId: stateObj.reviewId, productId: stateObj.productId };', '  return { action: stateObj.action, reviewId: stateObj.reviewId, productId: stateObj.productId, data: stateObj.data };')
          repo.write_text(text)

          # 2) Exact manual selection helper: preserves user order and validates each selected product.
          collection = Path('server/services/newsletterCampaignCollection.ts')
          text = collection.read_text()
          text = text.replace('export const MAX_NEWSLETTER_COLLECTION_SIZE = 15;\n', 'export const MAX_NEWSLETTER_COLLECTION_SIZE = 15;\nexport const MAX_CUSTOM_CAMPAIGN_PRODUCTS = 10;\n', 1)
          anchor = '''export function getStartOfNewsletterCollectionWindow(now = new Date()): Date {\n'''
          helper = '''export async function selectNewsletterProductsByIds(\n  products: readonly Product[],\n  productIds: readonly string[],\n  options: Pick<NewsletterCollectionSelectionOptions, "verifyImageAccessibility" | "imageProbe"> = {},\n): Promise<NewsletterCollectionSelection> {\n  const normalizedIds = productIds\n    .map(value => String(value || "").trim())\n    .filter(Boolean)\n    .filter((value, index, list) => list.indexOf(value) === index);\n  if (normalizedIds.length === 0) throw new Error("CAMPAIGN_CUSTOM_SELECTION_REQUIRED");\n  if (normalizedIds.length > MAX_CUSTOM_CAMPAIGN_PRODUCTS) throw new Error("CAMPAIGN_CUSTOM_SELECTION_LIMIT");\n\n  const byId = new Map(products\n    .filter(product => typeof product.id === "string" && product.id.trim())\n    .map(product => [product.id.trim(), product] as const));\n  const selected: Product[] = [];\n  const skipped: NewsletterCollectionSkippedProduct[] = [];\n\n  for (const productId of normalizedIds) {\n    const product = byId.get(productId);\n    if (!product) {\n      skipped.push({ productId, reason: "PRODUCT_NOT_FOUND" });\n      continue;\n    }\n    if (product.ativo !== true || !isApprovedOrPublished(product.status)) {\n      skipped.push({ productId, reason: "PRODUCT_NOT_AVAILABLE" });\n      continue;\n    }\n    const readiness = await assessProductReadiness(product, {\n      channel: "campaign",\n      verifyImageAccessibility: options.verifyImageAccessibility !== false,\n      imageProbe: options.imageProbe,\n    });\n    if (!readiness.ready) {\n      skipped.push({ productId, reason: readiness.errors.join(",") || "CAMPAIGN_PRODUCT_NOT_READY" });\n      continue;\n    }\n    selected.push(product);\n  }\n\n  if (skipped.length > 0 || selected.length !== normalizedIds.length) {\n    const first = skipped[0] || { productId: "unknown", reason: "CAMPAIGN_PRODUCT_NOT_READY" };\n    throw new Error(`CAMPAIGN_CUSTOM_PRODUCT_NOT_READY:${first.productId}:${first.reason}`);\n  }\n\n  return {\n    products: selected,\n    requestedSize: normalizedIds.length,\n    since: null,\n    until: null,\n    skipped: [],\n  };\n}\n\n'''
          if text.count(anchor) != 1:
              raise SystemExit('collection helper insertion anchor mismatch')
          text = text.replace(anchor, helper + anchor, 1)
          collection.write_text(text)

          # 3) Create a real manual collection campaign using the existing approval/test/send pipeline.
          service = Path('server/services/newsletterCampaignService.ts')
          text = service.read_text()
          text = text.replace('  getStartOfNewsletterCollectionWindow,\n  selectNewestNewsletterProducts,\n', '  getStartOfNewsletterCollectionWindow,\n  selectNewestNewsletterProducts,\n  selectNewsletterProductsByIds,\n', 1)
          anchor = '''export function buildNewsletterCollectionEditionKey(products: readonly Product[], editionWindowStart: Date): string {\n'''
          custom = '''export async function createCustomCollectionCampaign(\n  productIds: readonly string[],\n  actorTelegramId: string,\n  options: CampaignServiceOptions = {},\n): Promise<EmailCampaign> {\n  const env = options.env || process.env;\n  const now = options.now || new Date();\n  const campaignId = crypto.randomUUID();\n  const products = await (options.productsLoader || productsRepository.getProducts)();\n  const selection = await selectNewsletterProductsByIds(products, productIds, {\n    verifyImageAccessibility: options.verifyImageAccessibility !== false,\n    imageProbe: options.imageProbe,\n  });\n  const institutional = await getNewsletterInstitutionalOptions(env);\n  const count = selection.products.length;\n  const baseSubject = env.NEWSLETTER_CUSTOM_SUBJECT?.trim() || "Seleção Cerberus Finds";\n  const subject = `${baseSubject} · ${count} ${count === 1 ? "produto selecionado" : "produtos selecionados"}`.slice(0, 255);\n  const rendered = renderNewsletterCollectionCampaign(selection.products, {\n    subject,\n    collectionKicker: "Monte sua campanha",\n    collectionTitle: count === 1 ? "1 ACHADO SELECIONADO" : `${count} ACHADOS SELECIONADOS`,\n    collectionIntro: "Uma seleção montada manualmente no painel Cerberus.",\n    trackingCampaignId: campaignId,\n    privacyUrl: institutional.privacyUrl,\n    termsUrl: institutional.termsUrl,\n    socialLinks: institutional.socialLinks,\n    finalBrowseUrl: env.NEWSLETTER_COLLECTION_BROWSE_URL || undefined,\n    mastheadImageStatus: "unavailable",\n    mastheadLogoStatus: "available",\n  });\n  const collectionProducts: CampaignProductLink[] = selection.products.map((product, index) => ({\n    productId: product.id,\n    position: index + 1,\n    layout: index === 0 ? "feature" : "grid",\n  }));\n  const editionKey = `manual:${now.toISOString().slice(0, 10)}:${campaignId}`;\n  const draft = createCampaignDraft(null, actorTelegramId, rendered, now, campaignId, "collection", collectionProducts, editionKey);\n  const store = options.store || createSupabaseNewsletterCampaignStore();\n  const persisted = await store.createCampaign(draft);\n  await store.createCampaignProducts(persisted.id, collectionProducts);\n  return { ...persisted, collectionProducts, editionKey };\n}\n\n'''
          if text.count(anchor) != 1:
              raise SystemExit('custom campaign service insertion anchor mismatch')
          text = text.replace(anchor, custom + anchor, 1)
          service.write_text(text)

          # 4) Telegram interactive builder.
          telegram = Path('server/services/newsletterCampaignTelegram.ts')
          text = telegram.read_text()
          text = text.replace('  createCampaignForProduct,\n  createWeeklyCollectionCampaign,\n', '  createCampaignForProduct,\n  createCustomCollectionCampaign,\n  createWeeklyCollectionCampaign,\n', 1)
          text = text.replace('const campaignCallbackLocks = new Map<string, Promise<void>>();\n', '''const campaignCallbackLocks = new Map<string, Promise<void>>();\nconst CAMPAIGN_BUILDER_ACTION = "campaign_builder";\nconst CAMPAIGN_BUILDER_PAGE_SIZE = 6;\nconst CAMPAIGN_BUILDER_MAX_PRODUCTS = 10;\n\ntype CampaignBuilderState = {\n  catalogProductIds: string[];\n  selectedProductIds: string[];\n  page: number;\n};\n''', 1)
          start_anchor = '''    const store = deps.store || createSupabaseNewsletterCampaignStore();\n    if (data === "campaign_collection") {\n'''
          start_replacement = '''    const store = deps.store || createSupabaseNewsletterCampaignStore();\n\n    if (data === "campaign_builder_start") {\n      return startCustomCampaignBuilder(callbackId, senderId, chatId, messageId, deps);\n    }\n    if (data.startsWith("campaign_builder_toggle:")) {\n      const index = Number(data.slice("campaign_builder_toggle:".length));\n      return toggleCustomCampaignProduct(callbackId, senderId, chatId, messageId, index, deps);\n    }\n    if (data.startsWith("campaign_builder_page:")) {\n      const page = Number(data.slice("campaign_builder_page:".length));\n      return changeCustomCampaignBuilderPage(callbackId, senderId, chatId, messageId, page, deps);\n    }\n    if (data === "campaign_builder_clear") {\n      return clearCustomCampaignBuilder(callbackId, senderId, chatId, messageId, deps);\n    }\n    if (data === "campaign_builder_cancel") {\n      await telegramRepo.deleteUserState(senderId);\n      await deps.answerCallbackQuery(callbackId, "Montagem cancelada. Nenhuma campanha foi criada.");\n      const view = renderRecentCampaignsForTelegram(await store.listRecentCampaigns(10));\n      if (chatId && messageId) await deps.editTelegramMessageText(chatId, messageId, view.text, { inline_keyboard: view.keyboard });\n      else if (chatId) await deps.sendTelegramMessage(chatId, view.text, { inline_keyboard: view.keyboard });\n      return true;\n    }\n    if (data === "campaign_builder_done") {\n      const builder = await readCustomCampaignBuilder(senderId);\n      if (!builder) {\n        await deps.answerCallbackQuery(callbackId, "A sessão de montagem expirou. Abra /campanhas e comece novamente.", true);\n        return true;\n      }\n      if (builder.selectedProductIds.length < 1) {\n        await deps.answerCallbackQuery(callbackId, "Selecione pelo menos 1 produto.", true);\n        return true;\n      }\n      if (builder.selectedProductIds.length > CAMPAIGN_BUILDER_MAX_PRODUCTS) {\n        await deps.answerCallbackQuery(callbackId, "O limite é de 10 produtos por campanha.", true);\n        return true;\n      }\n      const campaign = await createCustomCollectionCampaign(builder.selectedProductIds, senderId, {\n        store,\n        env,\n        productsLoader: deps.productsLoader,\n        now: deps.now,\n        verifyImageAccessibility: deps.verifyImageAccessibility,\n      });\n      const pending = await submitCampaignForApproval(campaign, senderId, { store, env });\n      await telegramRepo.deleteUserState(senderId);\n      await deps.answerCallbackQuery(callbackId, `Campanha montada com ${builder.selectedProductIds.length} produto(s). Revise a prévia antes de aprovar.`);\n      return renderCampaignWithFallback(deps, chatId, messageId, pending, campaignKeyboard(pending));\n    }\n\n    if (data === "campaign_collection") {\n'''
          if text.count(start_anchor) != 1:
              raise SystemExit('Telegram callback insertion anchor mismatch')
          text = text.replace(start_anchor, start_replacement, 1)

          list_old = '''  const keyboard = visible.map(campaign => [{\n    text: `${campaignStatusLabel(campaign.status)} · ${campaign.subject.slice(0, 42)}`,\n    callback_data: `campaign_view:${campaign.id}`,\n  }]);\n  return { text, keyboard };\n}\n'''
          list_new = '''  const keyboard = [\n    [{ text: "🧩 Monte sua campanha", callback_data: "campaign_builder_start" }],\n    ...visible.map(campaign => [{\n      text: `${campaignStatusLabel(campaign.status)} · ${campaign.subject.slice(0, 42)}`,\n      callback_data: `campaign_view:${campaign.id}`,\n    }]),\n  ];\n  return { text, keyboard };\n}\n'''
          if text.count(list_old) != 1:
              raise SystemExit('campaign list keyboard anchor mismatch')
          text = text.replace(list_old, list_new, 1)

          helper_anchor = '''function campaignStatusLabel(status: EmailCampaign["status"]): string {\n'''
          builder_helpers = r'''function isCampaignBuilderProduct(product: import("../../src/types").Product): boolean {
  const statusOk = !product.status || product.status === "approved" || product.status === "published";
  return Boolean(product.id?.trim()) && product.ativo === true && statusOk;
}

function normalizeBuilderState(value: unknown): CampaignBuilderState | null {
  if (!value || typeof value !== "object" || Array.isArray(value)) return null;
  const candidate = value as Partial<CampaignBuilderState>;
  const catalogProductIds = Array.isArray(candidate.catalogProductIds)
    ? candidate.catalogProductIds.map(String).map(item => item.trim()).filter(Boolean)
    : [];
  const selectedProductIds = Array.isArray(candidate.selectedProductIds)
    ? candidate.selectedProductIds.map(String).map(item => item.trim()).filter(id => catalogProductIds.includes(id))
    : [];
  const page = Number.isInteger(candidate.page) ? Math.max(0, Number(candidate.page)) : 0;
  if (catalogProductIds.length === 0) return null;
  return { catalogProductIds, selectedProductIds: [...new Set(selectedProductIds)].slice(0, CAMPAIGN_BUILDER_MAX_PRODUCTS), page };
}

async function readCustomCampaignBuilder(senderId: string): Promise<CampaignBuilderState | null> {
  const state = await telegramRepo.getUserState(senderId);
  if (state?.action !== CAMPAIGN_BUILDER_ACTION) return null;
  return normalizeBuilderState(state.data);
}

async function writeCustomCampaignBuilder(senderId: string, state: CampaignBuilderState): Promise<void> {
  await telegramRepo.setUserState(senderId, { action: CAMPAIGN_BUILDER_ACTION, data: state });
}

async function startCustomCampaignBuilder(
  callbackId: string,
  senderId: string,
  chatId: number | string | undefined,
  messageId: number | undefined,
  deps: CampaignTelegramDeps,
): Promise<boolean> {
  const products = await (deps.productsLoader || productsRepository.getProducts)();
  const catalog = products
    .filter(isCampaignBuilderProduct)
    .sort((a, b) => {
      const right = typeof b.createdAt === "string" ? Date.parse(b.createdAt) : 0;
      const left = typeof a.createdAt === "string" ? Date.parse(a.createdAt) : 0;
      return (Number.isFinite(right) ? right : 0) - (Number.isFinite(left) ? left : 0);
    });
  if (catalog.length === 0) {
    await deps.answerCallbackQuery(callbackId, "Não há produtos ativos disponíveis para montar campanha.", true);
    return true;
  }
  const state: CampaignBuilderState = { catalogProductIds: catalog.map(product => product.id.trim()), selectedProductIds: [], page: 0 };
  await writeCustomCampaignBuilder(senderId, state);
  await deps.answerCallbackQuery(callbackId, "Selecione de 1 a 10 produtos. O primeiro selecionado será o HERO.");
  return renderCustomCampaignBuilder(senderId, chatId, messageId, state, deps);
}

async function toggleCustomCampaignProduct(
  callbackId: string,
  senderId: string,
  chatId: number | string | undefined,
  messageId: number | undefined,
  index: number,
  deps: CampaignTelegramDeps,
): Promise<boolean> {
  const state = await readCustomCampaignBuilder(senderId);
  if (!state) {
    await deps.answerCallbackQuery(callbackId, "A sessão de montagem expirou. Abra /campanhas novamente.", true);
    return true;
  }
  if (!Number.isInteger(index) || index < 0 || index >= state.catalogProductIds.length) {
    await deps.answerCallbackQuery(callbackId, "Produto inválido nesta sessão.", true);
    return true;
  }
  const productId = state.catalogProductIds[index];
  const selected = [...state.selectedProductIds];
  const currentIndex = selected.indexOf(productId);
  if (currentIndex >= 0) {
    selected.splice(currentIndex, 1);
  } else {
    if (selected.length >= CAMPAIGN_BUILDER_MAX_PRODUCTS) {
      await deps.answerCallbackQuery(callbackId, "Limite atingido: no máximo 10 produtos.", true);
      return true;
    }
    selected.push(productId);
  }
  const next = { ...state, selectedProductIds: selected };
  await writeCustomCampaignBuilder(senderId, next);
  await deps.answerCallbackQuery(callbackId, currentIndex >= 0 ? `Produto removido · ${selected.length}/10` : `Produto adicionado · ${selected.length}/10`);
  return renderCustomCampaignBuilder(senderId, chatId, messageId, next, deps);
}

async function changeCustomCampaignBuilderPage(
  callbackId: string,
  senderId: string,
  chatId: number | string | undefined,
  messageId: number | undefined,
  page: number,
  deps: CampaignTelegramDeps,
): Promise<boolean> {
  const state = await readCustomCampaignBuilder(senderId);
  if (!state) {
    await deps.answerCallbackQuery(callbackId, "A sessão de montagem expirou. Abra /campanhas novamente.", true);
    return true;
  }
  const maxPage = Math.max(0, Math.ceil(state.catalogProductIds.length / CAMPAIGN_BUILDER_PAGE_SIZE) - 1);
  const next = { ...state, page: Math.max(0, Math.min(maxPage, Number.isFinite(page) ? Math.trunc(page) : 0)) };
  await writeCustomCampaignBuilder(senderId, next);
  await deps.answerCallbackQuery(callbackId);
  return renderCustomCampaignBuilder(senderId, chatId, messageId, next, deps);
}

async function clearCustomCampaignBuilder(
  callbackId: string,
  senderId: string,
  chatId: number | string | undefined,
  messageId: number | undefined,
  deps: CampaignTelegramDeps,
): Promise<boolean> {
  const state = await readCustomCampaignBuilder(senderId);
  if (!state) {
    await deps.answerCallbackQuery(callbackId, "A sessão de montagem expirou. Abra /campanhas novamente.", true);
    return true;
  }
  const next = { ...state, selectedProductIds: [] };
  await writeCustomCampaignBuilder(senderId, next);
  await deps.answerCallbackQuery(callbackId, "Seleção limpa.");
  return renderCustomCampaignBuilder(senderId, chatId, messageId, next, deps);
}

async function renderCustomCampaignBuilder(
  senderId: string,
  chatId: number | string | undefined,
  messageId: number | undefined,
  state: CampaignBuilderState,
  deps: CampaignTelegramDeps,
): Promise<boolean> {
  if (!chatId) return true;
  const products = await (deps.productsLoader || productsRepository.getProducts)();
  const byId = new Map(products.map(product => [product.id, product] as const));
  const maxPage = Math.max(0, Math.ceil(state.catalogProductIds.length / CAMPAIGN_BUILDER_PAGE_SIZE) - 1);
  const page = Math.max(0, Math.min(maxPage, state.page));
  const start = page * CAMPAIGN_BUILDER_PAGE_SIZE;
  const ids = state.catalogProductIds.slice(start, start + CAMPAIGN_BUILDER_PAGE_SIZE);
  const selectedSet = new Set(state.selectedProductIds);
  const selectedLines = state.selectedProductIds.map((id, index) => {
    const product = byId.get(id);
    const title = product?.displayTitle || product?.produto || id;
    return `${index + 1}. ${escapeTelegram(String(title).slice(0, 58))}${index === 0 ? " · <b>HERO</b>" : ""}`;
  });
  const text = [
    "🧩 <b>MONTE SUA CAMPANHA</b>",
    "Selecione de <b>1 a 10 produtos</b>. O primeiro selecionado vira o destaque/HERO.",
    `Selecionados: <b>${state.selectedProductIds.length}/10</b> · Página <b>${page + 1}/${maxPage + 1}</b>`,
    "",
    selectedLines.length ? `<b>Ordem atual</b>\n${selectedLines.join("\n")}` : "Nenhum produto selecionado ainda.",
    "",
    "Toque nos produtos abaixo para adicionar/remover. Nada é enviado automaticamente.",
  ].join("\n");
  const keyboard: any[][] = ids.map((id, offset) => {
    const product = byId.get(id);
    const title = String(product?.displayTitle || product?.produto || "Produto indisponível").replace(/\s+/g, " ").trim();
    const absoluteIndex = start + offset;
    return [{
      text: `${selectedSet.has(id) ? "✅" : "◻️"} ${absoluteIndex + 1}. ${title.slice(0, 42)}`,
      callback_data: `campaign_builder_toggle:${absoluteIndex}`,
    }];
  });
  const navigation: any[] = [];
  if (page > 0) navigation.push({ text: "⬅️ Anterior", callback_data: `campaign_builder_page:${page - 1}` });
  if (page < maxPage) navigation.push({ text: "Próxima ➡️", callback_data: `campaign_builder_page:${page + 1}` });
  if (navigation.length) keyboard.push(navigation);
  if (state.selectedProductIds.length > 0) {
    keyboard.push([{ text: `✅ Montar campanha (${state.selectedProductIds.length})`, callback_data: "campaign_builder_done" }]);
    keyboard.push([{ text: "🗑 Limpar seleção", callback_data: "campaign_builder_clear" }]);
  }
  keyboard.push([{ text: "❌ Cancelar", callback_data: "campaign_builder_cancel" }]);
  if (messageId) await deps.editTelegramMessageText(chatId, messageId, text, { inline_keyboard: keyboard });
  else await deps.sendTelegramMessage(chatId, text, { inline_keyboard: keyboard });
  return true;
}

'''
