name: Weekly Production Audience Sync

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:
    inputs:
      operation:
        description: Safe production audience operation
        required: true
        default: status
        type: choice
        options:
          - status
          - sync
          - reconcile

permissions:
  contents: read

concurrency:
  group: weekly-production-audience-sync
  cancel-in-progress: false

jobs:
  audience:
    if: github.event_name == 'workflow_dispatch' || vars.CERBERUS_SERVERLESS_WEEKLY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_URL: https://ppsxlclycyinhhoqijvz.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
      BREVO_WEEKLY_PRODUCTION_LIST_ID: ${{ secrets.BREVO_WEEKLY_PRODUCTION_LIST_ID }}
      BREVO_MARKETING_LIST_ID: ${{ secrets.BREVO_MARKETING_LIST_ID }}
      OPERATION: ${{ github.event_name == 'workflow_dispatch' && inputs.operation || 'scheduled' }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.1
          cache: npm
      - run: npm ci
      - name: Run direct audience operation
        shell: bash
        run: |
          set -euo pipefail
          if [ "$OPERATION" = "scheduled" ]; then
            npx tsx scripts/run-serverless-ops-direct.ts audience-sync
            npx tsx scripts/run-serverless-ops-direct.ts audience-reconcile
          else
            npx tsx scripts/run-serverless-ops-direct.ts "audience-$OPERATION"
          fi
