name: Weekly Production Audience Sync

# Push runs are intentionally status-only and cannot mutate the provider.
on:
  schedule:
    - cron: "7 * * * *"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/weekly-production-audience-sync.yml"
      - "scripts/run-weekly-production-audience-direct.ts"
      - "server/services/newsletterWeeklyBrevoAudienceSync.ts"
      - "server/services/newsletterWeeklyBrevoStatusReconcile.ts"
      - "server/services/newsletterWeeklyProductionConfig.ts"
  workflow_dispatch:
    inputs:
      operation:
        description: Safe production audience operation
        required: true
        default: status
        type: choice
        options:
          - status
          - reconcile
          - sync
          - bootstrap
      confirm_provider_mutations:
        description: Confirm provider audience mutations for sync/bootstrap
        required: false
        default: false
        type: boolean
      confirm_enable_production:
        description: Confirm enabling weekly production for bootstrap
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: weekly-production-audience-sync
  cancel-in-progress: false

jobs:
  audience:
    if: github.event_name != 'schedule' || vars.CERBERUS_SERVERLESS_NEWSLETTER_PROVIDER_RECONCILE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      SUPABASE_URL: https://ppsxlclycyinhhoqijvz.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.1
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Resolve controlled operation
        id: operation
        shell: bash
        env:
          DISPATCH_OPERATION: ${{ inputs.operation }}
          CONFIRM_PROVIDER_MUTATIONS: ${{ inputs.confirm_provider_mutations }}
          CONFIRM_ENABLE_PRODUCTION: ${{ inputs.confirm_enable_production }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "push" ]; then
            op=status
            allow_provider_mutations=false
            allow_enable_production=false
          elif [ "${{ github.event_name }}" = "schedule" ]; then
            op=reconcile
            allow_provider_mutations=false
            allow_enable_production=false
          else
            op="${DISPATCH_OPERATION:-status}"
            allow_provider_mutations=false
            allow_enable_production=false
            case "$op" in
              status|reconcile) ;;
              sync)
                if [ "${CONFIRM_PROVIDER_MUTATIONS:-false}" != "true" ]; then
                  echo "Provider mutation confirmation required for sync."
                  exit 1
                fi
                allow_provider_mutations=true
                ;;
              bootstrap)
                if [ "${CONFIRM_PROVIDER_MUTATIONS:-false}" != "true" ] || [ "${CONFIRM_ENABLE_PRODUCTION:-false}" != "true" ]; then
                  echo "Provider mutation and production enable confirmations are required for bootstrap."
                  exit 1
                fi
                allow_provider_mutations=true
                allow_enable_production=true
                ;;
              *)
                echo "Unsupported operation"
                exit 1
                ;;
            esac
          fi
          echo "operation=$op" >> "$GITHUB_OUTPUT"
          echo "allow_provider_mutations=$allow_provider_mutations" >> "$GITHUB_OUTPUT"
          echo "allow_enable_production=$allow_enable_production" >> "$GITHUB_OUTPUT"
      - name: Run direct weekly audience operation
        env:
          WEEKLY_AUDIENCE_OPERATION: ${{ steps.operation.outputs.operation }}
          WEEKLY_ALLOW_PROVIDER_MUTATIONS: ${{ steps.operation.outputs.allow_provider_mutations }}
          WEEKLY_ALLOW_PRODUCTION_BOOTSTRAP: ${{ steps.operation.outputs.allow_enable_production }}
        run: npx tsx scripts/run-weekly-production-audience-direct.ts
