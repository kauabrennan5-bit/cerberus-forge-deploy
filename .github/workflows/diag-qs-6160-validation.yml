name: DIAG qs 6.16.0 validation

on:
  push:
    branches:
      - fix/qs-6-16-0-2026-09-02
    paths:
      - package.json
      - .github/workflows/diag-qs-6160-validation.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Regenerate exact lockfile
        run: npm install --package-lock-only --ignore-scripts
      - name: Verify lockfile-only generation scope
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code -- . ':(exclude)package-lock.json'
          test -n "$(git status --porcelain package-lock.json)"
      - name: Install exact lockfile
        run: npm ci
      - name: Verify qs override
        shell: bash
        run: |
          set -euo pipefail
          node -e 'const v=require("qs/package.json").version; console.log("qs="+v); if(v!=="6.16.0") process.exit(1)'
          npm ls qs --all
      - name: Security audit
        run: npm audit --audit-level=moderate
      - name: Global tests
        run: npm test
      - name: TypeScript
        run: npm run lint
      - name: Production build
        run: npm run build
      - name: Migration and schema contract
        run: node scripts/check-weekly-migrations.mjs
      - name: Diff check
        run: git diff --check
      - name: Reject skipped todo or only tests
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -n -E '\b(test|describe|it)\.(skip|todo|only)\b' tests --include='*.test.ts'; then
            echo "Forbidden skip/todo/only detected"
            exit 1
          fi
      - name: Secret scan changed content
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/gitleaks-scan /tmp/gitleaks-bin
          git diff --no-ext-diff origin/main...HEAD > /tmp/gitleaks-scan/qs.patch
          curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o /tmp/gitleaks.tar.gz
          tar --no-same-owner -xzf /tmp/gitleaks.tar.gz -C /tmp/gitleaks-bin gitleaks
          /tmp/gitleaks-bin/gitleaks detect --no-git --source /tmp/gitleaks-scan --redact --exit-code 1 --no-banner
      - name: Verify final generated scope
        shell: bash
        run: |
          set -euo pipefail
          git restore -- public/data/products.json
          git diff --exit-code -- . ':(exclude)package-lock.json'
          test -n "$(git status --porcelain package-lock.json)"
      - name: Commit validated lockfile
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "fix: lock qs 6.16.0 security override"
          git push origin HEAD:fix/qs-6-16-0-2026-09-02
