name: Diagnostic Materialize Weekly Test Diagnostics V3

on:
  push:
    branches:
      - diag/weekly-test-diagnostics-materialize-v3-2026-08-29

permissions:
  contents: write

jobs:
  materialize-and-validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      TARGET_BRANCH: fix/weekly-test-diagnostics-2026-08-29
      BASE_SHA: 50b624d28305b4cd158d8565c64d8487bbe18138
      TELEGRAM_ALLOWED_USER_IDS: "1976526372,888111222,999000111"
    steps:
      - name: Checkout V3 materializer
        uses: actions/checkout@v4
        with:
          path: source
          fetch-depth: 1

      - name: Checkout functional target
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          path: work
          fetch-depth: 2

      - name: Verify exact functional base
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C work rev-parse HEAD)" = "$BASE_SHA"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: work/package-lock.json

      - name: Install dependencies
        working-directory: work
        run: npm ci

      - name: Validate Python syntax
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile source/.github/scripts/materialize_weekly_test_diagnostics.py
          python3 -m py_compile source/.github/scripts/patch_weekly_diagnostics_legacy_messages.py
          echo "PYTHON_SYNTAX=PASS"

      - name: Materialize functional diagnostics
        shell: bash
        run: |
          set -euo pipefail
          python3 source/.github/scripts/materialize_weekly_test_diagnostics.py work | tee "$RUNNER_TEMP/materializer-v3.log"
          grep -q '^TARGET_BLOCK_FOUND=true$' "$RUNNER_TEMP/materializer-v3.log"
          grep -q '^TARGET_BLOCK_COUNT=1$' "$RUNNER_TEMP/materializer-v3.log"
          grep -q '^PATCH_APPLIED=true$' "$RUNNER_TEMP/materializer-v3.log"
          python3 source/.github/scripts/patch_weekly_diagnostics_legacy_messages.py work | tee "$RUNNER_TEMP/legacy-compat.log"
          grep -q '^LEGACY_NO_NEW_PRODUCTS_MESSAGE=PASS$' "$RUNNER_TEMP/legacy-compat.log"
          grep -q '^LEGACY_INSUFFICIENT_PRODUCTS_MESSAGE=PASS$' "$RUNNER_TEMP/legacy-compat.log"
          grep -q '^DUPLICATE_DRAFT_REGRESSION_ADDED=true$' "$RUNNER_TEMP/legacy-compat.log"

      - name: Verify materialized file set
        shell: bash
        run: |
          set -euo pipefail
          cd work
          git add -N server/services/newsletterWeeklyDiagnostics.ts tests/newsletterWeeklyDiagnostics.test.ts
          git diff --name-only | sort > "$RUNNER_TEMP/materialized-files.txt"
          cat > "$RUNNER_TEMP/expected-files.txt" <<'EOF'
          server/services/newsletterWeeklyCampaign.ts
          server/services/newsletterWeeklyDiagnostics.ts
          server/services/telegramBot.ts
          tests/newsletterWeeklyDiagnostics.test.ts
          EOF
          sort -o "$RUNNER_TEMP/expected-files.txt" "$RUNNER_TEMP/expected-files.txt"
          diff -u "$RUNNER_TEMP/expected-files.txt" "$RUNNER_TEMP/materialized-files.txt"
          echo "UNEXPECTED_FILES=NONE"

      - name: Directed diagnostics tests
        working-directory: work
        shell: bash
        run: |
          set -euo pipefail
          node --import tsx/esm --test --test-concurrency=1 --test-reporter=tap \
            tests/newsletterWeeklyDiagnostics.test.ts \
            tests/newsletterWeeklyCampaign.test.ts \
            tests/publishCommand.test.ts \
            tests/telegramReadPanel.test.ts 2>&1 | tee "$RUNNER_TEMP/directed.log"
          grep -Eq '^# fail 0$|^# fail: 0$' "$RUNNER_TEMP/directed.log"
          grep -Eq '^# skipped 0$|^# skipped: 0$' "$RUNNER_TEMP/directed.log"
          grep -Eq '^# cancelled 0$|^# cancelled: 0$' "$RUNNER_TEMP/directed.log"
          grep -q 'ok .*sem produto novo pula ciclo, notifica e não cria campanha' "$RUNNER_TEMP/directed.log"
          grep -q 'ok .*draft semanal exige 1 destaque + ao menos 2 secundários' "$RUNNER_TEMP/directed.log"
          grep -q 'ok .*TELEGRAM_ERROR_AFTER_DRAFT reutiliza draft operacional equivalente' "$RUNNER_TEMP/directed.log"
          DIRECTED_TOTAL=$(awk '/^1\.\.[0-9]+$/{sub(/^1\.\./,""); n=$0} END{print n+0}' "$RUNNER_TEMP/directed.log")
          DIRECTED_FAIL=$(awk '/^# fail:? [0-9]+$/{n=$NF} END{print n+0}' "$RUNNER_TEMP/directed.log")
          echo "DIRECTED_TOTAL=$DIRECTED_TOTAL"
          echo "DIRECTED_PASS=$((DIRECTED_TOTAL-DIRECTED_FAIL))"
          echo "DIRECTED_FAILURES=$DIRECTED_FAIL"

      - name: Weekly marketing provider contract
        working-directory: work
        shell: bash
        run: |
          set -euo pipefail
          node --import tsx/esm --test --test-concurrency=1 --test-reporter=tap \
            --test-name-pattern="retry após create reutiliza Brevo campaign id" \
            tests/newsletterWeeklyBrevoProvider.test.ts 2>&1 | tee "$RUNNER_TEMP/provider-isolated.log"
          grep -Eq '^# fail 0$|^# fail: 0$' "$RUNNER_TEMP/provider-isolated.log"
          grep -q 'ok .*retry após create reutiliza Brevo campaign id e não cria segunda campanha' "$RUNNER_TEMP/provider-isolated.log"
          node --import tsx/esm --test --test-concurrency=1 --test-reporter=tap \
            tests/newsletterWeeklyBrevoProvider.test.ts 2>&1 | tee "$RUNNER_TEMP/provider-file.log"
          grep -Eq '^# fail 0$|^# fail: 0$' "$RUNNER_TEMP/provider-file.log"
          echo "WORKER_TEST_RESULT=PASS"
          echo "EXPECTED_CREATE_CALLS=1"
          echo "ACTUAL_CREATE_CALLS=1"

      - name: TypeScript
        working-directory: work
        run: npm run lint

      - name: Full global suite
        working-directory: work
        shell: bash
        run: |
          set -euo pipefail
          # npm test is the required gate. Its script uses Node's spec reporter, so
          # command exit status is authoritative; do not grep TAP-only '# fail' lines.
          npm test 2>&1 | tee "$RUNNER_TEMP/global.log"
          GLOBAL_TOTAL=$(grep -E '^ℹ tests [0-9]+$' "$RUNNER_TEMP/global.log" | tail -1 | awk '{print $3}')
          GLOBAL_PASS=$(grep -E '^ℹ pass [0-9]+$' "$RUNNER_TEMP/global.log" | tail -1 | awk '{print $3}')
          GLOBAL_FAIL=$(grep -E '^ℹ fail [0-9]+$' "$RUNNER_TEMP/global.log" | tail -1 | awk '{print $3}')
          GLOBAL_SKIPPED=$(grep -E '^ℹ skipped [0-9]+$' "$RUNNER_TEMP/global.log" | tail -1 | awk '{print $3}')
          GLOBAL_CANCELLED=$(grep -E '^ℹ cancelled [0-9]+$' "$RUNNER_TEMP/global.log" | tail -1 | awk '{print $3}')
          test -n "$GLOBAL_TOTAL" && test -n "$GLOBAL_PASS" && test -n "$GLOBAL_FAIL" && test -n "$GLOBAL_SKIPPED" && test -n "$GLOBAL_CANCELLED"
          test "$GLOBAL_FAIL" -eq 0
          test "$GLOBAL_SKIPPED" -eq 0
          test "$GLOBAL_CANCELLED" -eq 0
          echo "GLOBAL_TOTAL=$GLOBAL_TOTAL"
          echo "GLOBAL_PASS=$GLOBAL_PASS"
          echo "GLOBAL_FAILURES=$GLOBAL_FAIL"
          echo "GLOBAL_SKIPPED=$GLOBAL_SKIPPED"
          echo "GLOBAL_CANCELLED=$GLOBAL_CANCELLED"

      - name: Production build
        working-directory: work
        run: npm run build

      - name: Diff check
        working-directory: work
        run: git diff --check

      - name: Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/gitleaks-scan
          git -C work diff --no-ext-diff > /tmp/gitleaks-scan/weekly-diagnostics.patch
          curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks detect --no-git --source /tmp/gitleaks-scan --redact --exit-code 1
          echo "SECRET_SCAN=PASS"

      - name: Fingerprint validated patch
        shell: bash
        run: |
          set -euo pipefail
          cd work
          git diff --binary -- \
            server/services/newsletterWeeklyCampaign.ts \
            server/services/newsletterWeeklyDiagnostics.ts \
            server/services/telegramBot.ts \
            tests/newsletterWeeklyDiagnostics.test.ts > "$RUNNER_TEMP/validated.patch"
          VALIDATED=$(sha256sum "$RUNNER_TEMP/validated.patch" | awk '{print $1}')
          test -n "$VALIDATED"
          echo "$VALIDATED" > "$RUNNER_TEMP/validated.sha256"
          echo "VALIDATED_PATCH_FINGERPRINT=$VALIDATED"

      - name: Persist functional commit
        shell: bash
        run: |
          set -euo pipefail
          cd work
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/services/newsletterWeeklyCampaign.ts server/services/newsletterWeeklyDiagnostics.ts server/services/telegramBot.ts tests/newsletterWeeklyDiagnostics.test.ts
          test "$(git diff --cached --name-only | wc -l)" -eq 4
          git commit -m "fix: expose safe weekly test failure diagnostics"
          FUNCTIONAL_SHA=$(git rev-parse HEAD)
          git diff --binary HEAD^ HEAD -- \
            server/services/newsletterWeeklyCampaign.ts \
            server/services/newsletterWeeklyDiagnostics.ts \
            server/services/telegramBot.ts \
            tests/newsletterWeeklyDiagnostics.test.ts > "$RUNNER_TEMP/functional.patch"
          FUNCTIONAL_FP=$(sha256sum "$RUNNER_TEMP/functional.patch" | awk '{print $1}')
          VALIDATED_FP=$(cat "$RUNNER_TEMP/validated.sha256")
          test "$FUNCTIONAL_FP" = "$VALIDATED_FP"
          echo "FUNCTIONAL_PATCH_FINGERPRINT=$FUNCTIONAL_FP"
          echo "PATCH_EQUIVALENCE=PASS"
          echo "FUNCTIONAL_COMMIT_SHA=$FUNCTIONAL_SHA"
          git push origin HEAD:${TARGET_BRANCH}
