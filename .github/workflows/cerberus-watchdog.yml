name: Cerberus external watchdog

on:
  schedule:
    - cron: "*/15 * * * *"
    # Sexta 10:00 America/Fortaleza (13:00 UTC): cria somente o rascunho.
    - cron: "0 13 * * 5"
    # Sábado 10:00 America/Fortaleza: lembra rascunhos sem decisão; nunca envia.
    - cron: "0 13 * * 6"
  workflow_dispatch:
    inputs:
      operation:
        description: "Operação controlada"
        required: true
        type: choice
        default: health
        options:
          - health
          - weekly-draft
          - weekly-draft-test
          - weekly-test-recipient-ensure
          - weekly-stale

permissions:
  contents: write

concurrency:
  group: cerberus-watchdog
  cancel-in-progress: true

jobs:
  health-check:
    if: github.event_name == 'schedule' && github.event.schedule == '*/15 * * * *' || github.event_name == 'workflow_dispatch' && inputs.operation == 'health'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      CERBERUS_HEALTH_URL: ${{ secrets.CERBERUS_HEALTH_URL }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
      WATCHDOG_TIMEOUT_MS: "10000"
      WATCHDOG_STATE_PATH: state/watchdog-state.json
    steps:
      - name: Checkout watchdog state
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run external health check
        run: node scripts/watchdog.mjs

      - name: Persist watchdog transition state
        if: always()
        run: |
          if ! git status --porcelain -- state/watchdog-state.json | grep -q .; then
            echo "No watchdog state transition to commit."
            exit 0
          fi
          git config user.name "cerberus-watchdog"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/watchdog-state.json
          git commit -m "chore(watchdog): persist health transition state"
          git push


  weekly-draft:
    if: github.event_name == 'schedule' && github.event.schedule == '0 13 * * 5' || github.event_name == 'workflow_dispatch' && (inputs.operation == 'weekly-draft' || inputs.operation == 'weekly-draft-test')
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      CERBERUS_HEALTH_URL: ${{ secrets.CERBERUS_HEALTH_URL }}
      CERBERUS_AUTOMATION_TOKEN: ${{ secrets.CERBERUS_AUTOMATION_TOKEN }}
    steps:
      - name: Trigger weekly draft only
        shell: bash
        run: |
          set -euo pipefail
          [ -n "${CERBERUS_HEALTH_URL:-}" ] || { echo "CERBERUS_HEALTH_URL missing"; exit 1; }
          [ -n "${CERBERUS_AUTOMATION_TOKEN:-}" ] || { echo "CERBERUS_AUTOMATION_TOKEN missing"; exit 1; }
          base="${CERBERUS_HEALTH_URL%/health}"
          body='{}'
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.operation }}" = "weekly-draft-test" ]; then body='{"testMode":true}'; fi
          curl --fail-with-body --silent --show-error --max-time 45 \
            -H "Content-Type: application/json" \
            -H "X-Cerberus-Automation-Token: ${CERBERUS_AUTOMATION_TOKEN}" \
            -d "$body" \
            "$base/api/internal/newsletter/weekly-draft"

  weekly-test-recipient-ensure:
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'weekly-test-recipient-ensure'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      CERBERUS_HEALTH_URL: ${{ secrets.CERBERUS_HEALTH_URL }}
      CERBERUS_AUTOMATION_TOKEN: ${{ secrets.CERBERUS_AUTOMATION_TOKEN }}
    steps:
      - name: Ensure only the configured Brevo test recipient
        shell: bash
        run: |
          set -euo pipefail
          [ -n "${CERBERUS_HEALTH_URL:-}" ] || { echo "CERBERUS_HEALTH_URL missing"; exit 1; }
          [ -n "${CERBERUS_AUTOMATION_TOKEN:-}" ] || { echo "CERBERUS_AUTOMATION_TOKEN missing"; exit 1; }
          base="${CERBERUS_HEALTH_URL%/health}"
          curl --fail-with-body --silent --show-error --max-time 45 \
            -H "Content-Type: application/json" \
            -H "X-Cerberus-Automation-Token: ${CERBERUS_AUTOMATION_TOKEN}" \
            -d '{}' \
            "$base/api/internal/newsletter/weekly-test-recipient/ensure"

  weekly-stale:
    if: github.event_name == 'schedule' && github.event.schedule == '0 13 * * 6' || github.event_name == 'workflow_dispatch' && inputs.operation == 'weekly-stale'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      CERBERUS_HEALTH_URL: ${{ secrets.CERBERUS_HEALTH_URL }}
      CERBERUS_AUTOMATION_TOKEN: ${{ secrets.CERBERUS_AUTOMATION_TOKEN }}
    steps:
      - name: Notify stale weekly draft without sending
        shell: bash
        run: |
          set -euo pipefail
          [ -n "${CERBERUS_HEALTH_URL:-}" ] || { echo "CERBERUS_HEALTH_URL missing"; exit 1; }
          [ -n "${CERBERUS_AUTOMATION_TOKEN:-}" ] || { echo "CERBERUS_AUTOMATION_TOKEN missing"; exit 1; }
          base="${CERBERUS_HEALTH_URL%/health}"
          curl --fail-with-body --silent --show-error --max-time 45 \
            -H "Content-Type: application/json" \
            -H "X-Cerberus-Automation-Token: ${CERBERUS_AUTOMATION_TOKEN}" \
            -d '{}' \
            "$base/api/internal/newsletter/weekly-stale"
