name: Cerberus weekly direct automation

on:
  schedule:
    # Sexta 09:30 America/Fortaleza (12:30 UTC): preflight somente leitura.
    - cron: "30 12 * * 5"
    # Sexta 10:00 America/Fortaleza (13:00 UTC): draft, somente com gates serverless explícitos.
    - cron: "0 13 * * 5"
    # Sábado 10:00 America/Fortaleza (13:00 UTC): lembrete de draft pendente.
    - cron: "0 13 * * 6"
  workflow_dispatch:
    inputs:
      operation:
        description: "Operação semanal controlada"
        required: true
        type: choice
        default: weekly-preflight
        options:
          - weekly-preflight
          - weekly-editorial-backfill-dry-run
          - weekly-editorial-backfill-execute
          - weekly-draft
          - weekly-stale

permissions:
  contents: read

concurrency:
  group: cerberus-weekly-direct
  cancel-in-progress: false

jobs:
  weekly:
    if: github.event_name == 'workflow_dispatch' || vars.CERBERUS_SERVERLESS_NEWSLETTER_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_URL: https://ppsxlclycyinhhoqijvz.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
      TELEGRAM_ADMIN_USER_ID: ${{ secrets.TELEGRAM_ADMIN_USER_ID }}
      TELEGRAM_ALLOWED_USER_IDS: ${{ secrets.TELEGRAM_ALLOWED_USER_IDS }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
      PUBLIC_SITE_URL: https://cerberus-finds.pages.dev
      CERBERUS_SERVERLESS_NEWSLETTER_ENABLED: ${{ vars.CERBERUS_SERVERLESS_NEWSLETTER_ENABLED || 'false' }}
      CERBERUS_SERVERLESS_WEEKLY_PREVIEW_READY: ${{ vars.CERBERUS_SERVERLESS_WEEKLY_PREVIEW_READY || 'false' }}
      WEEKLY_BACKFILL_LIMIT: "50"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.1
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Resolve controlled operation
        id: operation
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            case "${{ inputs.operation }}" in
              weekly-preflight) op=preflight ;;
              weekly-draft) op=draft ;;
              weekly-stale) op=stale ;;
              weekly-editorial-backfill-dry-run) op=backfill-dry-run ;;
              weekly-editorial-backfill-execute) op=backfill-execute ;;
              *) echo "Unsupported operation"; exit 1 ;;
            esac
          else
            case "${{ github.event.schedule }}" in
              "30 12 * * 5") op=preflight ;;
              "0 13 * * 5") op=draft ;;
              "0 13 * * 6") op=stale ;;
              *) echo "Unsupported schedule"; exit 1 ;;
            esac
          fi
          echo "operation=$op" >> "$GITHUB_OUTPUT"
      - name: Run direct weekly operation
        env:
          WEEKLY_OPERATION: ${{ steps.operation.outputs.operation }}
          WEEKLY_PREFLIGHT_TELEGRAM_NOTIFY: ${{ github.event_name == 'schedule' && github.event.schedule == '30 12 * * 5' && 'true' || 'false' }}
          WEEKLY_ALLOW_EDITORIAL_BACKFILL_EXECUTE: ${{ github.event_name == 'workflow_dispatch' && inputs.operation == 'weekly-editorial-backfill-execute' && vars.CERBERUS_WEEKLY_BACKFILL_EXECUTE_ENABLED == 'true' && 'true' || 'false' }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$WEEKLY_OPERATION" = "draft" ] || [ "$WEEKLY_OPERATION" = "stale" ]; then
            if [ "$CERBERUS_SERVERLESS_NEWSLETTER_ENABLED" != "true" ] || [ "$CERBERUS_SERVERLESS_WEEKLY_PREVIEW_READY" != "true" ]; then
              echo "WEEKLY_DIRECT=SKIPPED serverless_or_preview_not_ready"
              exit 0
            fi
          fi
          npx tsx scripts/run-newsletter-weekly-direct.ts
