name: Patch V2 global tests

on:
  push:
    branches:
      - refactor/telegram-bot-v2-2026-08-28
    paths:
      - .github/workflows/patch-v2-global-tests.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Migrate static tests to V2 command registry
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          newsletter = Path('tests/newsletterCampaign.test.ts')
          s = newsletter.read_text(encoding='utf-8')
          pattern = r'''test\("telegram menu exposes campaign recovery and only valid command names", \(\) => \{[\s\S]*?\n\}\);'''
          replacement = '''test("telegram menu exposes primary campaign recovery and keeps advanced commands out of BotFather", async () => {
            assert.equal(TELEGRAM_PANEL_COMMANDS.some(command => command.command === "campanhas"), true);
            assert.equal(TELEGRAM_PANEL_COMMANDS.some(command => command.command === "redes"), true);
            assert.equal(TELEGRAM_PANEL_COMMANDS.some(command => command.command === "campanha2"), false);
            assert.equal(TELEGRAM_PANEL_COMMANDS.some(command => command.command === "discover-batch"), false);
            assert.equal(TELEGRAM_PANEL_COMMANDS.every(command => /^[a-z0-9_]+$/.test(command.command)), true);
            assert.match(renderReadPanelMenu(), /\\/campanhas/);
            assert.match(renderReadPanelMenu(), /\\/redes/);
            assert.doesNotMatch(renderReadPanelMenu(), /\\/campanha2/);
            const { renderAdvancedHelp } = await import("../server/services/telegramPanel");
            assert.match(renderAdvancedHelp(), /\\/campanha2/);
          });'''
          s, count = re.subn(pattern, lambda _: replacement, s, count=1)
          if count != 1:
              raise SystemExit(f'newsletter V2 test count={count}')
          newsletter.write_text(s, encoding='utf-8')

          social = Path('tests/socialLinks.test.ts')
          s = social.read_text(encoding='utf-8')
          s, count = re.subn(
              r'const panel = readFileSync\(new URL\("\.\./server/services/telegramPanel\.ts", import\.meta\.url\), "utf8"\);',
              'const commands = readFileSync(new URL("../server/services/telegramCommands.ts", import.meta.url), "utf8");',
              s,
              count=1,
          )
          if count != 1:
              raise SystemExit(f'social import count={count}')
          s, count = re.subn(
              r'assert\.match\(panel, /command: "redes"/\);',
              'assert.match(commands, /name: "redes"/);',
              s,
              count=1,
          )
          if count != 1:
              raise SystemExit(f'social command count={count}')
          social.write_text(s, encoding='utf-8')

          trigger = Path('.github/scripts/apply_telegram_v2.py')
          trigger.write_text(trigger.read_text(encoding='utf-8').rstrip() + '\n# validation trigger: global V2 contracts migrated\n', encoding='utf-8')
          PY
      - name: Commit migrated tests and remove one-shot workflow
        run: |
          git config user.name "kauabrennan5-bit"
          git config user.email "kauabrennan5@gmail.com"
          git rm .github/workflows/patch-v2-global-tests.yml
          git add tests/newsletterCampaign.test.ts tests/socialLinks.test.ts .github/scripts/apply_telegram_v2.py
          git diff --cached --check
          git commit -m "test: align global Telegram contracts with bot v2"
          git push origin HEAD:refactor/telegram-bot-v2-2026-08-28
