name: Daily Production Invariant

on:
  schedule:
    - cron: "30 2 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/daily-production-invariant.yml"
      - "scripts/run-autonomous-curator-invariant-direct.ts"

permissions:
  contents: read

concurrency:
  group: cerberus-daily-production-invariant
  cancel-in-progress: false

jobs:
  invariant:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push' || vars.CERBERUS_SERVERLESS_CURATOR_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      SUPABASE_URL: https://ppsxlclycyinhhoqijvz.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.1
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Observe catalog invariant directly
        run: npx tsx scripts/run-autonomous-curator-invariant-direct.ts
