name: Daily Production Invariant

on:
  schedule:
    - cron: "30 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cerberus-daily-production-invariant
  cancel-in-progress: false

jobs:
  invariant:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      SUPABASE_URL: https://ppsxlclycyinhhoqijvz.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.1
          cache: npm
      - run: npm ci
      - name: Observe governed catalog invariant directly
        run: |
          npx tsx scripts/run-serverless-ops-direct.ts curator-invariant
          echo "DAILY_INVARIANT=OBSERVATIONAL_MANUAL_APPROVAL_MODE"
