name: Daily Production Invariant

on:
  schedule:
    - cron: "30 2 * * *"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: cerberus-daily-production-invariant
  cancel-in-progress: false

jobs:
  invariant:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CERBERUS_HEALTH_URL: https://cerberus-forge-deploy-backend.onrender.com/health
      OIDC_AUDIENCE: cerberus-weekly-automation
    steps:
      - name: Observe catalog state
        shell: bash
        run: |
          set -euo pipefail
          base="${CERBERUS_HEALTH_URL%/health}"
          get_token() {
            local json token
            json="$(curl --fail --silent --show-error --max-time 20 -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${OIDC_AUDIENCE}")"
            token="$(node -e 'const b=JSON.parse(process.argv[1]); if(typeof b.value!=="string"||!b.value) process.exit(1); process.stdout.write(b.value)' "$json")"
            echo "::add-mask::$token" >&2
            printf '%s' "$token"
          }
          token="$(get_token)"
          curl --fail-with-body --silent --show-error --max-time 90 -H "Authorization: Bearer ${token}" -o invariant.json "$base/api/internal/autonomous-curator/invariant"
          cat invariant.json
          echo "DAILY_INVARIANT=OBSERVATIONAL_MANUAL_APPROVAL_MODE"