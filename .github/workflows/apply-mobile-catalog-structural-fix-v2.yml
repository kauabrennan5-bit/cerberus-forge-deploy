name: Apply mobile catalog structural fix v2

on:
  push:
    branches:
      - fix/mobile-catalog-categories-2026-08-28
    paths:
      - .github/workflows/apply-mobile-catalog-structural-fix-v2.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/mobile-catalog-categories-2026-08-28
          fetch-depth: 0

      - name: Reuse audited patch with robust App block matching
        run: |
          python <<'BOOT'
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/apply-mobile-catalog-structural-fix.yml').read_text(encoding='utf-8')
          lines = workflow.splitlines()
          start = next(i for i, line in enumerate(lines) if line.strip() == "python <<'PY'") + 1
          end = next(i for i in range(start, len(lines)) if lines[i].strip() == 'PY')
          script = textwrap.dedent('\n'.join(lines[start:end])) + '\n'

          def replace_script_block(source: str, start_marker: str, end_marker: str, replacement: str, label: str) -> str:
              start_at = source.find(start_marker)
              if start_at < 0:
                  raise SystemExit(f'Bootstrap could not find {label} start marker')
              end_at = source.find(end_marker, start_at)
              if end_at < 0:
                  raise SystemExit(f'Bootstrap could not find {label} end marker')
              end_at += len(end_marker)
              return source[:start_at] + replacement + source[end_at:]

          restore_replacement_script = '''restore_pattern = re.compile(
              r"  const restoreCatalogScroll = useCallback\\(\\(\\) => \\{.*?\\n  \\}, \\[\\]\\);\\n\\n",
              re.S,
          )
          restore_replacement = """  const queueScrollRestore = useCallback((path: string, y: number) => {
            pendingScrollRestoreRef.current = { path, y: Math.max(0, Math.round(y || 0)) };
          }, []);

          """
          text, count = restore_pattern.subn(restore_replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'App restoration queue: expected 1 occurrence, found {count}')
          '''
          script = replace_script_block(
              script,
              'old_restore = """',
              "    'App restoration queue',\n)\n",
              restore_replacement_script,
              'restore block',
          )

          direct_detail_replacement_script = '''found_pattern = re.compile(
              r"          if \\(found\\) \\{\\n            setSelectedProduct\\(found\\);\\n            setCurrentView\\('product-detail'\\);\\n          \\}",
          )
          found_replacement = """          if (found) {
            setSelectedProduct(found);
            setCurrentView('product-detail');
            const existingEntry = readCerberusHistoryEntry(window.history.state);
            if (existingEntry?.view !== 'product-detail') {
              window.history.replaceState(
                mergeCerberusHistoryState(
                  window.history.state,
                  createProductHistoryState(found.slug || found.id, 0, { canGoBack: false, fromView: 'other' }),
                ),
                '',
                window.location.href,
              );
            }
          }"""
          text, count = found_pattern.subn(found_replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'App direct detail history: expected 1 occurrence, found {count}')
          '''
          script = replace_script_block(
              script,
              'old_found = """',
              "text = replace_once(text, old_found, new_found, 'App direct detail history')\n",
              direct_detail_replacement_script,
              'direct-detail block',
          )

          Path('/tmp/mobile_catalog_patch.py').write_text(script, encoding='utf-8')
          BOOT
          python /tmp/mobile_catalog_patch.py

      - name: Install dependencies
        run: npm ci

      - name: Validate TypeScript and related contract
        run: |
          npm run lint
          node --import tsx/esm --test --test-concurrency=1 --test-reporter=spec tests/relatedProductsCarousel.test.ts

      - name: Commit structural changes and remove patch workflows
        run: |
          git rm .github/workflows/apply-mobile-catalog-structural-fix.yml
          git rm .github/workflows/apply-mobile-catalog-structural-fix-v2.yml
          git config user.name "kauabrennan5-bit"
          git config user.email "kauabrennan5@gmail.com"
          git add src/App.tsx src/components/ProductGrid.tsx src/components/ProductDetail.tsx tests/relatedProductsCarousel.test.ts
          git diff --cached --check
          git commit -m "fix(mobile): restore catalog context and native related scrolling"
          git push origin HEAD:fix/mobile-catalog-categories-2026-08-28
