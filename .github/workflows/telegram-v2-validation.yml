name: Telegram V2 Validation Temp

on:
  push:
    branches:
      - refactor/telegram-bot-v2-validation-2026-08-28
    paths:
      - .github/workflows/telegram-v2-validation.yml
      - .github/scripts/telegram_v2_validation_patch.py

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TELEGRAM_ALLOWED_USER_IDS: "1976526372,888111222,999000111"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply candidate fixes
        run: |
          python3 .github/scripts/telegram_v2_validation_patch.py
          git show 6c955107c59cb5518d58b762ade9435b6168e0f7:.github/workflows/telegram-contract.yml > .github/workflows/telegram-contract.yml

      - name: Guard intended files
        run: |
          actual="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' .github/workflows/telegram-contract.yml server/services/telegramPanel.ts tests/publishCommand.test.ts tests/telegramReadPanel.test.ts | sort)"
          test "$actual" = "$expected"
          if git diff | grep -E '^\+.*\b(test\.(skip|todo|only)|describe\.(skip|only)|it\.(skip|todo|only))\b'; then exit 1; fi

      - name: publishCommand isolated
        run: node --import tsx --test --test-concurrency=1 tests/publishCommand.test.ts

      - name: telegramReadPanel isolated
        run: node --import tsx --test --test-concurrency=1 tests/telegramReadPanel.test.ts

      - name: Bot V2 focused tests
        run: |
          set -o pipefail
          node --import tsx --test --test-concurrency=1 tests/publishCommand.test.ts tests/telegramAndMarketplace.test.ts tests/telegramDiagnostics.test.ts tests/telegramReadPanel.test.ts tests/telegramUiContract.test.ts tests/newsletterCampaign.test.ts tests/promotionReview.test.ts tests/socialLinks.test.ts 2>&1 | tee bot-v2-focused.log
          grep -E '^# tests [0-9]+$' bot-v2-focused.log | tail -1

      - name: Bot V2 invariants
        run: |
          node --import tsx --test --test-concurrency=1 tests/telegramUiContract.test.ts
          python3 - <<'PY'
          from pathlib import Path
          commands = Path('server/services/telegramCommands.ts').read_text()
          panel = Path('server/services/telegramPanel.ts').read_text()
          bot = Path('server/services/telegramBot.ts').read_text()
          assert 'const commands = PRIMARY_TELEGRAM_COMMANDS.map' in panel
          assert '...PRIMARY_TELEGRAM_COMMANDS.map' in commands
          assert '...SECONDARY_TELEGRAM_COMMANDS.map' in commands
          for token in ['discover', 'research', 'assess', 'priority', 'shopee-schema', 'shopee-offer']:
              assert f'"{token}"' in commands
          assert 'isUserAllowed' in bot
          print('BOT_V2_INVARIANTS=PASS')
          PY

      - name: Full global test suite
        run: npm test

      - name: TypeScript and lint
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Diff check
        run: git diff --check

      - name: Secret scan
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.28.0 detect --source /repo --no-git --redact --exit-code 1

      - name: Commit validated candidate to temp branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/telegram-contract.yml server/services/telegramPanel.ts tests/publishCommand.test.ts tests/telegramReadPanel.test.ts
          git diff --cached --check
          git commit -m "validation: stabilize telegram bot v2"
          git push origin HEAD:${GITHUB_REF_NAME}
