name: Cerberus Autonomous Curator Human Review Once
# Temporary migration proof. A push of this file to main runs exactly one review-only Curator pass.
# Proof attempt 2: Shopee empty-base-url fallback is now on main.
# There is deliberately no schedule and no workflow_dispatch. Publication remains a separate human callback.

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/autonomous-curator-human-review-once.yml"

permissions:
  contents: read

concurrency:
  group: cerberus-autonomous-curator-production
  cancel-in-progress: false

jobs:
  human-review-once:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      SUPABASE_URL: https://ppsxlclycyinhhoqijvz.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      SHOPEE_APP_ID: ${{ secrets.SHOPEE_APP_ID }}
      SHOPEE_APP_SECRET: ${{ secrets.SHOPEE_APP_SECRET }}
      SHOPEE_AFFILIATE_APP_ID: ${{ secrets.SHOPEE_AFFILIATE_APP_ID }}
      SHOPEE_AFFILIATE_APP_SECRET: ${{ secrets.SHOPEE_AFFILIATE_APP_SECRET }}
      SHOPEE_AFFILIATE_API_BASE_URL: ${{ vars.SHOPEE_AFFILIATE_API_BASE_URL }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_ALLOWED_USER_IDS: ${{ secrets.TELEGRAM_ALLOWED_USER_IDS }}
      TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
      TELEGRAM_ADMIN_USER_ID: ${{ secrets.TELEGRAM_ADMIN_USER_ID }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_PRODUCT_CURATOR_MODEL: ${{ vars.GEMINI_PRODUCT_CURATOR_MODEL }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.1
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run exactly one review-only Curator pass
        run: npx tsx scripts/run-autonomous-curator-direct.ts manual_review
