name: Curator Recovery Bootstrap

on:
  push:
    branches:
      - feat/curator-recovery-official-fallbacks

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/curator-recovery-official-fallbacks
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Patch curator recovery behavior
        run: |
          python3 scripts/curator-recovery-patch.py
          python3 scripts/curator-recovery-fixup.py
          python3 scripts/curator-recovery-ts-fixup.py

      - name: Install dependencies
        run: npm ci

      - name: Focused curator tests
        run: node --import tsx/esm --test --test-concurrency=1 tests/autonomousCurator.test.ts tests/productImageRepair.test.ts

      - name: TypeScript
        run: npm run lint

      - name: Global tests
        id: global_tests
        shell: bash
        run: |
          set +e
          npm test > global-tests.log 2>&1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          tail -n 250 global-tests.log
          exit 0

      - name: Upload global test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: curator-global-test-log
          path: global-tests.log
          if-no-files-found: error
          retention-days: 1

      - name: Enforce global tests
        if: steps.global_tests.outputs.exit_code != '0'
        run: exit 1

      - name: Build
        run: npm run build

      - name: Commit validated changes and remove bootstrap
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/curator-recovery-bootstrap.yml scripts/curator-recovery-patch.py scripts/curator-recovery-fixup.py scripts/curator-recovery-ts-fixup.py
          git add server/services/autonomousCurator.ts server/services/autonomousCuratorProfiles.ts server/services/productAutomation.ts server/services/productImageRepair.ts tests/autonomousCurator.test.ts tests/productImageRepair.test.ts supabase/migrations/20260830_autonomous_curator_recovery.sql public/data/products.json
          git commit -m "feat: keep autonomous curator searching until qualified candidate"
          git push origin HEAD:feat/curator-recovery-official-fallbacks
