name: Patch curator cross-provider resilience

on:
  push:
    branches:
      - fix/curator-cross-provider-budget-resilience-2026-08-30

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/curator-cross-provider-budget-resilience-2026-08-30
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply cross-provider resilience patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("server/services/productImageReview.ts")
          text = path.read_text()

          text = text.replace(
              'openaiProductImageReview: positiveInt(process.env.OPENAI_PRODUCT_IMAGE_REVIEW_HOURLY_BUDGET, 24),',
              'openaiProductImageReview: positiveInt(process.env.OPENAI_PRODUCT_IMAGE_REVIEW_HOURLY_BUDGET, 256),',
              1,
          )
          anchor = 'const DEFAULT_OPENAI_IMAGE_REVIEW_MODEL = "gpt-5.6-luna";'
          assert text.count(anchor) == 1
          text = text.replace(anchor, anchor + '\nconst DEFAULT_OPENAI_IMAGE_REVIEW_FALLBACK_MODEL = "gpt-4.1-mini";', 1)

          resolver = '''function resolveOpenAIImageReviewModel(env: NodeJS.ProcessEnv): string {
            return String(env.OPENAI_PRODUCT_IMAGE_REVIEW_MODEL || "").trim() || DEFAULT_OPENAI_IMAGE_REVIEW_MODEL;
          }
          '''
          assert text.count(resolver) == 1
          text = text.replace(resolver, resolver + '''
          function resolveOpenAIImageReviewFallbackModel(env: NodeJS.ProcessEnv, primaryModel: string): string | null {
            const configured = String(env.OPENAI_PRODUCT_IMAGE_REVIEW_FALLBACK_MODEL || "").trim() || DEFAULT_OPENAI_IMAGE_REVIEW_FALLBACK_MODEL;
            return configured && configured !== primaryModel ? configured : null;
          }
          ''', 1)

          text = text.replace('    reasoning: { effort: "none" },\n', '', 1)

          start = text.index('async function reviewWithOpenAIFallback(input: {')
          end = text.index('\nexport async function reviewProductImages', start)
          replacement = '''async function reviewWithOpenAIFallback(input: {
            rawImageUrls: string[];
            downloaded: DownloadedImage[];
            title: string;
            env: NodeJS.ProcessEnv;
            openaiApiKey: string;
            primaryAssessments: ProductImageAssessment[];
            budget: BudgetLike;
            review: OpenAIReview;
          }): Promise<{ attempted: boolean; budgetExhausted: boolean; assessments: ProductImageAssessment[] }> {
            if (!input.openaiApiKey || !enabledUnlessFalse(input.env.OPENAI_PRODUCT_IMAGE_REVIEW_ENABLED)) {
              return { attempted: false, budgetExhausted: false, assessments: input.primaryAssessments };
            }
            if (!needsCrossProviderFallback(input.rawImageUrls, input.downloaded, input.primaryAssessments)) {
              return { attempted: false, budgetExhausted: false, assessments: input.primaryAssessments };
            }

            const callModel = async (model: string): Promise<ProductImageAssessment[]> => input.review({
              rawImageUrls: input.rawImageUrls,
              downloaded: input.downloaded,
              title: input.title,
              model,
              apiKey: input.openaiApiKey,
              timeoutMs: positiveInt(input.env.OPENAI_PRODUCT_IMAGE_REVIEW_TIMEOUT_MS, 20_000),
            });
            const merge = (fallbackAssessments: ProductImageAssessment[]) => ({
              attempted: true,
              budgetExhausted: false,
              assessments: mergeCrossProviderAssessments(input.downloaded, input.primaryAssessments, fallbackAssessments),
            });

            const primaryModel = resolveOpenAIImageReviewModel(input.env);
            const fallbackModel = resolveOpenAIImageReviewFallbackModel(input.env, primaryModel);
            const primaryReserved = input.budget.reserve("openaiProductImageReview");
            if (!primaryReserved.allowed) return { attempted: false, budgetExhausted: true, assessments: input.primaryAssessments };

            try {
              return merge(await callModel(primaryModel));
            } catch (primaryError) {
              if (!fallbackModel) {
                console.warn(`[Product Image Review] fallback OpenAI indisponível (${transientProviderFailure(primaryError) ? "transient" : quotaProviderFailure(primaryError) ? "quota" : permanentProviderFailure(primaryError) ? "permanent" : "invalid_response"})`);
                return { attempted: true, budgetExhausted: false, assessments: input.primaryAssessments };
              }
              const secondaryReserved = input.budget.reserve("openaiProductImageReview");
              if (!secondaryReserved.allowed) return { attempted: true, budgetExhausted: true, assessments: input.primaryAssessments };
              try {
                return merge(await callModel(fallbackModel));
              } catch (secondaryError) {
                console.warn(`[Product Image Review] fallback OpenAI indisponível em ambos os modelos (primary=${transientProviderFailure(primaryError) ? "transient" : quotaProviderFailure(primaryError) ? "quota" : permanentProviderFailure(primaryError) ? "permanent" : "invalid_response"}, secondary=${transientProviderFailure(secondaryError) ? "transient" : quotaProviderFailure(secondaryError) ? "quota" : permanentProviderFailure(secondaryError) ? "permanent" : "invalid_response"})`);
                return { attempted: true, budgetExhausted: false, assessments: input.primaryAssessments };
              }
            }
          }
          '''
          text = text[:start] + replacement + text[end:]

          export_anchor = '  resolveOpenAIImageReviewModel,\n'
          assert text.count(export_anchor) == 1
          text = text.replace(export_anchor, export_anchor + '  resolveOpenAIImageReviewFallbackModel,\n', 1)
          path.write_text(text)

          tests_path = Path("tests/productImageReviewOpenAI.test.ts")
          tests = tests_path.read_text()
          assertion_anchor = '  assert.equal(productImageReviewInternals.resolveOpenAIImageReviewModel({ OPENAI_PRODUCT_IMAGE_REVIEW_MODEL: "custom-openai-model" }), "custom-openai-model");\n'
          assert tests.count(assertion_anchor) == 1
          tests = tests.replace(assertion_anchor, assertion_anchor + '  assert.equal(productImageReviewInternals.resolveOpenAIImageReviewFallbackModel({}, "gpt-5.6-luna"), "gpt-4.1-mini");\n', 1)

          marker = 'test("OpenAI resolve apenas decisão ambígua e não sobrescreve rejeição forte do Gemini", async () => {'
          assert tests.count(marker) == 1
          added = '''test("OpenAI usa modelo secundário quando o primário não está disponível", async () => {
            const models: string[] = [];
            let reserves = 0;
            const openaiBudget = {
              reserve() {
                reserves += 1;
                return { allowed: true, used: reserves, limit: 256, resetAt: Date.now() + 60_000 };
              },
            };
            const result = await reviewProductImages(["https://cdn.example.test/a.jpg"], "Luminária", {
              env: { OPENAI_API_KEY: "openai-test" },
              budget: denyBudget,
              openaiBudget,
              allowRepair: false,
              fetchImpl: (async () => imageResponse()) as typeof fetch,
              openaiReview: async input => {
                models.push(input.model);
                if (input.model === "gpt-5.6-luna") throw new Error("OPENAI_IMAGE_REVIEW_HTTP_404");
                return [{ url: input.downloaded[0].url, decision: "clean", confidence: "HIGH", reason: "fallback visual compatível" }];
              },
            });
            assert.deepEqual(models, ["gpt-5.6-luna", "gpt-4.1-mini"]);
            assert.equal(reserves, 2);
            assert.equal(result.status, "ready");
          });

          '''
          tests = tests.replace(marker, added + marker, 1)
          tests_path.write_text(tests)
          PY
      - name: Focused image-review tests
        run: node --import tsx/esm --test --test-concurrency=1 tests/productImageReview.test.ts tests/productImageReviewOpenAI.test.ts
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Diff check
        run: git diff --check
      - name: Commit tested patch and remove staging workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "kauabrennan5-bit"
          git config user.email "kauabrennan5@gmail.com"
          git rm .github/workflows/patch-curator-cross-provider-resilience.yml
          git add server/services/productImageReview.ts tests/productImageReviewOpenAI.test.ts
          git commit -m "fix: harden cross-provider visual review fallback"
          git push origin HEAD:fix/curator-cross-provider-budget-resilience-2026-08-30
