name: Apply Public Catalog Invariant

on:
  push:
    branches:
      - fix/public-catalog-invariant-2026-09-04
    paths:
      - scripts/apply-public-catalog-invariant.mjs
      - .github/workflows/apply-public-catalog-invariant.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/public-catalog-invariant-2026-09-04
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply guarded patch
        run: node scripts/apply-public-catalog-invariant.mjs
      - name: Focused invariant tests
        run: npx tsx --test tests/publicCatalogEligibilityInvariant.test.ts tests/autonomousCuratorCategoryBalancePolicy.test.ts tests/catalogRuntimeProjection.test.ts tests/operatorV2FacadeIntegration.test.ts
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Remove temporary applicator
        run: rm scripts/apply-public-catalog-invariant.mjs .github/workflows/apply-public-catalog-invariant.yml
      - name: Commit validated patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: align public catalog health and category invariant"
          git push origin HEAD:fix/public-catalog-invariant-2026-09-04
