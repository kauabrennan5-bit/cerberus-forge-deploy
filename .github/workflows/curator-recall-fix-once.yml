name: Curator Recall 1.6 Patch Once

on:
  push:
    branches:
      - fix/curator-best-products-recall-2026-08-30
    paths:
      - ".github/workflows/curator-recall-fix-once.yml"

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/curator-best-products-recall-2026-08-30
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Recover and apply validated recall 1.6 code patch
        shell: bash
        run: |
          set -euo pipefail
          git show 7e54715e01d3e95c675eeadb6f5b61ebf190121c:.github/workflows/curator-recall-fix-once.yml > "$RUNNER_TEMP/previous-helper.yml"
          python3 <<'EXTRACT'
          from pathlib import Path
          import os

          runner_temp = Path(os.environ["RUNNER_TEMP"])
          text = (runner_temp / "previous-helper.yml").read_text()
          marker = "          python3 <<'PY'\n"
          start = text.index(marker) + len(marker)
          end = text.index("\n          PY", start)
          body = text[start:end]
          lines = [line[10:] if line.startswith("          ") else line for line in body.splitlines()]
          patch = "\n".join(lines) + "\n"
          cutoff = patch.index('workflow = ".github/workflows/autonomous-curator.yml"')
          (runner_temp / "recall-patch.py").write_text(patch[:cutoff])
          EXTRACT
          python3 "$RUNNER_TEMP/recall-patch.py"

      - name: Focused curator tests
        run: >-
          node --import tsx/esm --test --test-concurrency=1
          tests/autonomousCurator*.test.ts

      - name: TypeScript
        run: npm run lint

      - name: Diff check
        run: git diff --check

      - name: Commit and push validated non-workflow patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/services/autonomousCuratorProfiles.ts \
                  server/services/autonomousCuratorScoring.ts \
                  server/services/autonomousCuratorContinuousV2.ts \
                  tests/autonomousCuratorContinuousV2.test.ts \
                  tests/autonomousCuratorCerberusGate.test.ts \
                  tests/autonomousCuratorShopeeRecall14.test.ts \
                  tests/autonomousCuratorProfiles.test.ts \
                  tests/autonomousCuratorRecallExpansion.test.ts
          git diff --cached --check
          git commit -m "fix: rank best curator candidates before publication"
          git push origin HEAD:fix/curator-best-products-recall-2026-08-30
