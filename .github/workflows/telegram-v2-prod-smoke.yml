name: Telegram V2 production smoke read-only

on:
  push:
    branches:
      - "ops/telegram-v2-prod-smoke-2026-08-28"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      EXPECTED_SHA: "4bf399592ea6eaf3a0005c0c9a9e05ec666a05da"
      BACKEND_URL: "https://cerberus-forge-deploy-backend.onrender.com"
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
    steps:
      - name: Wait for production SHA
        shell: bash
        run: |
          set -euo pipefail
          matched=false
          for i in $(seq 1 36); do
            if body="$(curl -fsS --max-time 15 "$BACKEND_URL/health")"; then
              version="$(printf '%s' "$body" | jq -r '.version // ""')"
              status="$(printf '%s' "$body" | jq -r '.status // ""')"
              echo "health_attempt=$i status=$status version=$version"
              if [ "$status" = "ok" ] && [ "$version" = "$EXPECTED_SHA" ]; then
                printf '%s\n' "$body" > health.json
                matched=true
                break
              fi
            else
              echo "health_attempt=$i unavailable"
            fi
            sleep 10
          done
          [ "$matched" = true ] || { echo "Expected deployed SHA not observed"; exit 1; }

      - name: Production Telegram diagnostics
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --max-time 15 "$BACKEND_URL/api/telegram-status" > telegram-status.json
          jq -e --arg sha "$EXPECTED_SHA" '
            .backendSha == $sha
            and .tokenConfigured == true
            and .effectiveWhitelistConfigured == true
            and .webhookConfigured == true
            and .webhookMatchesExpectedUrl == true
            and .apiHealthy == true
          ' telegram-status.json >/dev/null
          jq '{
            configured,
            tokenConfigured,
            whitelistConfigured,
            effectiveWhitelistConfigured,
            webhookConfigured,
            webhookMatchesExpectedUrl,
            pendingUpdates,
            allowedUpdates,
            apiHealthy,
            backendReady,
            secretConfigured,
            operatorState,
            operatorStateReason,
            backendSha
          }' telegram-status.json

      - name: Telegram API read-only smoke
        shell: bash
        run: |
          set -euo pipefail
          [ -n "$TELEGRAM_BOT_TOKEN" ] || { echo "TELEGRAM_BOT_TOKEN secret missing"; exit 1; }
          api="https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}"
          curl -fsS --max-time 15 "$api/getMe" > getme.json
          curl -fsS --max-time 15 "$api/getMyCommands" > commands.json
          curl -fsS --max-time 15 "$api/getWebhookInfo" > webhook.json
          jq -e '.ok == true' getme.json >/dev/null
          jq -e '.ok == true and (.result | length) == 10' commands.json >/dev/null
          jq -e '.ok == true' webhook.json >/dev/null
          echo "BOT_OK=true"
          echo "NATIVE_MENU_COMMANDS=$(jq '.result | length' commands.json)"
          echo "COMMANDS=$(jq -r '[.result[].command] | join(",")' commands.json)"
          echo "WEBHOOK_PENDING=$(jq '.result.pending_update_count // 0' webhook.json)"
          echo "WEBHOOK_LAST_ERROR_DATE=$(jq '.result.last_error_date // null' webhook.json)"

      - name: Build sanitized smoke summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "EXPECTED_SHA=$EXPECTED_SHA"
            if [ -f health.json ]; then
              echo "HEALTH_STATUS=$(jq -r '.status // "unknown"' health.json)"
              echo "LIVE_VERSION_SHA=$(jq -r '.version // "unknown"' health.json)"
            else
              echo "HEALTH_STATUS=unavailable"
              echo "LIVE_VERSION_SHA=unavailable"
            fi
            if [ -f telegram-status.json ]; then
              echo "BACKEND_SHA=$(jq -r '.backendSha // "unknown"' telegram-status.json)"
              echo "TELEGRAM_API_HEALTHY=$(jq -r '.apiHealthy // false' telegram-status.json)"
              echo "WHITELIST_EFFECTIVE=$(jq -r '.effectiveWhitelistConfigured // false' telegram-status.json)"
              echo "WEBHOOK_CONFIGURED=$(jq -r '.webhookConfigured // false' telegram-status.json)"
              echo "WEBHOOK_MATCHES=$(jq -r '.webhookMatchesExpectedUrl // false' telegram-status.json)"
              echo "PENDING_UPDATES=$(jq -r '.pendingUpdates // "unknown"' telegram-status.json)"
              echo "OPERATOR_STATE=$(jq -r '.operatorState // "unknown"' telegram-status.json)"
            fi
            if [ -f commands.json ]; then
              echo "NATIVE_MENU_COMMANDS=$(jq '.result | length' commands.json)"
              echo "COMMANDS=$(jq -r '[.result[].command] | join(",")' commands.json)"
            fi
            if [ -f getme.json ]; then
              echo "BOT_API_OK=$(jq -r '.ok // false' getme.json)"
            fi
            if [ -f webhook.json ]; then
              echo "WEBHOOK_API_OK=$(jq -r '.ok // false' webhook.json)"
              echo "WEBHOOK_PENDING=$(jq -r '.result.pending_update_count // "unknown"' webhook.json)"
              echo "WEBHOOK_LAST_ERROR_DATE=$(jq -r '.result.last_error_date // "none"' webhook.json)"
            fi
          } > prod-smoke-summary.txt
          cat prod-smoke-summary.txt

      - name: Upload sanitized smoke summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: telegram-v2-prod-smoke-summary
          if-no-files-found: error
          retention-days: 2
          path: prod-smoke-summary.txt
