name: Supabase Rebuild Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-rebuild-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  supabase-rebuild-gate:
    name: supabase-rebuild-gate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate migration ordering and bootstrap references
        run: node scripts/validate-supabase-migrations.mjs

      - name: Setup pinned Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.116.0

      - name: Start local Postgres
        run: supabase db start

      - name: Rebuild database from zero
        run: supabase db reset

      - name: Verify exact LIVE schema contract
        shell: bash
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          DB_URL='postgresql://postgres:postgres@127.0.0.1:54322/postgres'
          EXPECTED='22037468b4821205c16a0a87d491f57b|44|44|0|1|9|3|196'
          ACTUAL="$(psql "$DB_URL" -X -qAt <<'SQL'
          with lines as (
            select 'TABLE|' || c.relname as line from pg_class c join pg_namespace n on n.oid=c.relnamespace where n.nspname='public' and c.relkind in ('r','p')
            union all select 'RLS|' || c.relname from pg_class c join pg_namespace n on n.oid=c.relnamespace where n.nspname='public' and c.relkind in ('r','p') and c.relrowsecurity
            union all select 'POLICY|' || tablename || '|' || policyname || '|' || cmd || '|' || coalesce(qual,'') || '|' || coalesce(with_check,'') from pg_policies where schemaname='public'
            union all select 'SEQUENCE|' || c.relname from pg_class c join pg_namespace n on n.oid=c.relnamespace where n.nspname='public' and c.relkind='S'
            union all select 'FUNCTION|' || p.proname || '(' || pg_get_function_identity_arguments(p.oid) || ')|' || p.prokind::text from pg_proc p join pg_namespace n on n.oid=p.pronamespace where n.nspname='public'
            union all select 'TRIGGER|' || c.relname || '|' || t.tgname || '|' || pg_get_triggerdef(t.oid, true) from pg_trigger t join pg_class c on c.oid=t.tgrelid join pg_namespace n on n.oid=c.relnamespace where n.nspname='public' and not t.tgisinternal
            union all select 'INDEX|' || indexname || '|' || indexdef from pg_indexes where schemaname='public'
          ), canonical as (select string_agg(line, E'\n' order by line) as manifest from lines)
          select md5(manifest) || '|' ||
            (select count(*) from pg_class c join pg_namespace n on n.oid=c.relnamespace where n.nspname='public' and c.relkind in ('r','p')) || '|' ||
            (select count(*) from pg_class c join pg_namespace n on n.oid=c.relnamespace where n.nspname='public' and c.relkind in ('r','p') and c.relrowsecurity) || '|' ||
            (select count(*) from pg_policies where schemaname='public') || '|' ||
            (select count(*) from pg_class c join pg_namespace n on n.oid=c.relnamespace where n.nspname='public' and c.relkind='S') || '|' ||
            (select count(*) from pg_proc p join pg_namespace n on n.oid=p.pronamespace where n.nspname='public') || '|' ||
            (select count(*) from pg_trigger t join pg_class c on c.oid=t.tgrelid join pg_namespace n on n.oid=c.relnamespace where n.nspname='public' and not t.tgisinternal) || '|' ||
            (select count(*) from pg_indexes where schemaname='public')
          from canonical;
          SQL
          )"
          echo "Expected LIVE contract: $EXPECTED"
          echo "Local rebuild contract: $ACTUAL"
          if [[ "$ACTUAL" != "$EXPECTED" ]]; then
            echo '::error::Local rebuild does not exactly match the certified LIVE public-schema contract.'
            echo 'Local index manifest follows for deterministic diffing:'
            psql "$DB_URL" -X -qAt -c "select indexname || '|' || indexdef from pg_indexes where schemaname='public' order by indexname;"
            exit 1
          fi

      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup || true
